notes: >-
  One of five IGMDP missiles. Development began mid-1980s (first test ~1985); persistent technical
  issues led to formal closure circa 2008 without operational induction. Range ~9-12 km, warhead
  ~5.5 kg are reported figures from secondary/tertiary sources. Strong primary sourcing is limited
  because the programme predates the modern PIB online archive.
