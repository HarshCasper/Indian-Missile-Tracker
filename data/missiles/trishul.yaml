id: trishul
name: Trishul
aka:
  - Trident
category: surface-to-air
range_class: SAM
developer: DRDO (under IGMDP)
status: cancelled
range_km:
  min: 0.5
  max: 12
payload_kg: 5.5
nuclear_capable: false
propulsion: solid
launch_platform:
  - land-based launcher
  - naval ship
  - tested for multiple roles
first_test: "1985-01-01"
description: >-
  Trishul was a low-level, quick-reaction, short-range surface-to-air missile developed by DRDO as
  one of the five projects under the Integrated Guided Missile Development Programme (IGMDP).
  Intended to defend against low-level (including sea-skimming) targets for the Army, Navy and Air
  Force, it had a range of about 9-12 km and a roughly 5.5 kg warhead with command-to-line-of-sight
  guidance. The project suffered persistent technical problems and missed performance goals, and was
  officially closed around 2008. Its short-range air-defence role was subsequently filled by
  imported and co-developed systems.
