notes: >-
  Name derives from the Brahmaputra and Moskva rivers. Based on Russia's P-800 Oniks/Yakhont.
  Baseline 290 km range was an MTCR-imposed cap; extended to 450 km after India's 2016 MTCR entry.
  Officially a conventional precision-strike weapon; classified as conventional (non-nuclear). First
  combat use reported during India-Pakistan exchanges in May 2025 (Operation Sindoor, per Indian
  press).
