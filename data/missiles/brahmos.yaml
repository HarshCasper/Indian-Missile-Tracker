id: brahmos
name: BrahMos
aka:
  - PJ-10
  - BrahMos Block I/II/III
category: cruise
range_class: cruise
developer: BrahMos Aerospace (DRDO, India + NPO Mashinostroyeniya/NPOM, Russia)
operators:
  - India (Army, Navy, Air Force)
  - Philippines (export)
status: operational
range_km:
  min: 290
  max: 450
payload_kg: 300
speed_mach: 2.8
nuclear_capable: false
propulsion: solid+liquid
launch_platform:
  - land mobile autonomous launcher
  - ship (vertical/inclined)
  - submarine
  - aircraft (Su-30MKI)
variants:
  - name: Ship-launched (anti-ship/land-attack)
    notes: Inclined and vertical launch configurations on Indian Navy frontline ships.
  - name: Land-attack (Block I/II/III)
    notes: >-
      Mobile autonomous launcher; Block II added advanced target discrimination, Block III
      steep-dive/terrain capability.
  - name: Submarine-launched
    notes: Vertical-launch from submarine demonstrated in 2013.
first_test: "2001-06-12"
description: >-
  BrahMos is a two-stage supersonic cruise missile jointly developed by India's DRDO and Russia's
  NPO Mashinostroyeniya through the BrahMos Aerospace joint venture, derived from the Russian P-800
  Oniks/Yakhont. It uses a solid-propellant booster first stage and a liquid-fuelled ramjet
  sustainer to cruise at about Mach 2.8 and is deployable from land, ships, submarines and aircraft.
  The baseline operational range was 290 km (capped by MTCR rules) and was extended to 450 km after
  India joined the MTCR in 2016. It is the world's fastest operational cruise missile and was first
  exported to the Philippines.
