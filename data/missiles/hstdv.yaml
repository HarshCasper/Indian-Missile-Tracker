notes: >-
  Technology demonstrator, not a weapon; no payload/range as a deliverable system. first_test = 12
  Jun 2019 (maiden flight; failed due to booster underperformance). Successful scramjet
  demonstration 7 Sep 2020 at ~Mach 6, ~30 km altitude, >20 s. Boosted by an Agni-class solid rocket
  motor (described as 'Agni-1' in some accounts). category 'technology-demonstrator'; range_class
  'other'.
