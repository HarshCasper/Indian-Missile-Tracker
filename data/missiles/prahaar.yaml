notes: >-
  7.3 m length, 0.42 m diameter, ~1,280 kg launch weight. Demonstrated CEP under 10 m. Nuclear
  capability is disputed: developer/Indian sources frame it as conventional-only; CSIS lists nuclear
  as a possible warhead. Did not achieve full Army induction at scale; effectively superseded by the
  Pranash development effort.
