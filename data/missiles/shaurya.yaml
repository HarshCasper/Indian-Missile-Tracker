description: >-
  Shaurya is a canister-launched, road-mobile surface-to-surface ballistic missile developed by DRDO
  as the land-based derivative of the K-15 Sagarika SLBM. Like the K-15 it uses a gas generator to
  eject the missile from its canister before motor ignition, and it follows a quasi-ballistic,
  high-speed (hypersonic-class) trajectory, manoeuvring during the terminal phase to complicate
  interception. It was first test-fired on 12 November 2008 from the Integrated Test Range at
  Chandipur, reaching about Mach 5 over roughly 300 km, with a longer-range test in 2011. It is
  nuclear-capable and stored/launched from a sealed canister for rapid reaction.
