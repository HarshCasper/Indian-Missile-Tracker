notes: >-
  Land-based canister-launched derivative of the K-15 SLBM. First test 12 November 2008 from
  Chandipur ITR (reached Mach 5 over ~300 km); a second test demonstrating ~700 km full range
  followed on 24 September 2011. Range figures vary by source (700 to 1,900 km) and a
  next-generation/extended-range 'Shaurya NG' is reported in development. Categorised as
  surface-to-surface SRBM though described in the press as hypersonic.
