id: vl-srsam
name: VL-SRSAM
aka:
  - Vertical Launch Short Range Surface-to-Air Missile
category: surface-to-air
range_class: SAM
developer: DRDO (DRDL, RCI, R&DE Pune)
operators:
  - Indian Navy
status: development
range_km:
  min: 1
  max: 40
nuclear_capable: false
propulsion: solid
launch_platform:
  - naval ship (vertical launch)
  - truck-mounted launcher (planned land variant)
variants:
  - name: Naval VL-SRSAM
    notes: Ship-borne point-defence variant for the Indian Navy
  - name: Land-based VL-SRSAM
    notes: Truck-mounted variant planned for Army/IAF
first_test: "2021-02-22"
description: >-
  VL-SRSAM is an indigenous vertically launched short-range surface-to-air missile developed by
  DRDO, primarily as a ship-borne point-defence weapon to neutralise close-range aerial threats
  including sea-skimming targets. Derived from the Astra air-to-air missile airframe, it uses a
  vertical launch with thrust-vectoring for 360-degree coverage and an indigenous RF seeker for
  terminal homing. DRDO and the Indian Navy first flight-tested it on 22 February 2021, with further
  successful trials including from an Indian Naval ship in 2022. A truck-mounted land variant is
  also under development.
