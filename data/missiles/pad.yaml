notes: >-
  Phase-1 exo-atmospheric interceptor of DRDO's two-tier BMD. Non-nuclear (kinetic /
  directional-warhead hit-to-kill defensive interceptor). 'Pradyumna' is the reported alternate
  name. Now effectively replaced in the exo-atmospheric layer by the PDV; treated as
  retired/superseded. Used Israeli Green Pine (Swordfish-precursor) radar in early tests per
  reporting.
