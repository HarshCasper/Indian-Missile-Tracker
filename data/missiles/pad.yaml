first_test: "2006-11-27"
description: >-
  The Prithvi Air Defence (PAD), also called Pradyumna, was the exo-atmospheric (high-altitude)
  interceptor element of the first phase of India's two-tier Ballistic Missile Defence programme,
  developed by DRDO. First flight-tested on 27 November 2006 when it intercepted a modified
  Prithvi-II target at roughly 48-50 km altitude, it was designed to engage incoming ballistic
  missiles of the 300-2,000 km class at altitudes between about 50 and 80 km. Built around a
  Prithvi-derived first stage (liquid) with a solid second stage, the test made India the fourth
  nation to demonstrate an anti-ballistic-missile capability. The system was subsequently superseded
  in the exo-atmospheric role by the Prithvi Defence Vehicle (PDV).
