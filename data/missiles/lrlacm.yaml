    url: >-
      https://currentaffairs.adda247.com/drdo-successfully-conducts-maiden-flight-test-of-long-range-land-attack-cruise-missile-lrlacm/
confidence: confirmed
notes: >-
  Productionised, indigenised cruise missile derived from the Nirbhay/ITCM line, using the
  indigenous 'Manik' STFE turbofan. Maiden flight test 12 November 2024 confirmed by PIB. Ground-
  and ship-launched (UVLM, shared with BrahMos). No nuclear role disclosed; recorded as
  conventional. Range figures vary (~1,000 km official at test vs ~1,500 km in some reports).
