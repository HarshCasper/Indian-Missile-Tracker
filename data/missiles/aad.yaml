variants:
  - name: AAD / Ashwin
    notes: Endo-atmospheric (low-altitude) interceptor, Phase-1 BMD
first_test: "2007-12-06"
description: >-
  The Advanced Air Defence (AAD) missile, also called Ashwin, is the endo-atmospheric (low-altitude,
  in-atmosphere) interceptor of the first phase of DRDO's Ballistic Missile Defence programme. First
  flight-tested on 6 December 2007, it intercepts incoming ballistic missiles at altitudes of
  roughly 15-30 km. It is a single-stage, solid-fuelled, hit-to-kill interceptor about 7.5 m long
  weighing around 1.2 tonnes, guided by inertial navigation with mid-course radar updates and active
  terminal homing. It forms the lower tier of the two-layer shield, complementing the
  exo-atmospheric PAD/PDV interceptors.
