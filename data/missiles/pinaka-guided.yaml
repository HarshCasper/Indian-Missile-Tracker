notes: >-
  first_test = 12 Jan 2017, the first guided Pinaka flight (ARDE/RCI/DRDL). The 120 km LRGR-120
  (maiden test reported 29-30 Dec 2025; one-day source variance likely a timezone/dateline
  difference) is a later development within the guided-Pinaka lineage and captured as a variant.
  Range spans ~75 km (2017 guidance-kit rocket) to 120 km (LRGR). Payload retained at ~100 kg class.
  range_class 'other' (guided artillery rocket).
