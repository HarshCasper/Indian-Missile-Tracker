id: pinaka-guided
name: Guided Pinaka
aka:
  - Guided Pinaka rocket
  - Pinaka guided rocket
  - Pinaka Mk-II Guided
  - Pinaka Long Range Guided Rocket (LRGR-120)
category: surface-to-surface
range_class: other
developer: DRDO (ARDE Pune, Research Centre Imarat (RCI) Hyderabad, DRDL Hyderabad, HEMRL Pune)
operators:
  - Indian Army
status: operational
range_km:
  min: 75
  max: 120
payload_kg: 100
nuclear_capable: false
propulsion: solid
launch_platform:
  - Pinaka multi-barrel rocket launcher (MBRL) vehicle
variants:
  - name: Guided Pinaka (navigation/guidance/control kit on Pinaka Mk-II)
    notes: >-
      First flight tested 12 Jan 2017; precision-guided rocket using INS-based navigation, guidance
      and control kit, demonstrated range ~75 km with high accuracy.
  - name: Pinaka Long Range Guided Rocket (LRGR-120)
    notes: >-
      120 km strike-range guided rocket; maiden flight test conducted at ITR Chandipur on 29-30
      December 2025 with inertial navigation plus mid-course/terminal guidance.
first_test: "2017-01-12"
description: >-
  Guided Pinaka adds an inertial navigation, guidance and control kit to the Pinaka rocket,
  converting the free-flight artillery rocket into a precision-guided weapon with greatly improved
  accuracy (low circular error probable) and extended range. The first guided Pinaka was
  flight-tested from Launch Complex-III, ITR Chandipur on 12 January 2017, jointly developed by ARDE
  Pune, RCI Hyderabad and DRDL Hyderabad, demonstrating a range on the order of 75 km. The programme
  later progressed to the Pinaka Long Range Guided Rocket (LRGR-120), whose maiden flight test to a
  full 120 km design range was conducted at ITR Chandipur in late December 2025.
