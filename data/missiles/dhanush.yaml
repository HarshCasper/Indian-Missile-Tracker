id: dhanush
name: Dhanush
aka:
  - Prithvi-III naval variant
  - ship-launched Prithvi
category: surface-to-surface
range_class: SRBM
developer: DRDO (Defence Research and Development Organisation)
operators:
  - Indian Navy
status: operational
range_km:
  min: 250
  max: 400
payload_kg: 500
nuclear_capable: true
propulsion: liquid
launch_platform:
  - Sukanya-class offshore patrol vessels (INS Subhadra, INS Suvarna)
first_test: "2000-04-01"
description: >-
  Dhanush is the naval, ship-launched derivative of the Prithvi missile (a variant of the
  Prithvi-III/SS-250 line), developed by DRDO for the Indian Navy and fired from the reinforced
  decks of Sukanya-class offshore patrol vessels such as INS Subhadra and INS Suvarna. It is a
  single-stage liquid-fuelled short-range ballistic missile able to carry conventional or nuclear
  payloads of roughly 500-1,000 kg to about 350 km. First tested in April 2000 (a launch that failed
  after about 30 seconds), it was subsequently proven in tests around 2004 and again in 2009-2010,
  and is regarded as operational as part of India's sea-based deterrent.
