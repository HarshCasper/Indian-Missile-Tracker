id: prithvi-ii
name: Prithvi-II
aka:
  - Prithvi 2
  - SS-250
  - P-2
category: surface-to-surface
range_class: SRBM
developer: DRDO (Defence Research and Development Organisation)
operators:
  - Indian Air Force
  - Indian Army
  - Strategic Forces Command
status: operational
range_km:
  min: 250
  max: 350
payload_kg: 500
nuclear_capable: true
propulsion: liquid
launch_platform:
  - road-mobile transporter-erector-launcher (TEL)
variants:
  - name: SS-250 (Air Force version)
    notes: 250 km range with ~500 kg payload; primary user originally the Indian Air Force
first_test: "1996-01-27"
description: >-
  Prithvi-II is a single-stage, liquid-fuelled short-range surface-to-surface ballistic missile
  developed by DRDO under the IGMDP, first flight-tested on 27 January 1996. It extends the
  Prithvi-I design with upgraded guidance, achieving roughly 250-350 km range while typically
  carrying a lighter (~500 kg, up to 1,000 kg) payload. Nuclear-capable, it was first developed with
  the Indian Air Force as primary user and was later inducted into the Indian Army and Strategic
  Forces Command, where it remains in active service with periodic user training launches from
  Chandipur.
