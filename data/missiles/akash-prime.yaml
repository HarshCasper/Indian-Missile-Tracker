notes: >-
  Key differentiators are the indigenous RF seeker and high-altitude (>4,500 m) operation. The
  variant was first flight-tested on 27 Sep 2021; the widely reported high-altitude Ladakh user
  trials were July 2025. Range figures are reported, not an official single number.
