id: akash-prime
name: Akash Prime
aka:
  - Akash Prime Weapon System
category: surface-to-air
range_class: SAM
developer: DRDO with BDL and BEL
operators:
  - Indian Army
status: development
range_km:
  min: 25
  max: 30
speed_mach: 2.5
nuclear_capable: false
propulsion: ramjet
launch_platform:
  - mobile launcher
first_test: "2021-09-27"
description: >-
  Akash Prime is an upgraded variant of the Akash weapon system customised for high-altitude
  operations above 4,500 m, incorporating an indigenously developed RF seeker for improved target
  acquisition in low-temperature and thin-atmosphere conditions. It is intended to counter fighter
  aircraft, cruise missiles and drones. In July 2025 the Indian Army and DRDO successfully trialled
  the system in high-altitude Ladakh (above 4,500 m), destroying two high-speed aerial targets. The
  system is developed by DRDO with Bharat Dynamics Limited and Bharat Electronics Limited.
claims:
