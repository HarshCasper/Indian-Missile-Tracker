id: astra
name: Astra Mk1
aka:
  - Astra Mk-1
  - Astra BVRAAM
category: air-to-air
range_class: AAM
developer: DRDO (DRDL)
operators:
  - Indian Air Force
  - Indian Navy
status: operational
range_km:
  min: 80
  max: 110
payload_kg: 15
speed_mach: 4.5
nuclear_capable: false
propulsion: solid
launch_platform:
  - Su-30MKI
  - Tejas LCA
  - Mirage 2000
  - MiG-29
variants:
  - name: Astra Mk1
    notes: Baseline production BVRAAM, ~80-110 km range, inducted with IAF
first_test: "2003-05-12"
description: >-
  Astra Mk1 is India's first indigenously developed beyond-visual-range air-to-air missile (BVRAAM),
  developed by DRDO and produced by Bharat Dynamics Limited. It is a solid-propelled missile with an
  active radar terminal seeker and mid-course inertial guidance, with a quoted launch range over 100
  km in head-on engagements. It has been integrated and inducted on the Su-30MKI and is being
  qualified on Tejas and other platforms. A direct-hit test from the Tejas LCA AF Mk1 was conducted
  on 12 March 2025, and a July 2025 test validated an indigenous RF seeker from the Su-30MKI.
