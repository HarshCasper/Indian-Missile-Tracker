notes: >-
  Developed under/alongside the IGMDP framework. First ballistic/captive trials began May 2003; user
  trials 2016-2019 led to IAF induction circa 2019-2020. Mach figure (~4-4.5 max) is reported;
  airforce-technology cites a max launch speed envelope to Mach 2 for the aircraft release while
  terminal missile speed is higher.
