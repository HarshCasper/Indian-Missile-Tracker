  - name: PDV Mk-II
    notes: ASAT derivative used in Mission Shakti (catalogued separately as asat-mission-shakti)
first_test: "2014-04-27"
description: >-
  The Prithvi Defence Vehicle (PDV) is DRDO's second-generation exo-atmospheric interceptor,
  developed to replace the earlier PAD in the upper tier of India's Ballistic Missile Defence
  system. It was first successfully flight-tested on 27 April 2014 off the Odisha coast, destroying
  its target at an altitude of about 120 km and demonstrating the ability to engage ballistic
  missiles launched from up to roughly 2,000 km away. The PDV uses solid propulsion with a gimballed
  directional-warhead/kinetic kill vehicle and is designed to intercept targets in the
  exo-atmosphere above ~50 km. It is the basis for the PDV Mk-II ASAT used in Mission Shakti.
