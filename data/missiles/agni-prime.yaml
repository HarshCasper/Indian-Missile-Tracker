id: agni-prime
name: Agni-Prime
aka:
  - Agni-P
  - Agni Prime
  - Agni P
category: surface-to-surface
range_class: MRBM
developer: Defence Research and Development Organisation (DRDO)
operators:
  - India (Strategic Forces Command)
status: operational
range_km:
  min: 1000
  max: 2000
payload_kg: 1000
nuclear_capable: true
propulsion: solid
launch_platform:
  - road-mobile canister launcher
  - rail-based mobile launcher
variants:
  - name: Agni-P (road-mobile)
    notes: >-
      Canisterised two-stage road-mobile variant; inducted after a series of successful flight
      trials.
  - name: Agni-P (rail-based)
    notes: >-
      Rail-based mobile launcher variant first tested 24 September 2025, making India one of few
      nations with rail-network canisterised launch.
first_test: "2021-06-28"
description: >-
  The Agni-Prime (Agni-P) is a new-generation, two-stage, canisterised solid-propellant
  medium/intermediate-range ballistic missile developed by DRDO, lighter and more advanced than
  earlier Agni variants, with a range of about 1,000-2,000 km. It was first flight tested on 28 June
  2021 off the Odisha coast and incorporates composite rocket-motor casings and advanced navigation
  and guidance. It is launchable from both road-mobile and (from September 2025) rail-based mobile
  launchers, and the road-mobile version has been inducted into service. The missile carries an
  approximately 1,000 kg conventional or nuclear payload.
