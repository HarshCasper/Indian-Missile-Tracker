notes: >-
  Development-stage, not yet flight tested as of mid-2026. Frequently described as the naval
  counterpart to the land-based Agni-V. Range figures and MIRV claims come from defence-press
  reporting rather than official DRDO/PIB releases, so treat as reported. Intended for S4/S4* and
  future SSBNs with vertical launch tubes.
