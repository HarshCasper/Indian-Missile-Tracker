id: k-5
name: K-5
aka:
  - Kalam-5
  - K5
category: submarine-launched
range_class: SLBM
developer: DRDO (Defence Research and Development Organisation)
operators:
  - Indian Navy
status: development
range_km:
  min: 5000
  max: 6000
payload_kg: 2000
nuclear_capable: true
propulsion: solid
launch_platform:
  - future Arihant-class variants (S4, S4*)
description: >-
  The K-5 is an upcoming long-range submarine-launched ballistic missile under development by DRDO
  for the next-generation Arihant-class SSBNs (S4/S4*), intended to give India an
  intercontinental-class sea-based deterrent. Reported as a three-stage solid-fuelled system
  weighing around 20 tonnes, it is described as India's first SLBM optimised for MIRV (multiple
  independently targetable reentry vehicle) technology. DRDO reportedly completed development of the
  missile in 2025, with a Stage-II rocket motor static test conducted in September 2025, though it
  has not yet undergone a public flight test.
