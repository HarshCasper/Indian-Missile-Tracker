id: akash-ng
name: Akash-NG
aka:
  - Akash New Generation
  - New Generation Akash
category: surface-to-air
range_class: SAM
developer: DRDO (DRDL Hyderabad with other DRDO labs)
operators:
  - Indian Air Force
status: development
range_km:
  min: 40
  max: 80
speed_mach: 2.5
nuclear_capable: false
propulsion: solid
launch_platform:
  - mobile canisterised launcher
first_test: "2021-01-25"
description: >-
  Akash-NG (New Generation) is an upgraded surface-to-air missile being developed by DRDO for the
  Indian Air Force to intercept high-manoeuvrability, low-radar-cross-section aerial threats at
  extended range. It features an active RF seeker, a smaller and lighter canisterised missile, and a
  modern multifunction radar and command-and-control suite. DRDO conducted its maiden flight test on
  25 January 2021 from the Integrated Test Range off Odisha, with further successful trials in 2021
  and a January 2024 test against a low-altitude high-speed target. User-evaluation trials were
  reported completed in late 2025.
