notes: >-
  First flight test 24 March 2014 from a submerged pontoon off Visakhapatnam (range ~3,000 km).
  First submarine launch from INS Arighaat in late November 2024 (sources differ on exact date, 27
  vs 28 Nov 2024). Motors developed with DRDO's HEMRL and ACEM. Carries a nuclear payload of up to
  ~2 tonnes.
