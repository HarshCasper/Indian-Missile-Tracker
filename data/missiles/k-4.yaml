id: k-4
name: K-4
aka:
  - Kalam-4
  - K4
category: submarine-launched
range_class: SLBM
developer: DRDO (Defence Research and Development Organisation); manufactured by Bharat Dynamics Limited
operators:
  - Indian Navy
status: operational
range_km:
  min: 3000
  max: 3500
payload_kg: 2000
nuclear_capable: true
propulsion: solid
launch_platform:
  - Arihant-class SSBN (INS Arihant, INS Arighaat)
  - submerged pontoon
first_test: "2014-03-24"
description: >-
  The K-4 is an intermediate-range, two-stage solid-fuel submarine-launched ballistic missile
  developed by DRDO for the Arihant-class SSBNs, dramatically extending the reach of India's
  sea-based deterrent compared with the K-15. It is roughly 12 m long, 1.3 m in diameter and weighs
  about 17 tonnes. Early development ejection tests began in 2010 from a submerged pontoon, and a
  full flight test followed in March 2014. In November 2024 it was test-fired from the submarine INS
  Arighaat, reported as the first launch of the missile from an operational submarine and a
  milestone for India's nuclear triad.
