first_test: "2006-07-09"
description: >-
  The Agni-III is a two-stage, solid-propellant intermediate-range ballistic missile developed by
  DRDO's Advanced Systems Laboratory to extend India's reach to ~3,000-3,500 km with a payload up to
  ~1,500 kg. Its maiden flight on 9 July 2006 was a failure, with the missile falling short into the
  sea; the first successful test followed on 12 April 2007. The missile is about 16.7 m long, ~2 m
  in diameter, and weighs roughly 48,000 kg at launch. It was declared operational around 2011 with
  the Strategic Forces Command.
