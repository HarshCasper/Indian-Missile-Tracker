variants:
  - name: NASM-SR
    notes: First indigenous air-launched anti-ship missile for the Indian Navy; sea-skimming, IIR seeker
first_test: "2022-05-18"
description: >-
  NASM-SR (Naval Anti-Ship Missile - Short Range) is India's first indigenous air-launched anti-ship
  missile, developed by DRDO for launch from Indian Navy helicopters. It is a subsonic (about Mach
  0.8) sea-skimming missile with an imaging infrared seeker, capable of cruising as low as about 5 m
  above the sea to evade radar, with a reported range up to about 55 km and a launch weight around
  380 kg. Its maiden flight test was conducted from a naval helicopter at the ITR, Chandipur, on 18
  May 2022, validating the sea-skimming trajectory, control, guidance and mission algorithms.
