first_test: "2002-01-25"
description: >-
  The Agni-I is a single-stage, solid-propellant short-range ballistic missile developed by DRDO,
  conceived as a quick-reaction, road/rail-mobile system bridging the gap between the Prithvi and
  longer-range Agni variants. Its first flight test on 25 January 2002 reportedly suffered a
  re-entry vehicle separation issue, with a successful test following on 9 January 2003. It has a
  baseline range around 700 km (up to ~1,200 km with reduced payload) and carries a roughly 1,000 kg
  conventional or nuclear payload. It was accepted into Indian Army service with the Strategic
  Forces Command around 2007.
