confidence: reported
notes: >-
  first_test date (2000-04-01) is approximate — corresponds to the April 2000 INS Subhadra launch
  that is widely reported but not precisely dated in primary sources; that launch is also commonly
  attributed to the Dhanush naval derivative. Propulsion frequently described as a two-stage
  solid+liquid configuration, distinguishing it from the single-stage liquid Prithvi-I/II.
  Land-variant induction status is unclear; treated as development/limited.
