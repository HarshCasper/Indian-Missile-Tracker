notes: >-
  Range figures for the Mk-I vary across sources (37.5/38/40 km) and are rarely stated in a single
  official release; treated as reported. First flight-test date of the original Pinaka (early-to-mid
  1980s development, trials in the 1990s; combat use in 1999 Kargil) was not pinned to a precise ISO
  date in reliable sources, so first_test is omitted. 214 mm caliber; payload ~100 kg. range_class
  set to 'other' as it is an artillery rocket, not a ballistic/cruise missile.
