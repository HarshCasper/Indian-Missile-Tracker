description: >-
  The Pinaka Mk-I is India's first indigenous 214 mm free-flight multi-barrel rocket launcher (MBRL)
  system developed by DRDO's ARDE and HEMRL for the Indian Army. Each launcher carries two pods of
  six rockets and can fire a 12-rocket salvo in roughly 44 seconds, saturating an area of around 700
  x 500 m. It was combat-proven during the 1999 Kargil conflict and has since been series-produced
  and inducted; the baseline Mk-I rocket has a range of about 38-40 km and carries a ~100 kg
  warhead.
