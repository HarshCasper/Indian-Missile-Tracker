notes: >-
  Often treated as an upgrade of the baseline BrahMos rather than a wholly separate missile. 450 km
  variant is operational/tested; 800 km class is a development goal achieved via ramjet optimisation
  and composites. Speed and warhead unchanged from baseline BrahMos.
