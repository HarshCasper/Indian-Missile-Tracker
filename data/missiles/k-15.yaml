notes: >-
  First SLBM of India's 'K' (Kalam) series. Dimensions ~10.8 m length, 0.8 m diameter, launch weight
  ~6-7 tonnes. Range is sufficient only for second-strike against Pakistan; considered a
  transitional/R&D platform now being superseded by the longer-range K-4. First-test dates vary
  widely across sources (2004-2010); treat first_test as approximate.
