first_test: "2008-02-26"
description: >-
  The K-15 Sagarika (codenamed B-05) is India's first submarine-launched ballistic missile, a
  two-stage solid-propellant weapon developed by DRDO for the sea-based leg of India's nuclear
  triad. It uses a gas booster to eject from the launch tube and breach the surface before its
  motors ignite. It arms the Arihant-class SSBNs and provides a short-range second-strike
  capability, primarily against targets in Pakistan. Underwater development tests culminated in
  fully integrated firings, and it is regarded as operational aboard INS Arihant.
