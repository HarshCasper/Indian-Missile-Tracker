id: nag
name: Nag
aka:
  - NAG
  - Prospina
category: anti-tank
range_class: ATGM
developer: DRDO (DRDL)
operators:
  - Indian Army
status: operational
range_km:
  min: 0.5
  max: 4
nuclear_capable: false
propulsion: solid
launch_platform:
  - NAMICA (Nag Missile Carrier, BMP-2 based)
variants:
  - name: Nag Mk1
    notes: Baseline land version (Prospina), ~4 km range, IIR seeker, top-attack tandem HEAT
  - name: Nag Mk2
    notes: Improved variant with extended ~7-10 km range; also test-fired from Zorawar light tank (2025)
first_test: "1990-11-01"
description: >-
  Nag is a third-generation, fire-and-forget anti-tank guided missile developed by DRDO under the
  IGMDP, using an imaging infrared (IIR) seeker and a tandem HEAT warhead with top-attack capability
  against modern reactive armour. The land version, also called Prospina, is carried on the NAMICA
  armoured carrier (BMP-2 based), which holds six ready-to-fire missiles. The baseline missile has
  an operational range of roughly 0.5-4 km, while the improved Nag Mk2 reportedly extends range to
  about 7-10 km. The Nag/NAMIS system completed final trials and entered Indian Army induction in
  the mid-2020s.
