id: prithvi-i
name: Prithvi-I
aka:
  - Prithvi 1
  - SS-150
  - P-1
category: surface-to-surface
range_class: SRBM
developer: DRDO (Defence Research and Development Organisation)
operators:
  - Indian Army
status: retired
range_km:
  min: 40
  max: 150
payload_kg: 1000
nuclear_capable: true
propulsion: liquid
launch_platform:
  - road-mobile transporter-erector-launcher (TEL)
variants:
  - name: SS-150
    notes: Indian Army battlefield variant, 150 km range with 1,000 kg payload
first_test: "1988-02-25"
description: >-
  Prithvi-I is India's first indigenously developed ballistic missile, conceived under the
  Integrated Guided Missile Development Programme (IGMDP) begun in 1983 and first flight-tested in
  February 1988. It is a single-stage, liquid-fuelled, road-mobile short-range surface-to-surface
  ballistic missile carrying a 1,000 kg payload to roughly 150 km, developed as a tactical
  battlefield weapon for the Indian Army. Analysts assess a nuclear-armed variant entered service in
  the late 1990s. The system is now obsolete and is being withdrawn/replaced by the solid-fuelled
  Prahaar.
