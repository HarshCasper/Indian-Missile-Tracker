  max: 2.5
nuclear_capable: false
propulsion: solid
launch_platform:
  - man-portable launcher (tripod/shoulder)
variants:
  - name: MPATGM
    notes: Low-weight, fire-and-forget man-portable ATGM with dual-mode IIR seeker and tandem warhead
first_test: "2018-09-15"
description: >-
  MPATGM is a low-weight, fire-and-forget man-portable anti-tank guided missile developed by DRDO to
  replace second-generation ATGMs in Indian Army infantry use. It features an imaging infrared
  dual-mode seeker, day/night and top-attack capability, and a tandem HEAT warhead validated against
  modern reactive-armour main battle tanks, with a maximum range around 2.5 km. Warhead and
  penetration trials were completed at Pokhran on 13 April 2024, after which DRDO declared
  technology development concluded and the system ready for Final User Evaluation Trials leading to
  Army induction.
