id: sant
name: SANT
aka:
  - Stand-off Anti-Tank Missile
  - Standoff Anti-Tank Guided Missile
  - SANT missile
category: anti-tank
range_class: ATGM
developer: DRDO (Research Centre Imarat, Hyderabad)
operators:
  - Indian Air Force (planned)
status: development
range_km:
  min: 10
  max: 20
nuclear_capable: false
propulsion: solid
launch_platform:
  - Mi-35 helicopter
  - helicopter (roof-top launcher in early test)
variants:
  - name: SANT
    notes: Helicopter-launched stand-off ATGM with nose-mounted active MMW radar seeker
first_test: "2020-10-19"
description: >-
  SANT (Stand-off Anti-Tank) is a fourth-generation, longer-range development of the HELINA/Nag
  family developed by DRDO's Research Centre Imarat for the long-distance airborne anti-armour role.
  It uses a nose-mounted active millimetre-wave (MMW) radar seeker to enable launches from a safe
  stand-off distance, with reported range around 10-20 km. It was first test-fired from a roof-top
  launcher at the ITR off Odisha on 19 October 2020, and a helicopter-launched flight test from a
  Mi-35 gunship was conducted at Pokhran on 11 December 2021.
