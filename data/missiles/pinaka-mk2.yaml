notes: >-
  Naming is inconsistent in sources: 'Pinaka-ER (Enhanced Range)' (~45 km demonstrated in the Nov
  2020 PIB-confirmed test) and 'Pinaka Mk-II' (reported up to ~60-90 km) are sometimes used
  interchangeably and sometimes as distinct steps. Combined here per the system brief (pinaka-mk2 =
  Mk-II/ER). first_test set to the 4 Nov 2020 PIB-confirmed enhanced-range flight test. range_class
  'other' (artillery rocket).
