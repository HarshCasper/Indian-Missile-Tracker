id: pinaka-mk2
name: Pinaka Mk-II / Pinaka-ER (Enhanced Range)
aka:
  - Pinaka Mark-II
  - Pinaka-ER
  - Pinaka Extended Range
  - Enhanced Pinaka
category: surface-to-surface
range_class: other
developer: >-
  DRDO (ARDE Pune and HEMRL Pune); rockets manufactured by Economic Explosives Ltd (EEL), Nagpur
  under ToT
operators:
  - Indian Army
status: operational
range_km:
  min: 45
  max: 90
payload_kg: 100
nuclear_capable: false
propulsion: solid
launch_platform:
  - 12-tube wheeled multi-barrel rocket launcher (MBRL) vehicle
variants:
  - name: Pinaka-ER (Enhanced Range)
    notes: Extended-range free-flight rocket; flight tested 4 Nov 2020 with demonstrated range ~45 km.
  - name: Pinaka Mk-II
    notes: >-
      Higher-range variant of the system, with ranges reported up to ~60-90 km depending on
      configuration.
first_test: "2020-11-04"
description: >-
  The Pinaka Mk-II / Enhanced Range (Pinaka-ER) is an extended-range development of the Pinaka MBRL
  rocket, using improved propellant and aerodynamics to substantially increase reach over the Mk-I
  while retaining the 214 mm/~100 kg warhead family. DRDO (ARDE and HEMRL) successfully
  flight-tested the enhanced Pinaka from Integrated Test Range, Chandipur on 4 November 2020, firing
  six rockets in quick succession to a demonstrated ~45 km, with the production-standard Mk-II/ER
  targeting ranges up to roughly 60-90 km. The rockets are produced by Economic Explosives Ltd,
  Nagpur, under transfer of technology.
