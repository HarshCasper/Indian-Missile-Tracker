    accessed: "2026-06-16"
confidence: confirmed
notes: >-
  Range is disputed: official 'over 5,000 km' vs foreign analyst assessments up to ~8,000 km. First
  test 19 April 2012; first MIRV test (Mission Divyastra) 11 March 2024. Now canisterised and
  inducted with the Strategic Forces Command.
