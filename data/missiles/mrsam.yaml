notes: >-
  Joint DRDO-IAI programme; naval variant = LRSAM/Barak-8, land variant = MRSAM. First test in
  Israel 10 Nov 2014; INS Kolkata test 29-30 Dec 2015; land version off Odisha 30 Jun 2016 and three
