id: mrsam
name: MRSAM / Barak-8
aka:
  - Barak-8
  - LRSAM
  - MR-SAM
  - Medium Range Surface-to-Air Missile
  - Long Range Surface-to-Air Missile
category: surface-to-air
range_class: SAM
developer: DRDO with Israel Aerospace Industries (IAI), Rafael, IAI/Elta; produced with BDL/BEL/L&T
operators:
  - Indian Air Force
  - Indian Army
  - Indian Navy
status: operational
range_km:
  min: 70
  max: 100
speed_mach: 2
nuclear_capable: false
propulsion: solid
launch_platform:
  - naval ship (vertical launch)
  - mobile land launcher
variants:
  - name: LRSAM (Barak-8 naval)
    notes: Long-range ship-borne variant for the Indian Navy
  - name: MRSAM (land)
    notes: Land-based variant for IAF and Army
  - name: Barak-8 ER
    notes: Extended-range variant assessed up to ~150 km
first_test: "2014-11-10"
description: >-
  MRSAM/Barak-8 (the Indian Navy variant designated LRSAM) is a jointly developed Indian-Israeli
  surface-to-air missile system built by DRDO and Israel Aerospace Industries with Rafael and Elta,
  deployed in both naval and land-based configurations. It uses a dual-pulse solid rocket motor,
  thrust-vector control, and an active radar seeker with inertial mid-course updates to intercept
  aircraft, missiles and other aerial threats out to about 70-100 km. The missile was first tested
  in Israel on 10 November 2014, then from INS Kolkata in December 2015, with the land-based version
  tested off Odisha in June-July 2016. It is operational with the Indian Navy, Air Force and Army.
claims:
  - field: range_km
    value: 70
    basis: official
    text: Baseline range commonly stated as 70 km using dual-pulse motor.
    source:
