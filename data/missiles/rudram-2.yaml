status: development
range_km:
  min: 300
  max: 350
payload_kg: 200
speed_mach: 5.5
nuclear_capable: false
propulsion: solid
launch_platform:
  - Su-30MKI
variants:
  - name: Rudram-2
    notes: Solid-propelled supersonic air-to-surface missile for multiple target types
first_test: "2024-05-29"
description: >-
  Rudram-2 (RudraM-II) is an indigenously developed solid-propelled, supersonic air-launched missile
  for the air-to-surface role, intended to neutralise a wide range of enemy ground assets. It was
  successfully flight-tested from an IAF Su-30MKI off the Odisha coast on 29 May 2024, validating
  its propulsion system and control & guidance algorithms. It is reported to carry a warhead of up
  to about 200 kg with a strike range around 300-350 km and a speed up to roughly Mach 5.5.
