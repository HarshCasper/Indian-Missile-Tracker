variants:
  - name: Astra Mk2
    notes: Dual-pulse solid rocket motor, indigenous Ku-band active radar seeker
description: >-
  Astra Mk2 is a longer-range development of the Astra BVRAAM, using a dual-pulse solid rocket motor
  and an indigenous Ku-band active radar seeker developed by DRDO's RCI to replace the Russian
  seeker used on early Mk1 rounds. Reported design ranges have ranged from 140-160 km in earlier
  accounts up to ~240 km in more recent DRDO statements. It completed primary developmental trials
  and is targeted for IAF induction around 2026, with the IAF reportedly planning to procure
  hundreds of rounds for the Su-30MKI and Tejas.
