confidence: confirmed
notes: >-
  First flight 12 March 2013 was aborted mid-flight by self-destruct after trajectory deviation;
  first fully successful flight was 17 October 2014. The ITCM (Indigenous Technology Cruise Missile)
  replaces the earlier Russian-origin engine with the indigenous 'Manik' STFE, and the LRLACM
  programme is the productionised follow-on. Nuclear capability is an external assessment, not an
  official Indian declaration.
