description: >-
  The Agni-IV is a lightweight, two-stage solid-propellant intermediate-range ballistic missile
  developed by DRDO, originally trialled under the designation Agni-II Prime and re-designated
  Agni-IV in 2011. Its first flight test on 10 December 2010 failed due to a control-system fault,
  with the first successful test on 15 November 2011 covering about 3,000 km. It is roughly 20 m
  long, weighs about 17,000 kg, and carries an approximately 1,000 kg nuclear-capable warhead with a
  CEP under 100 m, using ring-laser-gyro inertial guidance. It provides reach across nearly all of
  mainland China when launched from northeastern India.
