first_test: "1999-04-11"
description: >-
  The Agni-II is a two-stage, solid-propellant medium-range ballistic missile developed by DRDO
  (development begun July 1997) to give India a rail/road-mobile nuclear delivery option against
  targets out to ~2,000 km and beyond. It was first flight tested on 11 April 1999 from Wheeler
  Island off the Odisha coast. The missile is about 20 m long, weighs roughly 17,000 kg at launch,
  and carries an approximately 1,000 kg nuclear-capable payload. It entered service with the
  Strategic Forces Command around 2004.
