variants:
  - name: Astra Mk3 / Gandiva
    notes: Solid-fuel ducted ramjet (SFDR) air-breathing propulsion; planned GaN-based AESA seeker
description: >-
  Astra Mk3, officially named 'Gandiva', is a next-generation BVRAAM under development by DRDO using
  solid-fuel ducted ramjet (SFDR) air-breathing propulsion for sustained high-supersonic speed and
  long no-escape zones, intended to rival the MBDA Meteor. Reported ranges are around 300-340+ km
  against large targets and roughly 200-250 km against fighter-sized targets. DRDO completed
  ground-based SFDR propulsion tests in 2024 and is moving toward flight/propulsion trials, with
  operational induction targeted around 2029-2030.
