id: asat-mission-shakti
name: PDV Mk-II (Mission Shakti ASAT)
aka:
  - PDV Mk-II
  - PDV Mark-II
  - Mission Shakti
  - Project XSV-1
  - A-SAT
category: anti-satellite
range_class: ASAT
developer: DRDO
operators:
  - India
status: development
nuclear_capable: false
propulsion: solid
launch_platform:
  - land-based / ground-launched (Dr APJ Abdul Kalam Island)
variants:
  - name: PDV Mk-II ASAT
    notes: >-
      Three-stage interceptor with kinetic kill vehicle third stage; uses PDV-derived/K-4 type solid
      motors
first_test: "2019-03-27"
description: >-
  PDV Mk-II was the kinetic-kill anti-satellite (ASAT) interceptor used in India's Mission Shakti
  (Project XSV-1), conducted on 27 March 2019 from Dr APJ Abdul Kalam Island, Odisha. The DRDO
  interceptor destroyed the Indian Microsat-R satellite in low Earth orbit at an altitude of about
  283 km, making India the fourth country (after the US, Russia and China) to demonstrate an ASAT
  capability. It is a three-stage missile (about 13 m long, ~18-19 tonnes) with two solid-propellant
  stages and a hit-to-kill kinetic Kill Vehicle as the third stage, guided by an imaging infrared
  seeker and a ring-laser-gyro inertial navigation system. It is a direct-ascent ASAT derived from
  the Prithvi Defence Vehicle BMD interceptor.
