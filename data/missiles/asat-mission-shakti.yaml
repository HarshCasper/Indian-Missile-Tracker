notes: >-
  Direct-ascent kinetic-kill ASAT (non-nuclear, hit-to-kill). Single demonstrated test (Mission
  Shakti, 27 Mar 2019); not an operationally deployed weapon system, hence status 'development'.
  Target was the ~740 kg Microsat-R satellite (target satellite mass, not interceptor payload, so
  payload_kg omitted). Reported missile mass ~18-19 t and length ~13 m. range_class ASAT chosen over
  ABM as it is the dedicated anti-satellite role. PDV Mk-II is a derivative of the PDV BMD
  interceptor.
