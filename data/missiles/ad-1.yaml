id: ad-1
name: AD-1
aka:
  - AD-1 interceptor
  - Phase-II BMD interceptor
category: ballistic-missile-defence
range_class: ABM
developer: DRDO
operators:
  - India
status: development
nuclear_capable: false
propulsion: solid
launch_platform:
  - land-based / ground-launched
variants:
  - name: AD-1
    notes: >-
      Phase-II long-range interceptor; dual exo/endo-atmospheric role against long-range BMs and
      aircraft
first_test: "2022-11-02"
description: >-
  AD-1 is a long-range interceptor missile developed by DRDO for Phase-II of India's Ballistic
  Missile Defence programme, intended to engage intermediate-range/long-range ballistic missiles and
  aircraft. Its maiden flight test was conducted on 2 November 2022 from Dr APJ Abdul Kalam Island
  off the Odisha coast, demonstrating a 'large kill altitude bracket' covering both low
  exo-atmospheric and endo-atmospheric interception. It is propelled by a two-stage solid motor with
  an indigenous control, navigation and guidance system. AD-1 (with the planned AD-2) is intended to
  extend India's shield to defeat ballistic missiles of greater range than the Phase-I PAD/AAD/PDV
  systems.
