id: rudram-1
name: Rudram-1
aka:
  - RudraM-1
  - NGARM
  - New Generation Anti-Radiation Missile
  - DRDO Anti-Radiation Missile
category: air-to-surface
range_class: other
developer: DRDO
operators:
  - Indian Air Force
status: development
range_km:
  min: 100
  max: 200
nuclear_capable: false
propulsion: solid
launch_platform:
  - Su-30MKI
variants:
  - name: Rudram-1
    notes: First indigenous air-launched anti-radiation missile (ARM) for SEAD
first_test: "2020-10-09"
description: >-
  Rudram-1 (formerly NGARM) is India's first indigenously developed air-launched anti-radiation
  missile, designed for suppression of enemy air defences (SEAD) by homing on hostile radars and RF
  emitters. It uses INS-GPS navigation with a passive homing head for terminal attack and a
  broadband seeker that can detect, classify and engage emitters across a wide frequency band. It
  was first flight-tested from a Su-30MKI on 9 October 2020 at the Integrated Test Range, Balasore,
  achieving a pinpoint hit. Range varies with launch altitude and speed, reported up to about 200
  km.
