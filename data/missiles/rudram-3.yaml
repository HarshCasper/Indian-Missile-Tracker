description: >-
  Rudram-3 (RudraM-III) is a long-range, high-speed air-launched missile under development by DRDO
  for the Su-30MKI, intended for deep SEAD and high-value ground-target strikes. It reportedly uses
  a dual-pulse solid rocket motor on a semi-ballistic trajectory to reach terminal speeds exceeding
  Mach 5, with a reported range around 550 km. A modular design is said to allow both anti-radiation
  and conventional ground-attack warheads. As of mid-2026 it is in development, with
  captive/adaptation trials on the Su-30MKI reported and user trials anticipated.
