date: "1994-06-06"
date_precision: day
outcome: success
confidence: reported
site_id: itr-chandipur
range_tested_km: 145
description: >-
  Fourteenth test of the Prithvi-I, an Army user-trial conducted by artillery officers from the
  missile force. The missile hit a designated target 145 km from ITR Chandipur. Expected to be among
  the final tests before the Army ordered the Prithvi.
notes: >-
  Added test (development list previously truncated). Date, site (ITR Chandipur), 145 km range, and
  success agree between NTI (citing Navbharat Times, 7 June 1994; Dainik Jagran, 19 June 1994) and
  GCAT (1994 Jun 6, CHAN, 145 km, 'Army user trial').
