id: 1999-pinaka-mk1-user-trials-kargil
missile_id: pinaka-mk1
variant: Pinaka Mk-I (unguided baseline)
designation: User trials / Kargil combat use
date: "1999"
date_precision: year
outcome: success
confidence: disputed
site_id: itr-chandipur
description: >-
  Development-phase user trials of the baseline 214 mm unguided Pinaka Mk-I multi-barrel rocket
  system. Phase-one user trials were carried out in June 1997 and phase-two from July 1998; the
  system was further tested at Balasore (Chandipur) in March 1999, and its combat capabilities were
  demonstrated operationally during the Kargil conflict in June 1999. The first Pinaka regiment was
  raised in February 2000.
notes: >-
  No discrete 1999 firing event with an exact date is documented; this entry covers the late-1990s
  user-trial/early-deployment period. Treated as disputed: secondary sources describe the timeline
  differently (June 1997 phase-1, July 1998 phase-2, March 1999 Balasore test, June 1999 Kargil).
  Site shown as itr-chandipur (Balasore/Chandipur) for the test firings; Kargil use was operational
  in J&K, not a test range.
