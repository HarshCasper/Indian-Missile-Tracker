id: 2026-04-29-nasm-sr-maiden-salvo-launch
missile_id: nasm-sr
designation: Maiden salvo launch
date: "2026-04-29"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO and the Indian Navy conducted the maiden salvo launch of the NASM-SR from a Sea King Mk.42B
  naval helicopter over the Bay of Bengal off the Odisha coast, firing two missiles in quick
  succession from the same helicopter. Both missiles met all test objectives and demonstrated
  waterline hit capability, tracked by ITR Chandipur radar, electro-optical and telemetry
  instruments.
notes: >-
  CORRECTED SITE: this was an air-launched test from an Indian Navy Sea King Mk.42B helicopter over
  the Bay of Bengal off the Odisha coast, tracked by Integrated Test Range (ITR) Chandipur
  instruments — NOT an offshore Visakhapatnam vessel launch (the previous 'offshore-visakhapatnam'
  site_id was wrong). Per facility rules, an air-launched test over the Odisha test range is
  recorded as itr-chandipur with an 'air-launched' note. PIB describes the location as off the Bay
  of Bengal coast of Odisha. Date is 29 April 2026 per PIB, Naval News, The Statesman and Business
  Standard; the Naval News URL uses a 2026/05 path but the article and PIB state 29 April 2026.
  Range not stated in the release; missiles produced by a Development-cum-Production Partner (Adani
  Defence & Aerospace per secondary reporting).
