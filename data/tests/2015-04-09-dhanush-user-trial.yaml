id: 2015-04-09-dhanush-user-trial
missile_id: dhanush
variant: Prithvi-III (naval)
designation: User training trial
date: "2015-04-09"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 350
description: >-
  India successfully test-fired the nuclear-capable, 350 km-range Dhanush from an offshore patrol
  vessel off the Odisha coast in the Bay of Bengal at about 11:02 hrs as part of a Strategic Forces
  Command user-training exercise. The missile hit the designated target on the water with high
  precision.
notes: >-
  ADDED test (was missing/cut off in the truncated input list). Ship-launched from a naval offshore
  patrol vessel off the Odisha coast; site_id offshore-visakhapatnam used as the Bay-of-Bengal
  ship-launch proxy. Launch at about 11:02 local time on 9 April 2015, conducted by the Strategic
  Forces Command. Date, success, and 350 km full-range corroborated by GlobalSecurity (Sputnik),
  Naval Technology and Indian outlets (PTI via Business Standard, Deccan Herald).
