id: 2016-03-07-k-4-depressed-trajectory
missile_id: k-4
variant: K-4
date: "2016-03-07"
date_precision: day
outcome: success
confidence: disputed
site_id: offshore-visakhapatnam
description: >-
  Developmental flight test of the K-4 from a submerged pontoon off the Visakhapatnam coast, flown
  on a depressed trajectory. The missile cleared the launch tube, breached the surface, achieved
  stage separation and maintained its trajectory to the designated target with high accuracy.
notes: >-
  Launched from a submerged pontoon; recorded under offshore-visakhapatnam. Exact date disputed: The
  Diplomat reports 7 March 2016, while GlobalSecurity gives 9 March 2016 for the early-March 2016
  pontoon test. Confidence downgraded to disputed on the date.
