id: 2014-12-02-agni-iv-first-user-trial
missile_id: agni-iv
designation: First Strategic Forces Command user trial
date: "2014-12-02"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 3500
description: >-
  First user trial of the Agni-IV by the Indian Army's Strategic Forces Command (SFC), fired from a
  mobile launcher at about 09:45 a.m. from Wheeler Island. The missile flew to a range reported as
  more than 3,500 km; this was the fourth consecutive successful flight overall.
notes: >-
  First of the SFC user/army trials (fourth consecutive success overall). Date, site and success
  independently re-verified.
