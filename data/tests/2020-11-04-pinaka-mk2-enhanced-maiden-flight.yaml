id: 2020-11-04-pinaka-mk2-enhanced-maiden-flight
missile_id: pinaka-mk2
variant: Enhanced Pinaka (Enhanced Range Rocket System)
designation: Enhanced Pinaka rocket system flight test
date: "2020-11-04"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 45
description: >-
  DRDO conducted the maiden flight test of the Enhanced (longer-range) Pinaka rocket system from the
  Integrated Test Range, Chandipur, Odisha. Six rockets were launched in quick succession and met
  complete mission objectives, tracked by telemetry, radar and electro-optical systems. The enhanced
  design achieves longer range with reduced length compared to the earlier Pinaka.
notes: >-
  First flight test of the enhanced/extended-range Pinaka family. Verified via official PIB release
  (GlobalSecurity mirror) plus Deccan Herald. The official PIB release did not state a specific
  range; ~45 km is the system's design capability per secondary sources. Production technology
  transferred to Economic Explosives Ltd., Nagpur.
