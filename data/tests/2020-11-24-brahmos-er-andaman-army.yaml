range_tested_km: 400
description: >-
  Indian Army test-fired the extended-range (over 400 km) land-attack version of the BrahMos
  supersonic cruise missile at about 1003 hrs from the Andaman and Nicobar Islands in a top-attack
  mode, successfully hitting its designated target at Mach 2.8. Strike range enhanced from the
  original 290 km to 400 km.
notes: >-
  Launch site was the Andaman and Nicobar Islands (Andaman & Nicobar Command), not one of the listed
  Odisha-coast facilities; site_id left empty. Designated target was reported at ~200 km in the Bay
  of Bengal during this trial. Verified via Deccan Herald and Onmanorama/Swarajya.
