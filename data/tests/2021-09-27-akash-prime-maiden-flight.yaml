designation: Maiden Flight Test
date: "2021-09-27"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
description: >-
  Maiden flight test of Akash Prime, an upgraded Akash surface-to-air missile fitted with an
  indigenous active RF seeker for improved accuracy and reliable performance in
  low-temperature/high-altitude environments. The missile intercepted and destroyed an unmanned
  aerial target mimicking an enemy aircraft.
notes: >-
  First-ever flight test of the Akash Prime variant, from ITR Chandipur, Odisha (~4:30 PM). A
  modified ground system of the existing Akash weapon system was used; range stations (radars, EOTS,
  telemetry) monitored the trajectory. 'After improvements' in the official release refers to
  upgrades over the baseline Akash, not a prior Akash Prime flight. No range figure was disclosed
  for this test. Date, site, and outcome confirmed by PIB/DRDO and corroborated by Onmanorama and
  the GlobalSecurity PIB mirror.
