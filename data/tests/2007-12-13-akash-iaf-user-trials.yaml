site_id: itr-chandipur
outcome: success
designation: IAF user trials (first of three firings)
description: >-
  Indian Air Force user trials of the Akash were conducted at the Integrated Test Range, Chandipur,
  over 13-15 December 2007, with the missile fired against unmanned aerial target vehicles
  simulating an air attack. The trials were reported successful and supported the IAF's decision to
  induct the system.
confidence: reported
notes: >-
  GlobalSecurity records the Akash being test-fired several times over 13-15 December 2007 at
  Chandipur during the IAF trials. Recorded here as the opening of that three-day trial series.
