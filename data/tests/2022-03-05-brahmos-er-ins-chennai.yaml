description: >-
  The Indian Navy successfully demonstrated the accuracy of an extended-range land-attack BrahMos
  supersonic cruise missile fired from the stealth destroyer INS Chennai on 5 March 2022; the
  missile hit its target with pinpoint accuracy, confirming the capability to strike land targets at
  greater distances from the sea.
