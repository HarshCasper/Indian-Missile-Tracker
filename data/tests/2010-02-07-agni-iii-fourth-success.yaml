id: 2010-02-07-agni-iii-fourth-success
missile_id: agni-iii
designation: Fourth flight test (final developmental trial)
date: "2010-02-07"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 3500
apogee_km: 350
description: >-
  Fourth flight test (final developmental trial), launched from Inner Wheeler Island / Abdul Kalam
  Island off the Odisha coast. Per the DRDO press release the missile was tested to full range and
  hit the target with pinpoint accuracy, meeting all mission objectives; the Ministry subsequently
  declared the system ready for induction (Army accepted it in 2011).
notes: >-
  Launched from Inner Wheeler Island, Dhamra, Bhadrak district, Odisha. Range conflicts: ~3,000 km
  per IRNA/GlobalSecurity, vs ~3,500 km full range with ~350 km apogee per DRDO release reported by
  Broadsword (Ajai Shukla) and CSIS.
