id: 2020-09-30-brahmos-er-indigenous-booster-balasore
missile_id: brahmos-er
variant: land-attack
designation: BrahMos ER with indigenous booster
date: "2020-09-30"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 400
description: >-
  Extended-range BrahMos surface-to-surface land-attack cruise missile flight-tested at 1030 hrs
  from a mobile launcher at the ITR, Balasore, Odisha. This flight featured an indigenous Booster
  and Airframe Section plus other 'Made in India' sub-systems, cruising at Mach 2.8 and hitting a
  target reported at over 400 km. Described as the second ER test.
notes: >-
  ITR Balasore is part of the ITR Chandipur complex. Official BrahMos/PIB release (PRID 1660288)
  emphasized the indigenous booster; Indian press emphasized 400+ km range. Verified via PIB/BrahMos
  release and The Week.
