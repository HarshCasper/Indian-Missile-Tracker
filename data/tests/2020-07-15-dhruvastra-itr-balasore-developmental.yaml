site_id: itr-chandipur
range_tested_km: 7
description: >-
  Developmental flight trials of the helicopter-launched Nag (HELINA), then referred to as
  Dhruvastra, were conducted on 15 July 2020 from a ground-based static launcher at the Integrated
  Test Range, Balasore/Chandipur, Odisha. The missile was tested in direct and top-attack modes and
  tracked and hit its targets with high precision. Two of the three-trial 15-16 July series occurred
  on this date.
notes: >-
  Ground/static launcher trials as a developmental prerequisite, not a helicopter launch. ITR
  Balasore and ITR Chandipur refer to the same facility. Three trials total were carried out on
  15-16 July 2020.
