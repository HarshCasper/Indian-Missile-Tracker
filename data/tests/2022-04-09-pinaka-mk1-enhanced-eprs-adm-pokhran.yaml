id: 2022-04-09-pinaka-mk1-enhanced-eprs-adm-pokhran
missile_id: pinaka-mk1
variant: Pinaka Mk-I (Enhanced) / EPRS (with Area Denial Munition)
designation: EPRS and Pinaka Area Denial Munition flight tests
date: "2022-04-09"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
description: >-
  DRDO and the Indian Army successfully flight-tested the Pinaka Mk-I (Enhanced) Rocket System
  (EPRS) and the Pinaka Area Denial Munition (ADM) rocket systems at the Pokhran Firing Ranges. A
  total of 24 EPRS rockets were fired for different ranges over the preceding fortnight, achieving
  required accuracy and consistency and meeting all trial objectives. The campaign completed the
  initial phase of technology absorption by industry; rockets were manufactured by Munitions India
  Limited (MIL) under ToT from DRDO.
notes: >-
  Confirmed by official PIB release PRID 1815236 (9 April 2022), corroborated by Aviation & Defence
  Universe and Organiser. The official release reports 24 EPRS rockets and ADM variants over a
  fortnight but does not state a specific range in km; the ~45 km figure is secondary and recorded
  as a claim.
