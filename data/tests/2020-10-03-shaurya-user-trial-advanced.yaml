id: 2020-10-03-shaurya-user-trial-advanced
missile_id: shaurya
designation: User trial of advanced/lighter version
variant: Shaurya advanced version (lighter)
date: "2020-10-03"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 800
description: >-
  Successful test of a new, lighter and easier-to-operate version of the canister-launched,
  nuclear-capable Shaurya as part of user trials. Fired around 12:10 pm from launch complex 4 on Dr
  A.P.J. Abdul Kalam Island, the two-stage missile performed a terminal manoeuvre and struck its
  impact point in the Bay of Bengal with precision. The new variant has a strike range reported
  variously as ~800 km (700-1000 km). Days later (around Oct 6, 2020) the government cleared its
  induction/deployment into the Strategic Forces Command.
notes: >-
  Launch site corroborated as Abdul Kalam Island (launch complex 4) by CSIS Missile Threat, ANI and
  The Tribune; a minority of early reports said 'Balasore/Chandipur' (one wire piece dated it Oct
  4). Date Oct 3, 2020 (Saturday) confirmed by most sources. Range figure disputed across sources
  (CSIS ~750 km; The Week ~800 km; The Tribune ~1000 km). Induction/deployment clearance around Oct
  6, 2020 reported by Swarajya and others.
