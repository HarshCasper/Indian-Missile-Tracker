description: >-
  BrahMos fired from Launch Complex-3 at the Integrated Test Range, Chandipur, becoming (per
  reports) the first cruise missile tested in a steep-dive mode at supersonic speed, addressing the
  Army's Block-II target-discrimination requirement. Described as the system's 23rd flight.
notes: >-
