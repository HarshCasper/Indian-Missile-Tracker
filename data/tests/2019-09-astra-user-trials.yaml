id: 2019-09-astra-user-trials
missile_id: astra
variant: Mk1
date: 2019-09
date_precision: month
outcome: success
confidence: confirmed
site_id: itr-chandipur
designation: User/development trials (5 trials)
description: >-
  Five trials of the Astra BVRAAM air-launched from a Su-30MKI off the coast of Chandipur, Odisha,
  during 16-19 September 2019, against Jet Banshee targets across all threat scenarios. Three
  missiles were launched in combat configuration with warhead, neutralising manoeuvring targets, and
  a telemetered missile scored a direct hit at maximum range.
range_tested_km: 0
notes: >-
  Air-launched from Su-30MKI. Confirmed by official PIB/DRDO release and corroborating ANI coverage.
  Five trials over 16-19 Sep 2019.
