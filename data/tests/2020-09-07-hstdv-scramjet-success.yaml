id: 2020-09-07-hstdv-scramjet-success
missile_id: hstdv
date: "2020-09-07"
date_precision: day
site_id: abdul-kalam-island
outcome: success
designation: Scramjet flight demonstration
description: >-
  DRDO successfully demonstrated hypersonic air-breathing scramjet technology with the HSTDV flight
  at 11:03 hrs on 7 September 2020 from the Dr A.P.J. Abdul Kalam Launch Complex, Wheeler Island. A
  proven solid rocket motor took the cruise vehicle to about 30 km altitude, where the heat shield
  separated and the scramjet engine ignited and sustained combustion, achieving about Mach 6 for ~20
  seconds. The test proved aerodynamic, propulsion, separation and high-temperature-materials
  technologies for future hypersonic vehicles.
apogee_km: 30
confidence: confirmed
notes: >-
  Primary source is the PIB (Ministry of Defence) release PRID 1651956; corroborated by
  GlobalSecurity and Tribune India. Achieved ~Mach 6 for about 20 seconds at ~30 km altitude.
