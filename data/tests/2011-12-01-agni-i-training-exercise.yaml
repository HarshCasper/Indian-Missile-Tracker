description: >-
  Agni-I successfully test-fired as part of a Strategic Forces Command training exercise from the
  Odisha coast (ITR), with logistic support from DRDO. Fired from a road-mobile launcher, the
  missile impacted the target area in the Bay of Bengal.
notes: >-
  Reported as a training/operational-readiness launch by the Army's SFC at the ITR. The earlier
  '~600 seconds flight time' detail could not be independently re-verified and has been dropped.
