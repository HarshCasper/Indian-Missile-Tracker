id: 2018-02-20-agni-ii-user-trial
missile_id: agni-ii
variant: Agni-II
designation: SFC user trial
date: "2018-02-20"
date_precision: day
outcome: success
confidence: reported
site_id: abdul-kalam-island
range_tested_km: 2000
description: >-
  Agni-II user trial launched at ~08:38 IST from a transporter-erector-launcher at the Integrated
  Test Range on Dr A.P.J. Abdul Kalam Island, off the Odisha coast. CSIS Missile Threat reported the
  launch by the Strategic Forces Command as successful; estimated range 2,000-3,500 km with a 1,000
  kg payload.
notes: >-
  Date corroborated as 20 Feb 2018 by Scroll.in, The Diplomat and Millennium Post (a separate Agni-I
  test occurred 6 Feb 2018, which one GlobalSecurity/Sputnik item conflated). Outcome treated as
  reported: CSIS Missile Threat states it was successful, while The Diplomat noted at the time it
  was 'unclear' whether the test succeeded given the 2017 failure. Confidence kept at reported
  pending an official (PIB/MoD) confirmation.
