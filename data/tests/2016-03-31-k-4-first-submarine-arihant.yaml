site_id: offshore-visakhapatnam
range_tested_km: 700
description: >-
  First launch of the K-4 from an actual submarine, INS Arihant, about 45 nautical miles off the
  Visakhapatnam coast in full operational configuration with a dummy payload. The missile was fired
  from roughly 20 metres underwater and flew about 700 km to its target; the K-4 is rated to ~3,500
  km.
notes: >-
  Submarine launch from INS Arihant; recorded under offshore-visakhapatnam. Demonstrated range in
  this trial (~700 km) was well below the missile's full design range, consistent with a
  reduced-range proving shot. Date (31 March 2016), 700 km range and 20 m launch depth confirmed by
  MarineLink/wire reports.
