id: 2013-01-27-k-15-final-developmental-trial
missile_id: k-15
variant: Sagarika (B-05)
designation: 12th and final developmental trial
date: "2013-01-27"
date_precision: day
outcome: success
confidence: disputed
site_id: offshore-visakhapatnam
range_tested_km: 700
apogee_km: 20
description: >-
  Twelfth and final developmental flight trial of the K-15 Sagarika, marking completion of its
  development programme. The missile was ejected from an underwater pontoon off Visakhapatnam, rose
  to about 20 km altitude and was tested to its full range of ~700 km in the Bay of Bengal,
  reportedly meeting all objectives with single-digit impact accuracy. Cleared the missile for
  integration onto INS Arihant.
notes: >-
  Reported as the 12th and final flight trial (CSIS, Naval Technology, Defense Update, CASS India
  all describe 12 development trials completing here). DATE CONFLICT: CSIS, Defense Update and CASS
  India give 27 Jan 2013; Naval Technology gives 29 Jan 2013 - confidence set to disputed on the
  date. Launched from an underwater pontoon off Visakhapatnam.
