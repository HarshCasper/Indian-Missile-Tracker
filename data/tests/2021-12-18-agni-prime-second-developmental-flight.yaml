designation: Second developmental flight test
date: "2021-12-18"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  Second developmental flight test of Agni-P, fired at about 1106 hrs from Dr A.P.J. Abdul Kalam
  Island off the Odisha coast. The missile again followed a textbook trajectory and met all mission
  objectives, proving the reliable performance of the advanced technologies integrated into the
  system; DRDO said the test had additional features compared with the first flight.
notes: >-
  Two-stage canisterised solid-propellant missile with dual-redundant navigation and guidance. No
  demonstrated range stated. Date (18 December 2021, 1106 hrs) and site independently confirmed via
  Deccan Herald and GlobalSecurity's Agni-P test history.
