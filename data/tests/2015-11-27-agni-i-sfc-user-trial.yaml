description: >-
  Successful Strategic Forces Command user trial of the 700 km-range Agni-I from Dr A.P.J. Abdul
  Kalam Island off the Odisha coast on Friday, 27 November 2015. Defence sources described it as a
  'perfect launch' conducted during SFC exercises.
notes: >-
