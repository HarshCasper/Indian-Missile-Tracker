id: 2021-astra-mk2-captive-drop-trials
missile_id: astra-mk2
variant: Mk2
designation: Astra Mk-II captive-carry and launch-drop (ejection) trials
date: "2021"
date_precision: year
outcome: success
confidence: disputed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  During 2021, DRDO is reported to have conducted captive-carry and launch (drop/ejection) trials of
  the Astra Mk2 from a Su-30MKI over the Odisha test range, validating the missile's
  ejector-launcher ejection and retraction mechanism. These were non-powered separation/drop trials,
  not a live powered or guided firing. As of mid-2026 no powered/guided flight test of the Astra Mk2
  has been officially confirmed; powered trials with the new dual-pulse motor are planned for 2026.
notes: >-
  Air-launched from Su-30MKI over the Odisha range; site inferred as the Integrated Test Range /
  Odisha coast and not explicitly stated. Year-level date only. Downgraded to disputed: the only
  DIRECT source for the '2021 captive/launch-drop trials' wording is the Indian Defense Analysis
  WordPress blog (further-reading tier, cannot count as a citation), which attributes it to a MoD
  annual report; no PIB or mainstream indian/foreign outlet was found that directly states a 2021
  captive/drop trial. Program-context sources (ThePrint, EurAsian Times) confirm the Mk2 was in
  development in 2020-2021 but do not independently confirm this specific trial event. This was a
  captive/drop trial, not a guided firing.
