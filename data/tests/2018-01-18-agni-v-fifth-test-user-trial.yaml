id: 2018-01-18-agni-v-fifth-test-user-trial
missile_id: agni-v
variant: canisterised (road-mobile)
designation: Fifth flight test; first pre-induction/user trial
date: "2018-01-18"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 4900
description: >-
  India successfully test-fired the Agni-V at about 09:53 IST from Launch Pad-4 at Dr A.P.J. Abdul
  Kalam Island, launched from a canister on a road-mobile launcher. This fifth flight test was the
  first user-associated/pre-induction trial conducted by the Strategic Forces Command with DRDO; the
  missile flew roughly 4,900 km in about 19 minutes and hit its target in the Indian Ocean.
notes: Launch Pad-4, Abdul Kalam Island. First user/pre-induction trial.
