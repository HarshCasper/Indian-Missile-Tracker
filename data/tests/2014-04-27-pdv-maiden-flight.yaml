designation: PDV maiden flight test
date: "2014-04-27"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 2000
apogee_km: 120
description: >-
  Maiden flight test of the Prithvi Defence Vehicle (PDV) exo-atmospheric interceptor, launched at
  about 9:07 a.m. from Abdul Kalam Island (formerly Wheeler Island) off the Odisha coast. In an
  automated engagement it intercepted a two-stage target missile mimicking a hostile ballistic
  missile from over 2,000 km, destroying it at an altitude of more than 120 km in the
  exo-atmosphere, far exceeding the ~75-80 km ceiling of the earlier PAD interceptor.
notes: >-
  First flight of PDV, India's high-altitude exo-atmospheric ABM interceptor intended to replace
  PAD/Pradyumna. The ~2,000 km figure is the class of incoming missile the system is designed to
  engage, not the distance the interceptor flew. Target reportedly launched from a ship in the Bay
  of Bengal. Date, site (Abdul Kalam Island) and successful outcome independently corroborated by Al
  Jazeera, Defense Update and GlobalSecurity.
