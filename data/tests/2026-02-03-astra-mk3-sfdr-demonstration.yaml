site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO carried out a successful demonstration of SFDR technology from ITR Chandipur off the Odisha
  coast at around 1045 hrs on 3 February 2026. All subsystems — the nozzle-less booster, solid fuel
  ducted ramjet motor and fuel flow controller — performed as expected after a ground booster motor
  accelerated the vehicle to the desired Mach number; flight data confirmed performance.
notes: >-
  SFDR technology-demonstrator flight, not an integrated Astra Mk3 / Gandiva launch; the PIB release
  names SFDR technology, not Astra Mk3 / Gandiva, but this is the SFDR propulsion lineage of the
  Gandiva. PIB official release PRID 2222635 (posted 3 Feb 2026, 1715 hrs). Labs: DRDL, HEMRL, RCI
  and ITR Chandipur.
confidence: confirmed
