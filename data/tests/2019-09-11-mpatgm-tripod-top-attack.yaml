id: 2019-09-11-mpatgm-tripod-top-attack
missile_id: mpatgm
variant: developmental
designation: MPATGM Developmental Flight Trial (third series)
date: "2019-09-11"
date_precision: day
outcome: success
confidence: confirmed
description: >-
  DRDO successfully flight-tested the fire-and-forget MPATGM from a man-portable tripod launcher
  against a simulated tank target, which was hit and destroyed in top-attack mode. Described by the
  defence ministry as the third series of successful MPATGM testing, validating the imaging infrared
  seeker and avionics.
notes: >-
  Launch site: DRDO ranges at Kurnool, Andhra Pradesh (National Open Air Range / NOAR area; not KK
  Ranges, and not one of the listed facilities). Tripod-launched, top-attack against a dummy tank.
  Test conducted 11 September 2019 per defence-ministry statement (Tribune, Swarajya); The Diplomat
  reported it 12 September. Date re-verified.
