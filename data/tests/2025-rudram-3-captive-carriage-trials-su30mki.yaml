id: 2025-rudram-3-captive-carriage-trials-su30mki
missile_id: rudram-3
variant: Rudram-III (RudraM-III)
designation: Su-30MKI captive carriage / integration trials
date: "2025"
date_precision: year
outcome: success
confidence: reported
site_id: itr-chandipur
range_tested_km: 0
description: >-
  Captive carriage (and dummy/integration) trials of the Rudram-III air-to-surface anti-radiation
  missile were reported completed, with two missiles mounted on a modified Su-30MKI. The missile was
  carried aloft but not released, validating structural integrity, aerodynamic stability and
  aircraft-missile integration ahead of release/inflight trials. Reported air-launched over the
  Odisha test range/Bay of Bengal; exact date and location not officially disclosed.
notes: >-
  Carriage trial only (missile carried in flight, not fired) - not a powered/guided flight.
  Air-launched from a modified Su-30MKI; specific launch site NOT officially confirmed (assigned
  itr-chandipur as the customary Odisha air-to-surface test range, with the caveat that reports only
  say 'over the Odisha range / Bay of Bengal'). No exact date located; reported as completed in 2025
  by defence-news outlets. No PIB/MoD/DRDO press release exists for Rudram-III (verified: PIB only
  carries Rudram-I 2020 and Rudram-II 2024 releases). Distinct from the later July 2025
  release/separation trials. Confidence kept 'reported' - corroborated across multiple outlets but
  no official source and no exact date/site.
