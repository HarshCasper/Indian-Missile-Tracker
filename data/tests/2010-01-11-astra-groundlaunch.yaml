description: >-
  Ground-launched Astra test on 11 January 2010 from launch pad No. 2 at the ITR, Chandipur-on-sea.
  IRNA/GlobalSecurity report navigation, control, airframe and propulsion subsystems were validated
  and characterise the trial as successful.
