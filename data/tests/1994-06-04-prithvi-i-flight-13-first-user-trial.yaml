id: 1994-06-04-prithvi-i-flight-13-first-user-trial
missile_id: prithvi-i
variant: Prithvi-I (SS-150)
designation: Flight 13 (first Army user-trial)
date: "1994-06-04"
date_precision: day
outcome: success
confidence: reported
site_id: itr-chandipur
range_tested_km: 85
description: >-
  Thirteenth test of the Prithvi-I, fired from a mobile launcher at ITR Chandipur as the first of
  the Indian Army's pre-induction user-trials. First Prithvi test armed with a live warhead; the
  missile struck a target on Wheeler's Island, about 85 km from the ITR.
notes: >-
  Added test (development list previously truncated). Launched from ITR Chandipur; impact target was
  Wheeler's Island (now Dr A.P.J. Abdul Kalam Island) ~85 km away. An earlier 13th-test attempt
  scheduled for 23 May 1994 was cancelled in May 1994 after a faulty fuel-loading nozzle leaked
  propellant. Range: NTI gives 85 km to Wheeler's Island; GCAT gives 80 km - recorded as a claims
  dispute.
