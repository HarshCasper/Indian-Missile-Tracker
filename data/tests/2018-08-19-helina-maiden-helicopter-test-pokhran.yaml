id: 2018-08-19-helina-maiden-helicopter-test-pokhran
missile_id: helina
variant: HELINA (Army version)
designation: Maiden helicopter-launched flight test at Pokhran
date: "2018-08-19"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
range_tested_km: 7
description: >-
  On 19 August 2018 the helicopter-launched anti-tank guided missile HELINA was successfully flight
  tested from an Indian Army helicopter at the Pokhran ranges in Jaisalmer district, Rajasthan, at
  about 1400 hrs. The weapon system was tested for its full range; the missile released smoothly
  from the launch platform, tracked the target throughout its course and hit it with high precision.
  This was described as the first trial using an upgraded imaging infra-red (IIR) seeker.
notes: >-
  Platform disputed: the official statement said only 'Army helicopter' and did not specify; some
  outlets (e.g. Oneindia) say a HAL LCH, while analysts suggest the armed ALH (HAL Rudra) was the
  more likely platform. This is the maiden Pokhran helicopter trial of the program but not the
  first-ever helicopter-launched firing (three helicopter trials occurred at Chandan in July 2015).
  Range stated as the ~7 km system capability rather than a measured distance for this flight.
