description: >-
  India successfully test-fired the nuclear-capable Prithvi-II from a mobile launcher at Launch
  Complex-3, ITR Chandipur, Odisha. The user trial, conducted by the Army's Strategic Forces
  Command, met all parameters and was described as a complete success.
notes: >-
  Launch on Tuesday 7 January 2014 per IRNA; some outlets dated reports 8 January 2014 (publication
  date). Date precision: day (7 Jan).
