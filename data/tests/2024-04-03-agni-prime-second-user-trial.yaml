id: 2024-04-03-agni-prime-second-user-trial
missile_id: agni-prime
variant: Agni-P
designation: User trial (Strategic Forces Command & DRDO)
date: "2024-04-03"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  Strategic Forces Command, with DRDO, conducted a successful flight test of the new-generation
  ballistic missile Agni-Prime from Dr A.P.J. Abdul Kalam Island off the Odisha coast at about 1900
  hrs. The test met all trial objectives, validated by range sensors at multiple locations including
  two down-range ships at the terminal point. Witnessed by the Chief of Defence Staff, Chief of SFC,
  and senior DRDO and Indian Army officials.
notes: >-
  Second user trial (fifth overall flight). PIB release dated 4 April 2024 for the 3 April 2024
  launch. No demonstrated range disclosed. Date, site (Abdul Kalam Island), ~1900 hrs time, outcome
  and witnesses independently confirmed via PIB mirror and Janes.
