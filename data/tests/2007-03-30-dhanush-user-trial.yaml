id: 2007-03-30-dhanush-user-trial
missile_id: dhanush
variant: Prithvi-III (naval)
designation: Developmental/user trial
date: "2007-03-30"
date_precision: day
outcome: success
confidence: disputed
site_id: offshore-visakhapatnam
range_tested_km: 350
description: >-
  Dhanush was successfully test-fired from a naval ship in the Bay of Bengal off the Odisha coast,
  near the Integrated Test Range at Chandipur. Sources agree the launch succeeded and the missile
  reached its designated target, but disagree on the firing vessel (INS Subhadra vs INS Rajput) and
  the range demonstrated (250 km vs 350 km).
notes: >-
  Ship-launched, off the Odisha coast; site_id offshore-visakhapatnam used as the Bay-of-Bengal
  ship-launch proxy. DOWNGRADED to 'disputed': the Arms Control Association confirms the date as 30
  March 2007 and a successful naval Prithvi/Dhanush test, but domain-b reports the missile was fired
  from INS Rajput positioned ~60 km from ITR Chandipur at about 2:30 pm with a 250 km range, while
  other reporting attributes the launch to INS Subhadra at 350 km (the list's original note that INS
  Rajput served only as a tracking platform is not supported by domain-b, which names it as the
  launch vessel). CORRECTION: the original list cited a 2011 GlobalSecurity URL that does not cover
  this 2007 event; replaced with the Arms Control Association and domain-b sources. Some sources
  give the date as 31 March 2007, but Arms Control Association anchors it to 30 March 2007.
