id: 2020-10-12-nirbhay-itcm-manik-failure
missile_id: nirbhay
variant: ITCM (Indigenous Technology Cruise Missile, Manik engine)
designation: ITCM developmental trial (indigenous Manik turbofan)
date: "2020-10-12"
date_precision: day
outcome: failure
confidence: reported
site_id: itr-chandipur
range_tested_km: 0
description: >-
  First flight test of the Nirbhay-derived Indigenous Technology Cruise Missile (ITCM) fitted with
  the indigenous GTRE 'Manik' small turbofan engine, from the ITR off the Odisha coast. The booster
  phase achieved speed and altitude, but the new engine could not reach the required power level in
  the cruise phase; the missile flew only about eight minutes before the flight was aborted and the
  missile fell into the Bay of Bengal.
notes: >-
  Reported test date 12 October 2020 (some outlets reference the abort as 13 October 2020). Launched
  from ITR Chandipur, Odisha. Attributed to an engine/technical snag. Marked 'reported' confidence
  as coverage is single-strand secondary reporting rather than an official failure acknowledgement.
