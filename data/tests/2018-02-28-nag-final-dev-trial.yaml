id: 2018-02-28-nag-final-dev-trial
missile_id: nag
designation: Nag final developmental trial
date: "2018-02-28"
date_precision: day
outcome: success
site_id: pokhran-range
range_tested_km: 4
confidence: confirmed
description: >-
  The Nag ATGM was successfully flight-tested in desert conditions at the Pokhran ranges against two
  tank targets at different ranges and timings on 28 February 2018. With this, DRDO declared the
  developmental trials of the missile complete and the system ready for induction.
notes: >-
  Confirmed: DRDO/PIB official release ('Successful Flight Test of ATGM NAG') and independently
  reported by GlobalSecurity (Sputnik, 1 March 2018) and The Diplomat - all agree on a 28 February
  2018 final developmental trial at Pokhran, two tank targets, success, developmental trials
  complete. PIB content verified via search-engine reproduction and the GlobalSecurity/Diplomat
  mirrors (PIB site blocks direct fetch).
