id: 2011-09-24-shaurya-second-trial
missile_id: shaurya
designation: Second successful flight test (final configuration)
variant: Shaurya (production configuration)
date: "2011-09-24"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 700
description: >-
  Second flight test of the Shaurya, fired in its final/production configuration from a canister in
  ground-launch mode at Launch Complex-III of the ITR Chandipur (off Balasore, Odisha) at about 2:30
  pm. The missile flew its full ~700 km range in roughly 500 seconds at about Mach 7.5 and reached
  the designated target in the Bay of Bengal with reported metre-level accuracy. The missile was
  randomly drawn from the production lot to validate series production.
notes: >-
  Multiple reliable sources (Ajai Shukla/Broadsword; Livefist; Defense Update headline 'Second
  Successful Launch'; Defense Update text 'second developmental trial, first conducted on 12 Nov
  2008') describe this as the SECOND test. Wikipedia/HandWiki call it the 'third time', which is
  unsupported by the contemporaneous secondary sources and treated as unreliable. Range cited as 700
  km (some outlets ~750 km). Site reported as ITR Chandipur / Balasore (same facility); the ITR
  Chandipur complex is ~15 km from Balasore.
