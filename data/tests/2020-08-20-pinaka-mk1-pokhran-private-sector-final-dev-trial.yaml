id: 2020-08-20-pinaka-mk1-pokhran-private-sector-final-dev-trial
missile_id: pinaka-mk1
variant: Pinaka Mk-I (unguided baseline, private-sector produced)
designation: Final developmental trial
date: "2020-08-20"
date_precision: day
outcome: success
confidence: reported
site_id: pokhran-range
range_tested_km: 37.5
description: >-
  The Indian Army successfully conducted final developmental trials at the Pokhran Range of six
  Pinaka Mk-I rockets manufactured entirely by the Indian private sector (Economic Explosives Ltd, a
  Solar Industries subsidiary) under a Transfer of Technology agreement from DRDO. It was the first
  time Pinaka rockets fully produced by a private firm were trialed, aimed at reducing single-source
  dependency on the Ordnance Factory Board.
notes: >-
  Date corrected from 2020-08-19 to 2020-08-20: contemporaneous Indian/foreign news (LatestLY,
  EurasianTimes, American Military News) report the firing occurred on Wednesday 20 August 2020. The
  wiki-derived '19 August' framing in the original list conflicts with these. Six rockets fired.
