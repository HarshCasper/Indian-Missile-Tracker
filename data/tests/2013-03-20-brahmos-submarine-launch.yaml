id: 2013-03-20-brahmos-submarine-launch
missile_id: brahmos
variant: Submarine-launched (vertical, submerged platform)
designation: First underwater/submerged-platform launch
date: "2013-03-20"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 290
description: >-
  Submarine/underwater version of BrahMos test-fired at 1410 hrs from a submerged pontoon platform
  in the Bay of Bengal off Visakhapatnam. The missile took off vertically, emerged from underwater,
  turned toward the target and met all mission objectives for its full 290 km range, making India
  the first country to launch a supersonic cruise missile vertically from a submerged platform.
notes: >-
  ADDED test (missing from original list). Fired from a submerged pontoon (not an operational
  submarine). Confirmed by the official BrahMos Aerospace press release and Navy Recognition.
