description: >-
  Second of the two consecutive maiden developmental trials, conducted the morning after the first.
  Reported as a different-range trajectory in top-attack mode; all mission objectives met.
notes: >-
  Launch site: Army's KK Ranges, Ahmednagar, Maharashtra (not one of the listed facilities). The
  Indian MoD statement described the two missions of 15 and 16 September 2018 as covering different
  ranges including maximum-range capability. Re-verified against The Diplomat, Army Technology and
  Livefist.
