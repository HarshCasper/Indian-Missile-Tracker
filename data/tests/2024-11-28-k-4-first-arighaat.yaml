id: 2024-11-28-k-4-first-arighaat
missile_id: k-4
variant: K-4
date: "2024-11-28"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 3500
description: >-
  First launch of the K-4 from INS Arighaat, India's second Arihant-class SSBN (commissioned 29
  August 2024), in the Bay of Bengal off Visakhapatnam. This was the first time the ~3,500 km K-4
  was fired from this submarine, transitioning from pontoon trials toward operational deployment. A
  maritime warning corridor of ~3,490 km was issued for the test.
notes: >-
  Submarine launch from INS Arighaat; recorded under offshore-visakhapatnam. Date most widely
  reported as 28 November 2024 (Business Standard, Deccan Herald, Naval Technology); some reporting
  indicates the actual launch occurred on the morning of 27 November 2024 (publication 28 Nov).
  Confirmed across multiple independent Indian and foreign outlets.
