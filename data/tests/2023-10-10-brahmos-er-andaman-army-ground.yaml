description: >-
  The BrahMos Missile Regiment of the Indian Army test-fired a ground-launched, surface-to-surface
  land-attack version of the extended-range BrahMos (BrahMos ER) from the Andaman and Nicobar
  Islands as part of pre-induction trials. The ER variant is assessed to reach 400-500 km, with
  improved accuracy from an active radar seeker.
notes: >-
  Launch site was the Andaman and Nicobar Islands (Andaman & Nicobar Command), not one of the listed
  Odisha-coast facilities; site_id left empty. Conducted as an induction trial, not yet inducted at
  the time. Verified via Janes and Swarajya.
