description: >-
  India successfully test-fired the nuclear-capable Prithvi-II from a mobile launcher at Launch
  Complex-3, ITR Chandipur, at about 12:10 p.m., as a Strategic Forces Command user trial. The 350
  km-range missile met all mission parameters.
notes: >-
