description: >-
  First of two ground-launched developmental flight tests on 13 September 2008 from the Interim Test
  Range, Balasore/Chandipur, in the second phase of the development programme. Objective was to test
  mid-course guidance toward a manoeuvring target aircraft via a secure data link; DRDO reported all
  subsystems performed as designed.
