id: 2023-10-18-brahmos-a-southern-base-sortie
missile_id: brahmos-a
variant: BrahMos-A (Extended Range, ~400-500 km)
designation: Air-launched BrahMos test from southern peninsula base
date: "2023-10-18"
date_precision: day
outcome: success
confidence: reported
site_id: itr-chandipur
description: >-
  An IAF Su-30MKI taking off from a southern peninsula air base (reported as Thanjavur) successfully
  test-fired the air-launched BrahMos over the Bay of Bengal, with the launch aircraft covering a
  sortie of over 1,500 km. Reported as part of pre-induction/operational trials and described as an
  extended-range variant firing.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal (firing point counted under itr-chandipur);
  aircraft staged from a southern base, reported as Thanjavur Air Base, with a sortie of over 1,500
  km. Described by Swarajya as an extended-range version. No PIB/MoD release located in this
  research, hence 'reported'. This test was MISSING from the original compiled list and has been
  added.
