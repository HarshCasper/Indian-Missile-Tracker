description: >-
  Strategic Forces Command user trial of an upgraded Agni-I with improved reentry technology and
  maneuverability, fired from a rail-mobile launcher from launch pad-4 of the ITR, off the Odisha
  coast. The trial was reported successful.
notes: >-
  Sources cite a range capability of 700-900 km for the upgraded version; the demonstrated distance
  for this specific shot was not separately stated. Single solid foreign-news source (IRNA)
  independently seen.
