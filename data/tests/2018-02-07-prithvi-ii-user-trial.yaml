description: >-
  India successfully test-fired the nuclear-capable Prithvi-II from a mobile launcher at Launch
  Complex-3, ITR Chandipur, in a daytime user trial by the Army. The 350 km-range missile met all
  mission objectives in a launch described as fully successful.
notes: >-
  ADDED test, previously missing. DATE DISCREPANCY: most reports state the launch occurred 7
  February 2018 (~10:40 a.m.); some outlets (e.g., Newsbharati) reported it as 8 February 2018
  (~11:35 a.m.), likely a publication-date difference. Recorded as 7 February with this caveat.
