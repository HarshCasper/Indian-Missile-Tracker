id: 2022-11-02-ad-1-maiden-flight-test
missile_id: ad-1
variant: AD-1
designation: Phase-II BMD interceptor maiden flight-test
date: "2022-11-02"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
description: >-
  DRDO conducted the successful maiden flight-test of the Phase-II Ballistic Missile Defence (BMD)
  interceptor AD-1, a two-stage solid-propelled long-range interceptor designed for both
  endo-atmospheric and low exo-atmospheric interception of long-range ballistic missiles and
  aircraft. The PIB release names the interceptor explicitly as the AD-1. All sub-systems performed
  as expected and the flight was validated by radar, telemetry and electro-optical tracking
  stations; all Phase-II BMD weapon-system elements at multiple geographic locations participated.
range_tested_km: 0
notes: >-
  Launched from Dr A.P.J. Abdul Kalam Island (Wheeler Island), off the Odisha coast. No specific
  demonstrated intercept range/altitude was released for this maiden trial; DRDO stated the system
  is intended to defend against ballistic missiles of the 5,000 km class with a 'large kill altitude
  bracket'. The 5,000 km figure is a design/capability claim, not a range flown in this test.
  Independently re-verified against the PIB release (which names AD-1) plus Business Standard, India
  TV, Janes and Army Technology.
