description: >-
  Maiden developmental flight test of the Prithvi-II, the extended-range (250 km) Air Force variant
  of the Prithvi SRBM, fired from the Chandipur/Balasore test range in Odisha by DRDO. Marked the
  first flight of the longer-range Prithvi variant.
notes: >-
  Earliest documented Prithvi-II flight; consistently cited as 27 January 1996 by reference sources.
  Only one reliable secondary source (CSIS Missile Threat) plus a further-reading site located;
  original 1996 press reports not directly retrievable.
