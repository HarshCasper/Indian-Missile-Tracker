id: 2024-11-12-lrlacm-maiden-flight
missile_id: lrlacm
variant: ground-launched (mobile articulated launcher)
date: "2024-11-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO conducted the maiden flight-test of the Long Range Land Attack Cruise Missile (LRLACM) from
  the Integrated Test Range (ITR), Chandipur, off the Odisha coast, launched from a mobile
  articulated launcher. All sub-systems performed as expected and the missile met its primary
  mission objectives, following the desired path using waypoint navigation and demonstrating
  manoeuvres at various altitudes and speeds. The flight was monitored by radar, an electro-optical
  tracking system and telemetry stations.
notes: >-
  First flight test of the LRLACM, a subsonic (around Mach 0.8) cruise missile developed with
  Aeronautical Development Establishment (ADE), Bengaluru, as nodal lab; Bharat Dynamics Ltd and
  Bharat Electronics Ltd are development-cum-production partners. No specific distance flown was
  disclosed for this test. Test date (12 Nov 2024) is corroborated by PIB, All India Radio, ETV
  Bharat and Army Recognition; The Tribune's 13 Nov 2024 is its publication date, not the test date.
  PIB pages (PRID 2072829) returned HTTP 403 on direct fetch but the release and its title were
  visible in search and the content is independently corroborated.
