id: 2024-11-14-pinaka-mk2-guided-psqr-validation
missile_id: pinaka-mk2
variant: Guided Pinaka Weapon System (precision-strike variant)
designation: Guided Pinaka Weapon System PSQR Validation Trials (three phases)
date: "2024-11-14"
date_precision: day
outcome: success
confidence: confirmed
range_tested_km: 75
description: >-
  DRDO completed flight tests of the Guided Pinaka Weapon System as part of Provisional Staff
  Qualitative Requirements (PSQR) Validation Trials, announced 14 November 2024. Conducted in three
  phases at different field firing ranges, the trials assessed ranging, accuracy, consistency and
  rate of fire for multiple-target salvo engagement. Twelve rockets from each of two production
  agencies, fired from two upgraded in-service Pinaka launchers, were tested, completing all
  prerequisite flight trials before induction into the Indian Army.
notes: >-
  Verified via PIB (PRID 2073384, GlobalSecurity mirror), ANI and Janes. CORRECTION: site_id left
  EMPTY because the MoD/PIB release and Janes explicitly state the three-phase trials were conducted
  at undisclosed 'different field firing ranges' - the original entry's assumption of Pokhran is not
  confirmed by any source. Real site: undisclosed Indian Army field firing ranges. Quoted system
  range capability ~75 km (not a single tested figure).
