id: 2001-06-12-brahmos-maiden-launch
missile_id: brahmos
variant: Surface-launch prototype (vertical)
designation: First flight test
date: "2001-06-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
description: >-
  Maiden flight test of the BrahMos supersonic cruise missile, fired from a stationary vertical
  launcher off the Chandipur coast in Odisha. BrahMos Aerospace describes it as the first successful
  launch of the system.
notes: >-
  First-ever BrahMos launch. The 290 km figure is the missile's design range, not a distance
  reported as flown in this specific test, so it is not recorded as range_tested_km. Confirmed by
  the official BrahMos Aerospace history page and a 25th-anniversary retrospective in The Tribune.
