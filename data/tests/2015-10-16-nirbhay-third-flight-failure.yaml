id: 2015-10-16-nirbhay-third-flight-failure
missile_id: nirbhay
variant: Nirbhay (ground-launched, developmental)
designation: Third developmental flight test
date: "2015-10-16"
date_precision: day
outcome: failure
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 128
description: >-
  Third flight test from ITR Chandipur. Booster ignition, booster separation, wing deployment and
  engine start were achieved, but the trial was aborted after about 700 seconds; the missile
  nose-dived into the Bay of Bengal after covering only about 128 km. Reported cause was a
  guidance/wing-deployment problem that caused the inertial navigation system to lose its reference.
notes: >-
  Demonstrated only ~128 km before failure. Cause attributed to a guidance/wing-deployment problem.
  CSIS frames it as terminated due to a guidance-system malfunction.
