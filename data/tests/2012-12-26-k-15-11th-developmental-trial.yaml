id: 2012-12-26-k-15-11th-developmental-trial
missile_id: k-15
variant: Sagarika (B-05)
designation: 11th developmental trial (operational configuration)
date: "2012-12-26"
date_precision: day
outcome: success
confidence: reported
site_id: offshore-visakhapatnam
range_tested_km: 650
apogee_km: 20
description: >-
  Eleventh developmental trial of the K-15 Sagarika, fired in full operational configuration after
  being delayed from November. The missile was ejected from a submerged pontoon at 20-40 m depth
  using a gas generator, reached an apogee of about 20 km and was tested to a range of 650 km in the
  Bay of Bengal off Visakhapatnam. A planned companion launch from a live submarine was cancelled
  and rescheduled. CSIS confirms the K-15 completed its developmental test programme over this
  period.
notes: >-
  Launched from a submerged pontoon at 20-40 m depth off Visakhapatnam. A companion live-submarine
  launch was scheduled but cancelled and pushed to the following year. The 650 km range and ~20 km
  apogee figures are only documented in Wikipedia/Wikipedia-derived sources (further-reading); the
  existence of a late-2012 developmental trial is corroborated by CSIS (foreign-news) and Defense
  Update. Date (26 Dec 2012) is from further-reading only.
