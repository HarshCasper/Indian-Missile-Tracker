date: "2015-04-16"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 3000
description: >-
  Third Strategic Forces Command user trial of the Agni-III, fired from Launch Complex-4 of the
  Integrated Test Range at Wheeler/Abdul Kalam Island off the Odisha coast. The trial was fully
  successful and carried out to establish the repeatability of the missile's performance; the
  missile has a strike range of more than 3,000 km and can carry up to a 1.5-tonne warhead.
notes: Two-stage solid-propellant missile, ~17 m long, ~2 m diameter, ~50 t launch weight.
