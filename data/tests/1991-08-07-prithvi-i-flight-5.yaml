designation: Flight 5
date: "1991-08-07"
date_precision: day
outcome: success
confidence: reported
site_id: sriharikota-shar
range_tested_km: 150
description: >-
  Fifth flight-test of the Prithvi-I at 10:58 a.m. from SHAR Sriharikota. Indian defence sources
  highlighted the missile's high warhead-to-launch-weight ratio (1,000 kg warhead over 150 km
  range); several warhead types including submunition dispensers and fuel-air explosives were under
  development.
notes: Date and site agree between NTI (citing Milavnews, Sept 1991) and GCAT (1991 Aug 7, SHAR).
