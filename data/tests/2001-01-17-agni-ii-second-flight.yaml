id: 2001-01-17-agni-ii-second-flight
missile_id: agni-ii
variant: Agni-II
designation: Second flight test (final operational configuration)
date: "2001-01-17"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 2100
description: >-
  Second flight test of the Agni-II, fired at 10:01 IST. India's Defence Ministry said the missile
  was tested in its 'final operational configuration' and that mission objectives were met
  satisfactorily; reported range ~2,000-2,100 km. This test demonstrated road-mobile (TEL) launch
  capability and cleared the missile for limited production.
notes: >-
  Launch site disputed: most sources (GlobalSecurity, CSIS) cite Wheeler Island (IC-4 pad); Arms
  Control Association states the Interim/Integrated Test Range at Chandipur. Both are on the Odisha
  coast; site_id set to abdul-kalam-island per the majority of sources, dispute recorded in claims.
  Demonstrated road TEL launch; ~1,000 kg payload over 2,000+ km.
