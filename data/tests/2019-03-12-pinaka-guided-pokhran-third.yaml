id: 2019-03-12-pinaka-guided-pokhran-third
missile_id: pinaka-guided
variant: Guided Pinaka (Pinaka Mark-II Guided, extended range)
designation: Guided Pinaka Pokhran trials (Day 2, third firing)
date: "2019-03-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
range_tested_km: 90
description: >-
  A third Guided Pinaka rocket was successfully test-fired on 12 March 2019 from the Pokhran Field
  Firing Range, Rajasthan, completing a series of three trials in 24 hours (two on 11 March, one on
  12 March). The weapon impacted the intended target with high precision; the MoD stated all mission
  objectives were met across the trials, with the system able to deliver ~7.2 tonnes of high
  explosive onto a target 70 km away with ~25 m accuracy in 44 seconds.
notes: >-
  Confirmed as the 'third test in 24 hours' by GlobalSecurity/Sputnik and PIB. Site Pokhran,
  outcome success, 90 km band all agree.
