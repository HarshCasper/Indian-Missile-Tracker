id: 2018-02-06-agni-i-sfc-user-trial
missile_id: agni-i
variant: Agni-I
date: "2018-02-06"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
designation: Strategic Forces Command user trial
range_tested_km: 700
description: >-
  Successful test of the nuclear-capable 700 km-range Agni-I from launch pad-4 of the ITR at Dr
  A.P.J. Abdul Kalam Island, off the Odisha coast, conducted at about 8:30 a.m. by the Strategic
  Forces Command of the Army. Reported as the 18th Agni-I and a 'complete success' meeting all
  mission objectives.
notes: >-
  Added test missing from the original list. Confirmed by The Diplomat and India.com; this was a
  morning (not night) launch.
