id: 2020-10-19-sant-maiden-ground-launch
missile_id: sant
variant: ground/roof-top static-launched test article
designation: SANT Stand-off Anti-tank Missile
date: "2020-10-19"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 12
description: >-
  Maiden flight test of the DRDO Stand-off Anti-tank (SANT) missile, fired from a roof-top/ground
  static launcher at the Integrated Test Range (ITR) off the Odisha coast on 19 October 2020. The
  missile met all mission parameters and the designated static target was hit with high accuracy.
  The system demonstrated both Lock-on Before Launch and Lock-on After Launch capability; a range of
  about 12 km was reported for this test.
notes: >-
  First documented SANT flight. Launched from a static roof-top/ground-based launcher (NOT a
  helicopter) at ITR off the Odisha coast; site mapped to itr-chandipur. No PIB/MoD official press
  release exists for this 2020 test; verification rests on consistent Indian news reporting
  (ANI-derived BW, Telangana Today, Zee, Swarajya, adda247). Reported as India's 11th-12th missile
  test in ~45 days during heightened India-China border tensions (one outlet's headline says 11th
  while its body says 12th). SANT is an upgraded development of the Helicopter-launched Nag (HeliNa)
  with a nose-mounted seeker. A few outlets gave the test date as 21 October (likely the article
  update date); 19 October is the dominant figure across sources.
claims:
