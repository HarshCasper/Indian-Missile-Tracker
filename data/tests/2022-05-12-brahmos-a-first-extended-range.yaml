id: 2022-05-12-brahmos-a-first-extended-range
missile_id: brahmos-a
variant: BrahMos-A Extended Range (ER, ~350-400 km)
designation: First Extended Range air-launched BrahMos firing
date: "2022-05-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 400
description: >-
  First launch of the Extended Range (ER) version of the air-launched BrahMos from a Su-30MKI. The
  missile achieved a direct hit on the designated target in the Bay of Bengal region, giving the IAF
  the capability to strike land/sea targets over much longer ranges than the baseline ~290 km
  variant.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal off Odisha (counted under itr-chandipur).
  Confirmed by an official PIB / Ministry of Defence release dated 12 May 2022. Range reported as
  extended to over 350 km (some reports ~400 km) from the original ~290 km. This test was MISSING
  from the original compiled list and has been added.
