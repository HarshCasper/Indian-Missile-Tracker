id: 2026-06-15-lrlacm-second-flight
missile_id: lrlacm
variant: ground-launched (Dr APJ Abdul Kalam Island)
date: "2026-06-15"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  DRDO conducted a successful flight-test of the Long Range Land Attack Cruise Missile (LRLACM) from
  Dr APJ Abdul Kalam Island off the Odisha coast. All test objectives were fully met as per data
  captured by tracking instruments deployed by the Integrated Test Range, Chandipur, validating
  critical technologies across propulsion, guidance, navigation and control through the midcourse
  and terminal phases. The launch was witnessed by senior DRDO officials and user representatives
  from the Indian Navy and Indian Air Force, the prospective operators.
notes: >-
  Chronologically the second LRLACM flight test, following the 12 Nov 2024 maiden test, though the
  June 2026 official release and most outlets do not explicitly label it the 'second' test. Defence
  Minister Rajnath Singh congratulated DRDO and industry partners (ADE Bengaluru is nodal lab). No
  specific distance flown was disclosed for this test. Date (15 Jun 2026), site (Dr APJ Abdul Kalam
  Island) and success outcome corroborated across PIB (PRID 2273160), The Tribune, ETV Bharat, India
  TV, Business Standard and others. PIB and some news pages returned HTTP 403 on direct fetch but
  titles/content were visible in search and independently corroborated.
