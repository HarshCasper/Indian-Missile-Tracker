description: >-
  A Nag missile hit a target at a range of half a kilometre in about three seconds during summer
  trials in Rajasthan, demonstrating the 500 m minimum-range engagement capability.
notes: >-
  The Hindu (Y. Mallikarjun). Demonstrated the 500 m minimum-range engagement; a follow-on test
  reportedly hit a moving target within ~3.2 seconds. Single Indian-news source; same reporting
  thread as the January 2010 trial.
