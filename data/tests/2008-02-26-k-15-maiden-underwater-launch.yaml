id: 2008-02-26-k-15-maiden-underwater-launch
missile_id: k-15
variant: Sagarika (B-05)
designation: Sagarika maiden underwater launch
date: "2008-02-26"
date_precision: day
outcome: success
confidence: disputed
site_id: offshore-visakhapatnam
range_tested_km: 700
apogee_km: 0
description: >-
  India's first publicly reported underwater-launched ballistic missile test. The Sagarika (K-15)
  was ejected from a submerged pontoon roughly 50 m below the surface and about 8-13 km off the
  Visakhapatnam coast, simulating a submarine launch; the booster ignited and the missile impacted
  the sea over 700 km away. Reported as a successful proof of underwater-launch capability, joining
  the US, Russia, France and China in that club. GlobalSecurity describes it as the 'sixth test' of
  the Sagarika.
notes: >-
  Launched from a submerged pontoon off Visakhapatnam (Bay of Bengal), not from a submarine. DATE
  CONFLICT: IPCS and most Indian/secondary sources give 26 Feb 2008; GlobalSecurity dates the firing
  to 27 Feb 2008 and calls it the 'sixth test of the 700-km range Sagarika.' Confidence set to
  disputed on the date. Design/strike range cited as 750 km (IRNA pre-test report); demonstrated
  impact reported as over 700 km. CSIS notes the K-15 reportedly underwent ~10 test firings (mostly
  undated/partial) between 2004 and 2008.
