description: >-
  The Indian Navy announced the successful engagement of a land-based target with an
  extended/enhanced-range BrahMos supersonic cruise missile from a Rajput-class destroyer (reported
  as INS Ranvir or INS Ranvijay). A no-fly/area warning of ~900 km - the longest known for a BrahMos
  test - accompanied the firing, suggesting a ~800-900 km reach.
notes: >-
  DISPUTED variant attribution: sources describe this as an 'enhanced range' BrahMos reaching
  ~800-900 km, materially longer than the ~400-500 km BrahMos-ER class represented by the other
  entries. It may be a distinct enhanced-range development rather than the same ER variant; included
  under brahmos-er with this caveat. Range is inferred from the area-warning length, not officially
  confirmed. Ship-launched; site_id set to offshore-visakhapatnam per the ship-launched instruction
  with the vessel noted. Verified via Naval News and MilitaryLeak.
