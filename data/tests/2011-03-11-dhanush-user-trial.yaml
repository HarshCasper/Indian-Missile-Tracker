id: 2011-03-11-dhanush-user-trial
missile_id: dhanush
variant: Prithvi-III (naval)
designation: User training trial
date: "2011-03-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 350
description: >-
  India test-fired the nuclear-capable, 350 km-range Dhanush from a naval ship in the Bay of Bengal
  between Paradip and Puri off the Odisha coast at about 10:03-10:05 hrs IST, by Indian Navy
  personnel as part of a user-training exercise. The missile followed a textbook trajectory and hit
  the target with high accuracy.
notes: >-
  Ship-launched, off the Odisha coast between Paradip and Puri in the Bay of Bengal; site_id
  offshore-visakhapatnam used as the Bay-of-Bengal ship-launch proxy. GlobalSecurity (IRNA) confirms
  the 11 March 2011 date, ~10:05 hrs IST launch, success, and 350 km range. One source
  (naval-technology) carries the publication date 13 March 2011 but describes the same 11 March 2011
  event.
