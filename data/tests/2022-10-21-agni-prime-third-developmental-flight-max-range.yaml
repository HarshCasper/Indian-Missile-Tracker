site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  Third and final developmental flight test of Agni-P, fired off the Odisha coast (Dr A.P.J. Abdul
  Kalam Island) to achieve maximum range. The missile met all mission parameters/test objectives.
  This third consecutive success established the accuracy and reliability of the system and
  effectively completed developmental trials, clearing it for user trials.
notes: >-
  Marked completion of developmental trials. Maximum range flown but exact distance not officially
  disclosed; design max ~2,000 km. The original MilitaryLeak citation was a dead link (HTTP 404) and
  was removed; replaced with The Tribune. Janes (2024) and GlobalSecurity corroborate this as the
  third developmental test after which development was declared complete.
