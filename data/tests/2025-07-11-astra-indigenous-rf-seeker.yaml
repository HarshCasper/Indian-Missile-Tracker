date: "2025-07-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
designation: Flight test with indigenous RF seeker (Su-30MKI)
description: >-
  DRDO and IAF flight-tested the Astra BVRAAM fitted with an indigenous Radio Frequency (RF) seeker,
  air-launched from a Su-30 Mk-I off the coast of Odisha on 11 July 2025. Two launches were carried
  out against high-speed unmanned aerial targets at different ranges and aspects; in both cases the
  missiles destroyed the targets with pin-point accuracy.
range_tested_km: 0
notes: >-
  Air-launched from Su-30MKI over the Odisha range; site_id itr-chandipur with air-launch note.
  Confirmed by official PIB/MoD release (mirrored on GlobalSecurity) and Indian press (Business
  Standard).
