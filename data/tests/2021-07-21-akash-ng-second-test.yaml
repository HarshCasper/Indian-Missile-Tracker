description: >-
  Second flight test of the Akash-NG from the Integrated Test Range, Chandipur, at about 12:45 pm on
  21 July 2021, conducted from a land-based platform with the full weapon system — multifunction
  radar, command/control/communication system and launcher — participating in deployment
  configuration. Reported successful.
