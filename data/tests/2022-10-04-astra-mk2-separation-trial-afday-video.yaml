id: 2022-10-04-astra-mk2-separation-trial-afday-video
missile_id: astra-mk2
variant: Mk2
designation: Astra Mk-II separation/dummy-ejection trial (IAF 90th Air Force Day promo video)
date: "2022-10-04"
date_precision: day
outcome: unknown
confidence: disputed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  Ahead of the 90th Air Force Day (8 October 2022), on 4 October 2022 the IAF released a promotional
  video showing a missile marked 'BVR MK-II Astra' being ejected/launched from a Su-30MKI. Analysts
  (Swarajya, EurAsian Times) assessed the footage as a dummy ejection/separation developmental trial
  because the missile's dual-pulse motor was not seen igniting, i.e. a separation trial rather than
  a powered guided firing. The exact trial date is not stated; 4 October 2022 is the video-release
  date.
notes: >-
  Air-launched separation trial from Su-30MKI over the Odisha range; site inferred (not explicitly
  stated). The 4 Oct 2022 date is the video-RELEASE date, not necessarily the trial date. Sources
  conflict on whether the clip shows a real launch or only a dummy/separation ejection, so
  confidence is disputed and outcome is unknown. No powered guided firing of the Astra Mk2 had been
  confirmed as of mid-2026.
