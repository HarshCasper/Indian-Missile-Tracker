id: 2022-04-19-brahmos-a-decommissioned-ship
missile_id: brahmos-a
variant: BrahMos-A (baseline ~290 km)
designation: Anti-ship live firing vs decommissioned Navy ship
date: "2022-04-19"
date_precision: day
outcome: success
confidence: reported
site_id: itr-chandipur
description: >-
  The IAF live-fired the air-launched BrahMos from a Su-30MKI on the eastern seaboard against a
  decommissioned Indian Navy ship, achieving a direct hit. Conducted with Indian Navy and DRDO
  coordination to validate the anti-ship strike capability.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal / eastern seaboard (counted under
  itr-chandipur). Date conflict: Defence Stories/Asian Military Review report 19 April 2022, while
  aggregators (Airforce Technology, OvertDefense) dated coverage 20-21 April 2022. A separate INS
  Delhi ship-launched BrahMos test occurred in the same period and is not counted here. Reported as
  roughly the seventh publicly known air-launch test; no single PIB release located, hence
  'reported'.
