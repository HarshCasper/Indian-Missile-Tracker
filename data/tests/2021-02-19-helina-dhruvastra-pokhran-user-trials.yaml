id: 2021-02-19-helina-dhruvastra-pokhran-user-trials
missile_id: helina
variant: HELINA (Army) & Dhruvastra (IAF)
designation: Joint user trials (five missions)
date: "2021-02-19"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
range_tested_km: 7
description: >-
  DRDO conducted successful joint user trials of HELINA (Army version) and Dhruvastra (IAF version)
  from an Advanced Light Helicopter (ALH) platform in the Pokhran desert ranges, Rajasthan. Five
  missions evaluated minimum and maximum range; missiles were fired in hover and maximum forward
  flight against static and moving targets, some with warheads against derelict tanks, including one
  against a moving target from a forward-flying helicopter.
notes: >-
  Confirmed by PIB/MoD official release. Reported as a 100% (five-of-five) hit rate by some outlets.
  Date reflects the announcement and trial completion (19 Feb 2021).
