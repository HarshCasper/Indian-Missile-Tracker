id: 2022-09-qrsam-six-flight-evaluation-trials
missile_id: qrsam
date: 2022-09
date_precision: month
site_id: itr-chandipur
outcome: success
designation: Six evaluation flight tests (Army)
description: >-
  DRDO and the Indian Army successfully conducted six flight tests of the QRSAM system from ITR
  Chandipur in September 2022 as part of evaluation trials. The tests covered long range, medium
  range, low-radar-signature and high-manoeuvring targets, as well as a salvo launch, completing the
  evaluation series ahead of Army induction.
confidence: confirmed
notes: >-
  Primary source is the PIB (Ministry of Defence) release PRID 1857724; corroborated by domain-b.
  Recorded as one record covering the six-firing September 2022 evaluation series.
