description: >-
  India's Army Strategic Forces Command successfully test-fired a Prithvi-II from the DRDO range
  facility at Chandipur, Odisha. The missile, randomly selected from production stock, was launched
  as part of a practice drill and the mission fully validated operational readiness with improved
  CEP.
notes: >-
  ADDED test, previously missing. Identified after confirming that an IRNA report
  (india-121220-irna01.htm) cited elsewhere as a 2010 source actually describes this 20 December
  2012 single-missile trial.
