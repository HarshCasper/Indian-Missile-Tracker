id: 1988-02-25-prithvi-i-maiden-flight
missile_id: prithvi-i
variant: Prithvi-I (SS-150)
designation: Flight 1 (PE-01)
date: "1988-02-25"
date_precision: day
outcome: success
confidence: disputed
site_id: sriharikota-shar
range_tested_km: 150
description: >-
  Maiden flight-test of the 150 km-range Prithvi-I, India's first indigenously developed
  surface-to-surface ballistic missile, from ISRO's Sriharikota High-Altitude Range (SHAR). PM Rajiv
  Gandhi informed parliament that all test requirements were met. Reportedly successful, following
  the predicted trajectory.
notes: >-
  First-flight date is genuinely disputed across reliable sources: NTI/CNS (citing Delhi Domestic
  Service/FBIS) and GlobalSecurity/FAS give 25 Feb 1988; CSIS Missile Threat gives PE-01 on 8 Feb
  1988; AFP/PTI (via NTI) and nuclearweaponarchive give 22 Feb 1988; some sources cite 18 Feb 1988.
  25 Feb treated as the canonical date per the primary FBIS-cited entry, but confidence downgraded
  to disputed because the day-level date does not agree across independent sources.
