id: 2023-11-21-nasm-sr-guided-flight-trials
missile_id: nasm-sr
designation: Guided flight trials
date: "2023-11-21"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO and the Indian Navy conducted successful guided flight trials of the NASM-SR launched from an
  Indian Navy Sea King Mk.42B helicopter at the Integrated Test Range, Chandipur, validating
  indigenous seeker and guidance technology. The sea-skimming missile demonstrated precision
  guidance toward a ship target, a significant step toward self-reliance in seeker/guidance
  technology.
notes: >-
  Air-launched from an Indian Navy Sea King Mk.42B helicopter (IN529/W, INAS 336) over the Odisha
  test range. Site (ITR Chandipur) and date (21 Nov 2023) corroborated by Janes, Deccan Herald,
  key.aero and Swarajya. The 'Mach ~0.8 / subsonic' figure is a published system specification, not
  a value officially disclosed for this specific trial; demonstrated range for this trial was not
  officially stated.
