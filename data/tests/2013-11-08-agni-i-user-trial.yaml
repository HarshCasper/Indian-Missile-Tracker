description: >-
  Successful Army user trial of the 700 km-range Agni-I from Wheeler Island, off the Odisha coast.
  The single-stage solid-fuel surface-to-surface missile was fired from a mobile launcher from
  launch pad-4 of the ITR by the Strategic Forces Command.
notes: >-
  Date is cross-confirmed: subsequent 2014 reports repeatedly cite 'the last Agni-I trial was
  carried out by the SFC on 8 November 2013 from the same base', corroborating the 8 Nov 2013 user
  trial.
