id: 2020-10-09-rudram-1-christening-test
missile_id: rudram-1
variant: Rudram-1
designation: Rudram-1 (NGARM) flight test / official christening
date: "2020-10-09"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO successfully flight-tested its indigenous anti-radiation missile, officially named Rudram-1
  on this date. The missile was air-launched from an IAF Su-30MKI over the Integrated Test Range,
  Balasore, and struck a radiation-emitting target located on Wheeler Island (Dr A.P.J. Abdul Kalam
  Island) off the Odisha coast with pin-point accuracy, demonstrating India's first long-range
  air-launched anti-radiation / SEAD capability.
notes: >-
  Air-launched from Su-30MKI over the ITR Balasore range (itr-chandipur per air-launched-over-Odisha
  rule); the radiating target was on Wheeler Island / Dr A.P.J. Abdul Kalam Island. This is the
  maiden flight under the official 'Rudram-1' designation. The official PIB release stated
  capability of varying ranges based on launch conditions but gave no specific demonstrated-range
  figure; secondary sources characterize the system as ~100-250 km class (some cite 160 km). Date,
  site and outcome confirmed by PIB (via GlobalSecurity mirror), CSIS Missile Threat and multiple
  Indian outlets.
claims:
