description: >-
  Tenth flight-test of the Prithvi from a mobile launcher at 08:20 GMT, the fourth test from ITR
  Chandipur. Part of a 1993 series intended to verify minimum and maximum ranges of the missile.
notes: >-
  Confirmed: date, ITR Chandipur site, and successful outcome agree across NTI (citing All India
  Radio, 7 Feb 1993, and Jane's Defence Weekly, 13 Feb 1993), GlobalSecurity ('successfully test
  launched for the 10th time on 7 February 1993'), and GCAT (1993 Feb 7, CHAN).
