id: 2025-12-29-pinaka-mk2-lrgr120-maiden-flight
missile_id: pinaka-mk2
variant: Pinaka Long Range Guided Rocket (LRGR-120)
designation: Pinaka Long Range Guided Rocket (LRGR-120) maiden flight test
date: "2025-12-29"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 120
description: >-
  DRDO conducted the maiden flight test of the Pinaka Long Range Guided Rocket (LRGR-120) from the
  Integrated Test Range, Chandipur, Odisha. The rocket was tested to its maximum design range of 120
  km, executed all in-flight manoeuvres as planned, and impacted the designated target with
  precision. It was launched from an in-service Pinaka launcher, demonstrating the launcher's
  ability to fire Pinaka variants of different ranges.
notes: >-
  ADDED test - missing from the original list. New 120 km precision-guided variant of the Pinaka
  family. Verified via PIB (PRID 2209588), DD News/NewsOnAir (official) and The Week. Designed by
  ARDE with HEMRL, and support from DRDL and Research Centre Imarat. This is a longer-range guided
  variant distinct from the ~45 km Enhanced/ER Pinaka and the ~75 km Guided Pinaka, but is part of
  the same enhanced/guided Pinaka rocket program.
