description: >-
  In a winter trial in Rajasthan, the Nag thermal-sight system identified and locked on to a T-55
  tank target at a range of 5 km; the missile then engaged and destroyed the target at over 4 km.
notes: >-
  The Hindu (Y. Mallikarjun, 'Nag hits target in three seconds after launch'). 5 km cited as the
  seeker lock-on range against a T-55 target; engagement at over 4 km. Assessed at Pokhran/Rajasthan
  ranges. Single solid Indian-news source.
