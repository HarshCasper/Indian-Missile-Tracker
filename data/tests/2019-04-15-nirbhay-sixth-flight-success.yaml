id: 2019-04-15-nirbhay-sixth-flight-success
missile_id: nirbhay
variant: Nirbhay (ground-launched, developmental)
designation: Sixth developmental flight test
date: "2019-04-15"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  Sixth developmental flight trial from the ITR, Chandipur, intended to prove repeatability of the
  boost and cruise phases using waypoint navigation. Per DRDO/PIB the missile took off vertically,
  turned horizontal, separated its booster, deployed wings, started its engine and cruised through
  the intended waypoints in about 43 minutes, sustaining very low altitude (reported down to ~5 m)
  for roughly 10 minutes to demonstrate sea-skimming. Concluded the original developmental phase.
notes: >-
  PIB and most Indian outlets state the site as ITR Chandipur. Flight ~43 minutes; demonstrated
  range not separately stated (design range ~1,000 km).
