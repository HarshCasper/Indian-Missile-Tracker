description: >-
  Reported launch of an unarmed/dummy K-15 Sagarika from the nuclear-powered submarine INS Arihant
  during its sea trials phase off the eastern coast, validating integration of the SLBM with the
  SSBN launch system. CSIS notes unarmed test versions were launched by INS Arihant in 2015 (and
  2016).
notes: >-
  Launched from INS Arihant (SSBN) during sea trials in the Bay of Bengal; unarmed/dummy round,
  range not disclosed. DATE PRECISION downgraded to year: CSIS (foreign-news) only confirms the
  launch occurred in 2015, with no day given. The widely repeated specific date of 25 November 2015
  traces only to Wikipedia/Wikipedia-derived sources (further-reading), so it is not asserted here.
  CSIS also references a 2016 unarmed launch, but no distinct, reliably dated 2016 K-15 flight could
  be confirmed (likely conflation with this 2015 event); not listed separately. Confidence disputed
  because no day-level or non-further-reading corroboration exists.
