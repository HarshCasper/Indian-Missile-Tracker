description: >-
  Successful user trial by the Army's Strategic Forces Command from Launch Complex-4 of the ITR,
  Wheeler Island, fired at ~08:48 IST from a mobile launcher. ITR Director MVKV Prasad said all
  mission parameters were met. The two-stage, solid-propelled missile flew to its ~2,000 km range.
notes: >-
  SFC training exercise; DRDO logistic support. Date+site+outcome corroborated by
  GlobalSecurity/IRNA and Deccan Herald (Indian news).
