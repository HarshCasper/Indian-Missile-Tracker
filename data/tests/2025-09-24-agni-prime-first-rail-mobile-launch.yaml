id: 2025-09-24-agni-prime-first-rail-mobile-launch
missile_id: agni-prime
variant: Agni-P (rail-based mobile launcher)
designation: First rail-based mobile launcher test
date: "2025-09-24"
date_precision: day
outcome: success
confidence: confirmed
range_tested_km: 0
description: >-
  DRDO with the Strategic Forces Command carried out the first-of-its-kind launch of the
  intermediate-range Agni-Prime from a specially designed rail-based mobile launcher under a full
  operational scenario. The missile trajectory was tracked by various ground stations and it was a
  textbook launch meeting all mission objectives. The rail-mobile system can move on the railway
  network without preconditions, giving cross-country mobility, short reaction time and reduced
  visibility, placing India among a small group of nations with canisterised rail-launch capability.
notes: >-
  PIB release dated 25 September 2025 for the 24 September 2025 launch; some outlets reported the
  date as 25 September. PIB (via GlobalSecurity mirror) and Janes both give 24 September 2025.
  Launch site officially undisclosed (a railway location in India), so site_id left empty. Design
  range up to ~2,000 km; distance flown not disclosed.
