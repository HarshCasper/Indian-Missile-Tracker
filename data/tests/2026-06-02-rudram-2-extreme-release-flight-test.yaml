id: 2026-06-02-rudram-2-extreme-release-flight-test
missile_id: rudram-2
variant: RudraM-II
designation: RudraM-II flight test under extreme release conditions
date: "2026-06-02"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO and the IAF successfully flight-tested the RudraM-II air-to-surface missile from a Su-30MKI
  fighter on 2 June 2026 off the Odisha coast under 'extreme release conditions' along a critical
  flight trajectory, establishing the capability of all the missile's subsystems. The missile(s)
  after release were guided to a predefined target with pin-point accuracy and all test objectives
  were fully met; flight data was captured by ITR Chandipur range instrumentation.
notes: >-
  Air-launched from a Su-30MKI over the Odisha test range (site recorded as ITR Chandipur, which
  provided range instrumentation; release point off the Odisha coast over the Bay of Bengal).
  Swarajya reports 'at least three flight trials of the missile has been conducted with the one in
  May 2024 being the first full-configuration trial', placing this June 2026 event as a subsequent
  (second/third) trial. The ~300 km / Mach 5.5 / 200 kg figures are design capability values; no
  flown range was disclosed.
