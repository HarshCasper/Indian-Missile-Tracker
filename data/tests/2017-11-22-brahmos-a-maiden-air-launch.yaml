id: 2017-11-22-brahmos-a-maiden-air-launch
missile_id: brahmos-a
variant: BrahMos-A (baseline ~290 km)
designation: First air-launched BrahMos firing
date: "2017-11-22"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 290
description: >-
  Maiden flight test of the air-launched BrahMos (BrahMos-A) cruise missile, gravity-dropped from an
  IAF Su-30MKI and successfully striking a sea-based target in the Bay of Bengal. The IAF became the
  first air force in the world to fire an air-launched Mach 2.8 surface-attack missile of this
  category, completing India's tactical cruise-missile triad.
notes: >-
  Air-launched from a Su-30MKI over the Odisha/Bay of Bengal test range (counted under
  itr-chandipur); target was a sea/ship target. The ~2.5-tonne missile is the heaviest weapon
  carried by the Su-30MKI. The ~290 km figure is the missile's baseline range capability, not a
  measured distance for this shot. Crew names appearing in some compilations (Wg Cdr Prashant Nair /
  Wg Cdr K.P. Kiran Kumar) could not be verified against official sources and have been omitted.
