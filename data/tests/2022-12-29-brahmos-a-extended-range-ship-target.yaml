id: 2022-12-29-brahmos-a-extended-range-ship-target
missile_id: brahmos-a
variant: BrahMos-A Extended Range (ER, ~350-400 km)
designation: Extended Range air-launched firing vs ship target
date: "2022-12-29"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 400
description: >-
  The IAF successfully fired the Extended Range version of the air-launched BrahMos against a ship
  target from a Su-30MKI in the Bay of Bengal region, achieving the desired mission objectives. The
  test demonstrated long-range precision anti-ship strike capability from the Su-30MKI.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal off Odisha (counted under itr-chandipur).
  Confirmed by an official PIB / Ministry of Defence release (PRID 1887335) dated 29 Dec 2022; some
  foreign aggregators dated coverage 2-3 Jan 2023, but PIB, Business Today and The Shillong Times
  confirm 29 Dec 2022. Range ~350-400 km (ER capability). This test was MISSING from the original
  compiled list and has been added.
