id: 2018-09-20-prahaar-second-flight-test
missile_id: prahaar
designation: Prahaar second flight test (road-mobile launcher)
date: "2018-09-20"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 200
description: >-
  DRDO carried out the second flight test of the Prahaar tactical ballistic missile on 20 September
  2018 from Launch Complex-III / Launch Pad-3, ITR Chandipur (Balasore), Odisha, around 13:35 IST.
  The missile was fired from a road-mobile transporter-erector-launcher (TATRA TEL, capable of
  carrying six missiles and salvo firing), flew to its simulated target and met all mission
  objectives despite heavy rain; this was the first test in over seven years. Date, site, and
  successful outcome corroborated by PIB, The Week, India TV, Army Technology, and CSIS Missile
  Threat.
notes: >-
  Second documented flight test, ~7 years after the maiden launch. Launched from a road-mobile TATRA
  TEL. Reported range figures conflict between sources: 150 km (the system's stated strike range,
  cited by The Week / India TV / official descriptions) and 200 km (range reportedly flown in this
  test, per Army Technology / Sputnik). This is a figure-level dispute only; the date, site, and
  outcome are consistent. See claims for both values.
