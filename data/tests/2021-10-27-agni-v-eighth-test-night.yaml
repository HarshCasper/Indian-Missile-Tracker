id: 2021-10-27-agni-v-eighth-test-night
missile_id: agni-v
variant: canisterised (road-mobile)
designation: Eighth flight test (first night/dusk launch)
date: "2021-10-27"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 5000
description: >-
  A successful launch of the surface-to-surface ballistic missile Agni-5 was carried out at about
  19:50 IST from Dr A.P.J. Abdul Kalam Island, Odisha. The three-stage solid-fuelled missile is
  capable of striking targets at ranges up to 5,000 km; the test came amid border tensions with
  China and was widely reported as the first nighttime/dusk Agni-V launch.
notes: >-
  Launch Complex 4, Abdul Kalam Island. Eighth flight test, conducted around dusk (~19:50 IST);
  reported by some outlets as the first night test.
