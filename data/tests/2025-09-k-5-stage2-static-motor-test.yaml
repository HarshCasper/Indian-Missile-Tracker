id: 2025-09-k-5-stage2-static-motor-test
missile_id: k-5
designation: K-5 Stage-2 solid rocket motor static (ground) test
variant: K-5 Stage-2 motor
date: "2025"
date_precision: year
outcome: success
confidence: disputed
range_tested_km: 0
description: >-
  DRDO reportedly conducted a successful static (ground) test of the K-5 SLBM's Stage-2 solid rocket
  motor in 2025, validating burn time, thrust, ballistic performance, thermal endurance and
  structural integrity under simulated operational conditions, using over 250 instrumentation
  channels. This was an explicit non-flight motor qualification, not a launch.
notes: >-
  NOT a flight test - this is a ground static motor firing, included for completeness of the K-5
  developmental record. Conducted at DRDO's Advanced Centre for Energetic Materials (ACEM) /
  Armament & Combat Engineering Systems facility, Hyderabad (consistently 'Hyderabad' across the
  sources I verified; the earlier 'Nasik/Nashik' alternative could not be confirmed and was
  removed). Not one of the listed launch facilities, so site_id left empty. Confidence DISPUTED due
  to a date conflict: Indian Defense News states 12 September 2025, while NDA Study and Wikipedia
  (further-reading) place the test in November 2025 (12 Nov cited elsewhere); the November dates may
  reflect the reporting/publication wave. NOT officially confirmed by DRDO/MoD (no PIB/DRDO release
  found).
