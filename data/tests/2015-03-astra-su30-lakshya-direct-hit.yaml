description: >-
  Astra with onboard telemetry was air-launched from a Su-30MKI against a Lakshya pilotless target
  aircraft off the coast near ITR Chandipur in March 2015, achieving a direct hit. A 30 g turn rate
  was also demonstrated in the same month.
