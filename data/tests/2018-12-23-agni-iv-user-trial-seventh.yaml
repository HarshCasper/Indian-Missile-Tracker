id: 2018-12-23-agni-iv-user-trial-seventh
missile_id: agni-iv
designation: Strategic Forces Command user training launch (7th trial)
date: "2018-12-23"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 4000
description: >-
  The Strategic Forces Command of the Indian Army successfully test-fired the Agni-IV at about
  08:30-08:35 hrs from Launch Complex-4 of the Integrated Test Range at Dr A.P.J. Abdul Kalam Island
  as a user training exercise. It was the seventh trial of the missile, which has a 4,000 km strike
  capability; all mission objectives were met.
notes: >-
  Seventh trial of the Agni-IV. CSIS Missile Threat lists this as 'December 3, 2018', but Indian and
  wire reports (National Herald, GlobalSecurity/Sputnik, Daily Pioneer) consistently date it
  December 23, 2018; the December 23 date is treated as correct. Date conflict noted but resolved.
