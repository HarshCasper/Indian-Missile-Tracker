id: 2022-01-11-mpatgm-final-deliverable-configuration
missile_id: mpatgm
variant: final-deliverable-configuration
designation: MPATGM Final Deliverable Configuration Flight Test
date: "2022-01-11"
date_precision: day
outcome: success
confidence: confirmed
description: >-
  DRDO successfully flight-tested the MPATGM in its final deliverable configuration, fitted with a
  miniaturised imaging infrared seeker and advanced avionics, launched from a man-portable launcher
  with integrated thermal sight. The missile impacted and destroyed the designated target; all
  mission objectives were met.
notes: >-
  Launch site not specified in the PIB release; not one of the listed facilities. Validated the
  production-standard configuration; the system's max range is cited elsewhere as ~2.5 km.
  Re-verified against PIB (PRID 1789153, via GlobalSecurity mirror) and The Tribune.
