description: >-
  Successful user trial of the Agni-II from a mobile launcher at Wheeler Island, Odisha, conducted
  by the Strategic Forces Command. The missile struck a target ~2,000 km away, meeting all mission
  parameters. The missile was already inducted and under production at the time.
notes: >-
  Conducted by SFC as a user trial; DRDO logistic support. Date+site+outcome corroborated by Indian
  Defence Review, CSIS Missile Threat and GlobalSecurity.
