variant: Nag Mk 2
description: >-
  DRDO and the Indian Army successfully conducted field evaluation trials of the third-generation,
  fire-and-forget Nag Mk 2 ATGM at the Pokhran Field Firing Range, Rajasthan. In three field trials
  the missiles destroyed all targets precisely at both maximum and minimum range, validating the
  firing range. The trials also evaluated the upgraded NAMICA Version-2 carrier (modified
  BMP-2/Sarath), completing the weapon system's testing and clearing it for induction.
notes: >-
  Confirmed: PIB official release (PRID 2092585, dated 13 January 2025) and independently reported
  by All India Radio/NewsOnAir, Deccan Herald and Tribune India. Three trials, Pokhran, all targets
  hit, NAMICA Ver-2 evaluated. PIB content verified via search-engine reproduction and news mirrors
  (PIB blocks direct fetch).
