id: 2006-07-09-agni-iii-maiden-failure
missile_id: agni-iii
designation: Maiden flight test
date: "2006-07-09"
date_precision: day
outcome: failure
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  Maiden flight test of the Agni-III IRBM, launched from then-Wheeler Island off the Odisha coast.
  The missile rose to roughly 12 km before a malfunction; it failed to reach its target and fell
  into the Bay of Bengal. Post-flight analysis attributed the failure to a first-stage
  flexseal/thrust-vector-control fault and/or second-stage non-separation. India's defence ministry
  initially described the launch as successful before correcting it.
notes: >-
  Launched from then-Wheeler Island (now Dr A.P.J. Abdul Kalam Island), Odisha coast. Some accounts
  cite a heat-shield/thrust-vector-control sealing problem; others cite second-stage non-separation.
  Defence Minister Pranab Mukherjee called it a 'snag'.
