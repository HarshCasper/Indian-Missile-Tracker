description: >-
  A successful flight test of the Prithvi-II was conducted from a mobile launcher at Launch
  Complex-3, ITR Chandipur, as a user trial. The surface-to-surface missile has a 350 km strike
  range and can carry 500-1,000 kg warheads. The launch had been postponed from the previous day due
  to a technical snag.
notes: User trial. Date corroborated by MDAA and reference compilations.
