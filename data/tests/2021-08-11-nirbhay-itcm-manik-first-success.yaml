id: 2021-08-11-nirbhay-itcm-manik-first-success
missile_id: nirbhay
variant: ITCM (Indigenous Technology Cruise Missile, Manik engine)
designation: ITCM developmental trial (first flight with indigenous Manik engine)
date: "2021-08-11"
date_precision: day
outcome: success
confidence: disputed
site_id: itr-chandipur
range_tested_km: 150
description: >-
  Flight test of the ITCM (Nirbhay derivative) powered by the indigenous GTRE 'Manik' small turbofan
  engine, from ITR Chandipur off the Odisha coast. Reported as the first successful flight with the
  indigenous engine, covering about 150 km in roughly 15 minutes. Some analysis (The Defense Post)
  later characterised it as only partially successful, noting the missile again deviated from its
  intended path even though the engine performed, and that the full dive/horizontal flight profile
  was not validated.
notes: >-
  Date disputed: 11 August 2021 (Deccan Herald, EurasianTimes) vs 12 August 2021 (OdishaBytes,
  Adda247, OvertDefense). Launched from ITR Chandipur. Outcome disputed between 'success' (DRDO/most
  outlets) and 'partial' (The Defense Post retrospective). Engine: Manik STFE, ~400 kgf thrust class
  (GTRE, Bengaluru).
