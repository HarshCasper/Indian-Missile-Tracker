id: 2017-11-07-nirbhay-fifth-flight-success
missile_id: nirbhay
variant: Nirbhay (ground-launched, developmental)
designation: Fifth developmental flight test
date: "2017-11-07"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 647
description: >-
  Fifth developmental flight trial, fired from Launch Complex-3 of the ITR, Chandipur at about 10:30
  a.m. Per the PIB/DRDO account the missile flew for about 50 minutes to a range of 647 km,
  achieving all mission objectives from lift-off to final splash. First success after two
  consecutive failures (2015 and 2016).
notes: >-
  PIB-reported demonstrated range 647 km, ~50 minute flight. Launched from LC-3, ITR Chandipur. Some
  foreign coverage (The Diplomat) loosely described the site as 'Abdul Kalam Island' but the
  underlying PIB/ANI account places the launch at LC-3, ITR Chandipur.
