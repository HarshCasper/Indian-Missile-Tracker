id: 2012-09-19-agni-iv-full-range-dev-trial
missile_id: agni-iv
designation: Second successful flight test (developmental)
date: "2012-09-19"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 4000
description: >-
  Second consecutive successful developmental flight from Wheeler Island, launched from a
  road-mobile launcher at about 11:48 a.m. The missile reached an altitude of over 800 km and
  impacted near its pre-defined target in the Indian Ocean after about a 20-minute flight,
  reportedly with sub-100 m accuracy, demonstrating the system's full 4,000 km range.
notes: >-
  Range reporting differs between sources (4,000 km in most Indian/CSIS accounts; ~3,500 km in some
  wire reports). Date, site and success independently re-verified.
