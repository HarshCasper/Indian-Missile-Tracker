description: >-
  Successful practice trial of the 700 km-range Agni-I conducted by the Army's Strategic Forces
  Command. The surface-to-surface missile was fired from a mobile launcher from launch pad-4 of the
  ITR at Wheeler Island, about 100 km from Balasore. ITR Director M.V.K.V. Prasad confirmed the test
  was successful.
notes: >-
  Wheeler Island = ITR facility, later renamed Abdul Kalam Island. Single solid foreign-news source
  (IRNA) independently seen.
