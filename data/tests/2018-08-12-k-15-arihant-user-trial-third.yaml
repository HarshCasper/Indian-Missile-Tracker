description: >-
  Third of three K-15 (B-05) SLBM user-trial launches from INS Arihant in August 2018, fired on 12
  August off the Visakhapatnam coast with the submarine submerged about 20 m deep. The missile
  followed its pre-designated trajectory and impacted the target area with high accuracy, completing
  the first-phase user trials that operationalised the K-15 on India's SSBN.
notes: >-
  Third launch of the three-launch August 2018 user-trial series (two on 11 Aug, one on 12 Aug).
  Fired from INS Arihant, submerged ~20 m, ~10 km off Vizag. Range not publicly disclosed. Date,
  site and outcome corroborated across multiple independent sources (PTI-relayed reporting, Modern
  Diplomacy, CSIS), hence confidence 'confirmed'.
