site_id: pokhran-range
range_tested_km: 75
description: >-
  DRDO, with the Indian Army, conducted performance-evaluation trials of industry-produced Pinaka
  Extended Range (Pinaka-ER) rockets at the Pokhran firing ranges in Rajasthan over three days,
  announced 24 August 2022. 24 rockets were fired for different ranges and warhead capabilities; all
  trial objectives were met, completing the initial phase of technology absorption and clearing the
  industry partner for series production. The guided extended-range ammunition is reported capable
  of ~75 km.
notes: >-
  Reported as 24 August 2022. CORRECTION: upgraded from 'reported' to 'confirmed' - date, site and
  outcome agree across three independent Indian outlets (Republic World, India.com, DNA India).
  Rockets produced by a private-sector partner. The ~75 km range figure (with ~40 m accuracy) is per
  these secondary sources.
