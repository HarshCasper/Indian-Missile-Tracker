id: 2019-11-16-agni-ii-first-night-trial
missile_id: agni-ii
variant: Agni-II
designation: First successful night trial (SFC)
date: "2019-11-16"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 2000
description: >-
  Strategic Forces Command night trial of the nuclear-capable Agni-II, fired at ~19:30 IST from the
  Integrated Test Range on Dr A.P.J. Abdul Kalam Island, off the Odisha coast. The ~2,000 km-range
  missile hit the target with accuracy on the planned trajectory; tracked by radars, telemetry
  stations, electro-optic instruments and two naval ships near the impact point. Widely reported as
  the first night trial of the Agni-II.
notes: >-
  Conducted by the Army's SFC with DRDO logistic support. Reported by Indian press (Business
  Standard/PTI, ETV Bharat, KSG) as the 'first night trial' of the Agni-II and by GlobalSecurity as
  the 'first night launch' of the system; this 'first' conflicts with the 2009-11-23 night attempt
  and 2010 'post-sunset' claims (the 2009 attempt failed and 2019 is the first SUCCESSFUL night
  trial). Date+site+outcome agree across multiple independent sources.
