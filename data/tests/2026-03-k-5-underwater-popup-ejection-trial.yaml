id: 2026-03-k-5-underwater-popup-ejection-trial
missile_id: k-5
designation: K-5 underwater pop-up / cold-launch ejection trial
date: 2026-03
date_precision: month
outcome: partial
confidence: disputed
site_id: offshore-visakhapatnam
range_tested_km: 0
description: >-
  India reportedly conducted a successful underwater 'pop-up' (cold-launch) ejection trial of the
  K-5 SLBM in the Bay of Bengal off Visakhapatnam, attributed to the final week of March 2026. The
  trial ejected an unpowered dummy missile from a submerged vertical launch tube using a
  high-pressure gas generator and validated the canister/gas-ejection mechanism, hydrodynamic
  stability and surface breach; the rocket motors were NOT ignited, so this was an ejection-only
  event ahead of full powered developmental flight trials. First reported publicly by India Today
  defence journalist Sandeep Unnithan and amplified by multiple Indian defence outlets in May 2026;
  corroborated independently by open-source analysts noting a Bay of Bengal firing notification
  (NOTAM) for roughly 30-31 March 2026.
notes: >-
  Ejection-only test (booster not fired); recorded as 'partial' because it was not a powered flight.
  NOT officially confirmed by DRDO or MoD as of June 2026; no PIB/DRDO release exists and the K-5
  does not appear in CSIS Missile Threat. Confidence DISPUTED due to a date conflict: the dominant
  account (chakranewz, idrw, indiandefensenews, indianmasterminds, defence.in, citing Sandeep
  Unnithan/India Today) places the test in the final week of March 2026, while thedefensenews.com
  states the test occurred on 20 May 2026 (likely conflating the May reporting wave with the event).
  Launch platform: sources I could verify describe a submerged underwater test platform/pontoon off
  Visakhapatnam and do NOT name a submarine; I could not verify the previously asserted INS
  Aridhaman/INS Arighaat attribution, so it has been dropped. Exact day not officially published.
