id: 2012-10-05-dhanush-user-trial
missile_id: dhanush
variant: Prithvi-III (naval)
designation: User training trial
date: "2012-10-05"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 350
description: >-
  The Dhanush was successfully test-fired from the warship INS Suvarna, anchored about 70 km off
  Puri in the Bay of Bengal off the Odisha coast, by the Strategic Forces Command as part of a
  regular user-training exercise. The flight followed a textbook trajectory and the missile, capable
  of striking targets at 250-350 km with a 500 kg payload, met all parameters.
notes: >-
  Ship-launched from INS Suvarna, ~70 km off Puri/Odisha coast in the Bay of Bengal; site_id
  offshore-visakhapatnam used as the Bay-of-Bengal ship-launch proxy. Date, vessel (INS Suvarna),
  location, success, and 350 km range corroborated across CSIS and multiple Indian/foreign outlets.
  An official PIB release titled '350 Km Range Surface-to-Surface Ballistic Missile Dhanush
  Successfully Launched' (pib.gov.in PrintRelease relid=88208) appears to correspond to this test
  but the page returned HTTP 403 and its exact date could not be directly re-verified, so it is not
  added as a citation.
