id: 2025-07-16-akash-prime-ladakh-high-altitude
missile_id: akash-prime
variant: Akash Prime (production-model)
designation: High-Altitude User Trial (Ladakh) / First-of-Production-Model firing
date: "2025-07-16"
date_precision: day
outcome: success
confidence: confirmed
range_tested_km: 0
description: >-
  Indian Army Air Defence and DRDO, with Bharat Dynamics Ltd and Bharat Electronics Ltd, conducted a
  high-altitude user trial of the production-model Akash Prime in eastern Ladakh, customised to
  operate above 4,500 m. It scored direct hits, destroying two high-speed unmanned aerial targets in
  the rarefied high-altitude atmosphere.
notes: >-
  Conducted in the Ladakh sector at an altitude exceeding 15,000 feet (~4,600 m); not from one of
  the listed Odisha/AP coastal facilities, so site_id left empty (real site: high-altitude range,
  eastern Ladakh). Official PIB/MoD milestone date is 16 July 2025 (announced 17 July) and is
  corroborated by DD News, Janes, and Deccan Herald. NOTE: The compiled list previously asserted a
  two-day campaign on 15-16 July citing Deccan Herald, but the cited Deccan Herald and DD News
  articles, the PIB release, and Janes all give a single trial date of 16 July 2025 with two targets
  destroyed; the two-day-campaign claim could not be substantiated and was removed. Classified by
  DRDO as the First-of-Production-Model firing, the final step before bulk delivery; follows
  Operation Sindoor and precedes planned Army induction. Stated operational/engagement range
  commonly cited as 25-30 km is a general system-capability figure from secondary reporting, not
  declared as the demonstrated range for this trial, hence range_tested_km left as 0.
