id: 2026-01-11-mpatgm-kk-ranges-top-attack-moving-target
missile_id: mpatgm
variant: weapon-system
designation: MPATGM Top-Attack Flight Test Against a Moving Target
date: "2026-01-11"
date_precision: day
outcome: success
confidence: confirmed
description: >-
  DRDO successfully flight-tested the third-generation fire-and-forget MPATGM with top-attack
  capability against a moving target. The missile, employing its imaging infrared (IIR) homing
  seeker, engaged and destroyed a thermal target system simulating a moving tank, demonstrating
  day/night engagement of armoured vehicles. Conducted by DRDO's Defence Research & Development
  Laboratory (DRDL), Hyderabad.
notes: >-
  Launch site: Army's KK Ranges, Ahilya Nagar (Ahmednagar), Maharashtra (not one of the listed
  facilities). PIB release PRID 2213690 dated 12 January 2026; test conducted 11 January 2026.
  Target was a Thermal Target System representing a moving tank. Bharat Dynamics Ltd and Bharat
  Electronics Ltd are the development-cum-production partners. Newly added test verified against PIB
  (via GlobalSecurity mirror) and Indian Masterminds.
