description: >-
  India conducted a successful night test-fire of the nuclear-capable Prithvi-II from a mobile
  launcher at Launch Complex-3, ITR Chandipur, as a user trial by the Army. A randomly selected
  missile was fired in darkness and tracked to impact in the Bay of Bengal, meeting all parameters.
notes: >-
  ADDED test, previously missing. Night trial. Corroborated by Business Standard (PTI) and CSIS
  Missile Threat.
