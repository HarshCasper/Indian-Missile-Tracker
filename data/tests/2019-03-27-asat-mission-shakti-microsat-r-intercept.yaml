id: 2019-03-27-asat-mission-shakti-microsat-r-intercept
missile_id: asat-mission-shakti
variant: PDV Mk-II
designation: Mission Shakti (Project XSV-1)
date: "2019-03-27"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
apogee_km: 283
range_tested_km: 283
description: >-
  India's first successful direct-ascent ASAT intercept. A three-stage Prithvi Defence Vehicle
  Mark-II (PDV Mk-II) kinetic kill vehicle, launched from Dr A.P.J. Abdul Kalam Island, destroyed
  India's own Microsat-R satellite in low Earth orbit about 168 seconds after launch. The
  hit-to-kill intercept made India the fourth nation (after the US, Russia and China) to demonstrate
  an ASAT weapon. The test was announced by Prime Minister Narendra Modi and codenamed Mission
  Shakti.
notes: >-
  Confirmed across MEA/Government of India FAQ (official), CSIS Missile Threat, the SWF fact sheet,
  and PTI-sourced Indian reporting. Launch around 11:16 IST (~05:40 UTC). Official intercept
  altitude given as ~283 km (MEA FAQ / Indian reporting); CSIS and SWF round to 'about 300 km'.
  Microsat-R (~740-750 kg) was launched by ISRO on 24 January 2019 into a deliberately low orbit.
  Debris estimates conflict: SWF/Space-Track catalog 130 trackable pieces (some thrown above 1000
  km; took over three years to fully de-orbit), while US defense officials initially tracked 250+
  pieces (CSIS). Flight time ~168 seconds per Indian/PTI reporting.
