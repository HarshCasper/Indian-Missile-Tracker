id: 1991-02-11-prithvi-i-flight-3
missile_id: prithvi-i
variant: Prithvi-I (SS-150)
designation: Flight 3
date: "1991-02-11"
date_precision: day
outcome: success
confidence: reported
site_id: sriharikota-shar
description: >-
  Third flight-test of the Prithvi-I from SHAR Sriharikota at 12:15 p.m.; per Indian
  defence-ministry sources the flight met 'all mission requirements.' The defective inertial
  guidance system from the second test was replaced with a high-performance gyro that performed
  'moderately well.'
notes: Date and site agree between NTI (citing Xinhua, 12 Feb 1991) and GCAT (1991 Feb 11, SHAR).
