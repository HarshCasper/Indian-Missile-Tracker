id: 2022-05-12-brahmos-er-su30mki-first-air
missile_id: brahmos-er
variant: air-launched (BrahMos-A ER)
designation: First Extended-Range BrahMos air launch from Su-30MKI
date: "2022-05-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
description: >-
  First-ever launch of the extended-range version of the BrahMos air-launched missile from a
  Su-30MKI fighter, achieving a direct hit on the designated target in the Bay of Bengal region.
  Demonstrated IAF capability to strike land/sea targets at extended ranges from the air.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal / Odisha test range; mapped to itr-chandipur
  per instructions with the air-launch noted. Official PIB release PRID 1824795. Verified via the
  archived PIB release and Deccan Herald.
