id: 2019-02-12-asat-mission-shakti-failed-first-attempt
missile_id: asat-mission-shakti
variant: PDV Mk-II
designation: Mission Shakti (failed first attempt)
date: "2019-02-12"
date_precision: day
outcome: failure
confidence: disputed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  India's first (failed) attempt to test its PDV Mk-II direct-ascent ASAT against the Microsat-R
  satellite. The solid-fueled interceptor reportedly failed about 30 seconds into flight, achieving
  only a suborbital trajectory with no intercept. India publicly announced only a generic
  experimental flight-vehicle / missile test; the ASAT nature was inferred later when observers
  matched the trajectory and target satellite to the successful 27 March test.
notes: >-
  Disputed. Independently catalogued as a failed ASAT attempt by the Secure World Foundation fact
  sheet (June 2025), US government sources via Ankit Panda/The Diplomat (30 Mar 2019), and orbital
  analyst Marco Langbroek (SatTrackCam Leiden). Booster failed within ~30 seconds; SWF lists 0
  trackable debris and 'suborbital'. Langbroek infers the ASAT intent from a NOTAM hazard zone
  matching the 27 March test and a Microsat-R pass over Abdul Kalam ~1 minute earlier than on 27
  March, with a calculated intercept altitude of ~271 km. DRDO publicly disputed any ASAT test on
  this date, later characterizing 12 February as a test 'against an electronic target' rather than a
  live-satellite intercept. Launch announced for ~11:10 IST (05:40 UTC) from Dr A.P.J. Abdul Kalam
  Island, Odisha.
claims:
  - field: outcome
    text: >-
      DRDO disputed that any ASAT test occurred on 12 February 2019 ('There was no ASAT test on
      February 12'); it was later characterized as a test against an 'electronic target' rather than
      a failed live-satellite intercept.
