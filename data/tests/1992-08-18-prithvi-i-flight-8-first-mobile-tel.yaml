description: >-
  Eighth flight-test of the Prithvi-I, the second from ITR Chandipur and the first from a mobile
  eight-wheeled transporter-erector launcher (TEL) built by BEML. The test evaluated the missile's
  manoeuvring abilities after design changes to correct earlier problems.
notes: Date and site agree between NTI (citing Times of India, 19 Aug 1992) and GCAT (1992 Aug 18, CHAN).
