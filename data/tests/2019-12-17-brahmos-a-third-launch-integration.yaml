id: 2019-12-17-brahmos-a-third-launch-integration
missile_id: brahmos-a
variant: BrahMos-A (baseline ~290 km, user configuration)
designation: Third live launch; integration completed
date: "2019-12-17"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 300
description: >-
  Third live launch of the air-launched BrahMos from a Su-30MKI, against a sea/surface target off
  the Odisha coast, in user configuration. The missile followed the desired trajectory and achieved
  a direct hit; the MoD stated the test completed integration of BrahMos-A on the Su-30MKI. The
  Indian Navy supported the launch.
notes: >-
  Air-launched from a Su-30MKI over the Bay of Bengal off Odisha (counted under itr-chandipur). Per
  India's PIB (release dated 18 Dec 2019), the launch hit a surface target off the Odisha coastline
  with Indian Navy support. The same day India also fired a separate land-based (surface-to-surface)
  BrahMos from a mobile launcher, which is NOT counted here as it was not air-launched. Range ~300
  km is missile capability, not a measured distance.
