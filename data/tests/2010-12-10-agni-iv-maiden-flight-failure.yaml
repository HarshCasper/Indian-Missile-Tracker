description: >-
  The maiden flight test of the missile (then publicly referred to as Agni-II Prime / Agni-II+)
  failed seconds after lift-off from Wheeler Island, deviating from its trajectory and plunging into
  the Bay of Bengal due to a first-stage control-system malfunction. DRDO later reworked the design
  and re-flew it as the Agni-IV.
notes: >-
  Missile was designated Agni-II Prime/Agni-II+ at the time; the Agni-IV name was applied to the
  upgraded variant from 2011. Some catalogues count this as the first Agni-IV test; others begin
  Agni-IV trial numbering with the November 2011 success. Independently re-verified: failure on
  2010-12-10 from Wheeler Island confirmed by Defense Update and CSIS Missile Threat.
