id: 2022-06-06-agni-iv-training-launch
missile_id: agni-iv
designation: Routine user training launch (Strategic Forces Command)
date: "2022-06-06"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 4000
description: >-
  A successful training launch of the Agni-4 IRBM was carried out at approximately 1930 hours on
  June 06, 2022 from APJ Abdul Kalam Island, Odisha. The successful test, part of routine user
  training launches under the aegis of the Strategic Forces Command, validated all operational
  parameters and the reliability of the system. The Agni-4 has a range of around 4,000 km.
notes: >-
  Confirmed by an official PIB/MoD press release (PRID=1831654). Date, site and success
  independently re-verified.
