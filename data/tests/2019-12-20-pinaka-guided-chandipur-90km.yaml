id: 2019-12-20-pinaka-guided-chandipur-90km
missile_id: pinaka-guided
variant: Guided Pinaka Mk-II (extended range)
designation: Guided Pinaka extended-range flight test (90 km, Day 2)
date: "2019-12-20"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 90
description: >-
  On 20 December 2019, DRDO successfully test-fired the extended-range version of the guided Pinaka
  from ITR Chandipur, off the Odisha coast, with the rocket hitting targets at 90 km. This was the
  second consecutive day of guided Pinaka firings; the system uses an advanced navigation and
  control guidance kit and met all mission objectives.
notes: >-
  Confirmed by ANI/Business Standard ('extended range version hit targets at 90 kms', 20 Dec) and
  GlobalSecurity/Sputnik (separate guided Pinaka firing off the Odisha coast on 20 Dec, described as
  the third firing within 24 hours). Two rockets reportedly fired this day.
