designation: Flight 7
date: "1992-05-05"
date_precision: day
outcome: success
confidence: reported
site_id: itr-chandipur
description: >-
  Seventh flight-test of a modified Prithvi-I and the first Prithvi launch from the Interim Test
  Range (ITR), Chandipur (Orissa). Fired from a mobile launcher with a launch control centre,
  testing propulsion and control-system modifications and validating HAL-produced liquid-propulsion
  and inertial-navigation hardware.
notes: >-
  Date and site agree between NTI (citing Jane's Defence Weekly, 23 May 1992) and GCAT (1992 May 5,
  CHAN).
