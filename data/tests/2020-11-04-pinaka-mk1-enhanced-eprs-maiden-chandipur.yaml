id: 2020-11-04-pinaka-mk1-enhanced-eprs-maiden-chandipur
missile_id: pinaka-mk1
variant: Pinaka Mk-I (Enhanced) / EPRS
designation: Enhanced Pinaka maiden flight test
date: "2020-11-04"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
description: >-
  DRDO successfully flight-tested the Enhanced Pinaka rocket (Pinaka Mk-I Enhanced) from the
  Integrated Test Range, Chandipur, Odisha. Six rockets were launched in quick succession and met
  complete mission objectives. The enhanced design was developed by ARDE and HEMRL (Pune) to achieve
  longer range with reduced rocket length; test articles were manufactured by Economic Explosives
  Ltd, Nagpur, under ToT.
notes: >-
  Confirmed by official PIB release PRID 1670104 and DRDO press release, plus GlobalSecurity PIB
  archive. The official statement does NOT cite a specific range; the ~45 km figure comes only from
  secondary/further-reading sources and is recorded as a claim, not as range_tested_km.
