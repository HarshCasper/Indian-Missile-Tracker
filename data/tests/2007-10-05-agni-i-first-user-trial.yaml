id: 2007-10-05-agni-i-first-user-trial
missile_id: agni-i
variant: Agni-I
date: "2007-10-05"
date_precision: day
outcome: success
confidence: reported
site_id: abdul-kalam-island
designation: First Indian Army user/training trial
range_tested_km: 700
description: >-
  First user (training) trial of the nuclear-capable Agni-I conducted by the Indian Army, marking
  the missile's entry into operational service with the Strategic Forces Command. The 700 km-range
  solid-fuel SRBM was fired from a mobile launcher. Reported as the fourth Agni-I launch overall.
notes: >-
  Launch-site conflict: most secondary references place it at Wheeler Island (ITR, later Abdul Kalam
  Island, Bhadrak, Odisha); RIA Novosti reports it at Chandipur, Odisha. The original list's CSIS
  citation (india-conducts-successful-agni-1-flight-test) was a wrong URL that actually describes
  the October 2018 test; it has been replaced with the RIA Novosti contemporaneous report.
