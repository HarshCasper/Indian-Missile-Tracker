id: 2014-03-24-k-4-maiden-flight
missile_id: k-4
variant: K-4
date: "2014-03-24"
date_precision: day
outcome: success
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 3000
description: >-
  Maiden developmental flight test of the K-4 SLBM, conducted secretly from a submerged pontoon
  roughly 30 metres deep in the Bay of Bengal off the Visakhapatnam coast. A gas generator ejected
  the missile, which breached the surface, turned toward its target and flew about 3,000 km. DRDO
  publicly acknowledged the test only in January 2015 at Aero India.
notes: >-
  First developmental flight test. Launched from a submerged pontoon (not a submarine); recorded
  under offshore-visakhapatnam. Range reported ~3,000 km in this test versus the missile's full
  design range of ~3,500 km. Date (24 March 2014) and ~3,000 km range corroborated by Arms Control
  Association and GlobalSecurity.
