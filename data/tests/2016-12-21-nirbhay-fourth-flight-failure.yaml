site_id: itr-chandipur
range_tested_km: 0
description: >-
  Fourth flight test from the ITR off the Odisha coast (Balasore/Chandipur). The missile veered
  dangerously to one side within roughly two minutes of lift-off and had to be destroyed in mid-air.
  Reported causes include loss of engine thrust, failure of the flight-control software, and a
  wing-deployment problem.
notes: >-
  Launched from ITR Chandipur/Balasore, Odisha. CSIS Missile Threat headlines it as the fourth
  test-launch failure.
