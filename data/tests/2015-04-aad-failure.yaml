id: 2015-04-aad-failure
missile_id: aad
variant: Ashwin
designation: AAD interceptor trial (failed)
date: 2015-04
date_precision: month
outcome: failure
confidence: reported
site_id: abdul-kalam-island
description: >-
  An AAD interceptor test failed at Abdul Kalam Island; the missile plunged into the Bay of Bengal a
  few seconds after lift-off due to an in-flight subsystem malfunction and did not engage the
  target. The failure was not publicized at the time and was referenced retrospectively by The
  Diplomat.
notes: >-
  Sources place the failure in April 2015 but do not corroborate an exact day; the previously
  asserted '6 April 2015' date is not supported, so date_precision is set to month. Reported by The
  Diplomat both in its 23 Nov 2015 coverage (referencing 'a similar test that failed in April') and
  its May 2016 investigation.
