id: 2000-04-11-dhanush-maiden-failure
missile_id: dhanush
variant: Prithvi-III (naval)
designation: Maiden flight test
date: "2000-04-11"
date_precision: day
outcome: failure
confidence: confirmed
site_id: offshore-visakhapatnam
range_tested_km: 0
description: >-
  The first flight test of the ship-launched Dhanush (naval Prithvi variant) from the offshore
  patrol vessel INS Subhadra in the Bay of Bengal off the Odisha (then Orissa) coast. The missile
  failed at or shortly after take-off, flying only a few seconds before breaking into two pieces and
  barely clearing the ship; it was characterized as a technology-demonstrator failure caused by
  take-off/blast-off stage problems.
notes: >-
  Ship-launched from INS Subhadra (Sukanya-class OPV), off the Odisha coast in the Bay of Bengal;
  site_id offshore-visakhapatnam used as the Bay-of-Bengal ship-launch proxy. Outcome predominantly
  reported as a failure (FAS, CSIS); the Wisconsin Project's 2000 update alternatively quoted
  India's scientific adviser calling it a 'partial success' that crashed into the sea 25-30 km from
  the launch vessel - see disputed claim. Astronautix (currently unreachable) describes the failure
  occurring after about 30 seconds of flight.
