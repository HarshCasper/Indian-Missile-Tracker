id: 2017-05-04-agni-ii-user-trial-disputed
missile_id: agni-ii
variant: Agni-II
designation: SFC user trial (outcome disputed)
date: "2017-05-04"
date_precision: day
outcome: failure
confidence: disputed
site_id: abdul-kalam-island
range_tested_km: 2000
description: >-
  Strategic Forces Command user trial of the Agni-II fired at ~10:23 IST from Dr A.P.J. Abdul Kalam
  Island, intended to re-establish the operational effectiveness of the system. Indian defence
  sources and some outlets reported it as successful (full range, accurate splashdown), but the
  outcome is disputed: a Times of India source and subsequent open-source satellite-imagery analysis
  concluded the missile was aborted in early boost phase (~550 m from the pad) and broke up in
  midair. DRDO never officially confirmed success.
notes: >-
  Outcome DISPUTED. Reported success: Deccan Chronicle and Sputnik/GlobalSecurity. Assessed failure:
  Times of India report plus satellite-imagery analysis by Arms Control Wonk (Grace Liu et al.) and
  CSIS Missile Threat, which found smoke plumes, debris and burn scars consistent with an
  intentional abort/breakup during boost phase. DRDO declined to comment. Confidence set to
  disputed; both positions recorded in claims.
