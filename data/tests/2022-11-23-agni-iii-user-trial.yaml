description: >-
  Successful training launch of the Agni-III intermediate-range ballistic missile from APJ Abdul
  Kalam Island, Odisha, carried out under the aegis of the Strategic Forces Command as part of
  routine user training launches. The launch was for a predetermined range and validated all
  operational parameters of the system.
