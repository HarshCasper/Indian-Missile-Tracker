id: 2008-11-12-shaurya-maiden
missile_id: shaurya
designation: Maiden flight test
variant: Shaurya (baseline)
date: "2008-11-12"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 300
description: >-
  Maiden flight test of the canister-launched, two-stage surface-to-surface ballistic missile. The
  missile was ejected from an underground in-built canister at Complex-3 of the Integrated Test
  Range, Chandipur (off Balasore, Odisha), took off vertically, reached about Mach 5 with a surface
  temperature near 700 C, and was tracked along its trajectory to the Bay of Bengal. Reported design
  range was 600-700 km; about 300 km was flown in this test, with a flight duration of about 485
  seconds.
notes: >-
  Launched ~11:25 am from a canister in a 30-40 ft deep pit at ITR Chandipur/Balasore. Some
  contemporaneous reports loosely called it a land version of the K-15/Sagarika SLBM; DRDO sources
  stated the Shaurya operates independently of the K-15/Sagarika program. Distinct from the
  underwater K-15/K-4 (Sagarika) tests that CSIS files under 'Sagarika/Shaurya'. Date, site and
  success corroborated by RIA Novosti/GlobalSecurity, domain-b and Livefist.
