description: >-
  VL-SRSAM successfully flight-tested from a land-based vertical launcher at ITR Chandipur on 26
  March 2025 against a high-speed aerial target at very close range and low altitude. The target was
  completely destroyed, demonstrating the missile's agility, high turn rates and pin-point accuracy.
