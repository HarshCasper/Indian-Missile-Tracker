description: >-
  The Strategic Forces Command successfully test-fired the Agni-IV medium-range ballistic missile
  from the Integrated Test Range at Chandipur, Odisha. According to the Ministry of Defence, the
  launch validated all operational and technical parameters.
notes: >-
  The official release identifies ITR Chandipur as the launch location and does not disclose the
  distance flown, apogee, impact point or firing azimuth. The zero range value preserves that
  distinction; the interface draws an explicitly indicative arc using the missile's catalogued
  4,000 km maximum range.
