description: >-
  India successfully test-fired the nuclear-capable Prithvi-II from a road-mobile launcher at ITR
  Chandipur at about 9:15 a.m. The user trial by the Strategic Forces Command saw the missile splash
  down near its designated target in the Bay of Bengal about seven minutes after launch.
notes: ADDED test, previously missing. Sputnik report archived by GlobalSecurity.
