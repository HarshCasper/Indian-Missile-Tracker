id: 2024-05-29-rudram-2-maiden-flight-test
missile_id: rudram-2
variant: RudraM-II
designation: RudraM-II first full-configuration flight test
date: "2024-05-29"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 0
description: >-
  First full-configuration flight test of the RudraM-II (Rudram-2) air-to-surface anti-radiation
  missile, air-launched from an IAF Su-30 MK-I at around 1130 hours on 29 May 2024 off the Odisha
  coast over the Bay of Bengal. The test met all trial objectives, validating the solid-propulsion
  system and the control & guidance algorithm; flight data was captured by ITR Chandipur
  electro-optical, radar and telemetry stations including an on-board ship.
notes: >-
  Air-launched from a Su-30 MK-I over the Odisha test range (site recorded as ITR Chandipur, which
  provided range instrumentation; release point was off the Odisha coast over the Bay of Bengal).
  Widely described as the first full-configuration flight trial of RudraM-II (Swarajya: 'the one in
  May 2024 being the first full-configuration trial'). Note: some secondary coverage derived from
  Wikipedia refers to a 2022 release trial and a July 2023 anti-radiation test, but these are not
  independently documented as discrete, reliably-sourced flight tests and are treated here as
  development milestones, not separate events. Stated 300-350 km / Mach 5.5 / ~200 kg figures are
  design/capability values, not a demonstrated flown range in this test.
