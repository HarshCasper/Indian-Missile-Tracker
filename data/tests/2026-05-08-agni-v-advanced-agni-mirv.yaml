id: 2026-05-08-agni-v-advanced-agni-mirv
missile_id: agni-v
variant: canisterised (road-mobile); MIRV-equipped (Advanced Agni)
designation: Advanced Agni MIRV flight-trial (second MIRV test)
date: "2026-05-08"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
description: >-
  India conducted a successful flight-trial of an Advanced Agni missile with Multiple Independently
  Targetable Re-entry Vehicle (MIRV) system from Dr A.P.J. Abdul Kalam Island, Odisha. The missile
  was flight-tested with multiple payloads targeted to different impact points spatially distributed
  over a large area of the Indian Ocean Region, tracked by ground and ship-based stations. The
  Ministry of Defence stated all mission objectives were met. It was the second publicly
  acknowledged MIRV test after Mission Divyastra (2024).
notes: >-
  Launch Complex-IV, Abdul Kalam Island. PIB Release ID 2259380, dated 8 May 2026. Designation
  ambiguity: the official PIB release and Janes call it an 'Advanced Agni' missile (not explicitly
  Agni-5/Agni-V); Janes notes it 'closely resembles the Agni V missile currently in service.'
  Included under agni-v as the second Agni-V-family MIRV test, but the exact variant designation was
  deliberately not specified by the MoD. Number of re-entry vehicles not disclosed.
