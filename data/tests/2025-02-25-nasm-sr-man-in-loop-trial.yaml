id: 2025-02-25-nasm-sr-man-in-loop-trial
missile_id: nasm-sr
designation: Man-in-Loop / datalink flight trial
date: "2025-02-25"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 55
description: >-
  DRDO and the Indian Navy conducted a flight trial of the NASM-SR from an Indian Navy Sea King
  Mk.42B helicopter at the Integrated Test Range, Chandipur, scoring a direct hit on a small ship
  target in sea-skimming mode at maximum range. The trial proved the missile's Man-in-Loop feature
  with a high-bandwidth two-way datalink transmitting live IIR seeker imagery to the pilot for
  in-flight retargeting; launched in Bearing-Only Lock-on-After-Launch mode, it initially locked a
  large target then was redirected by the pilot onto a smaller concealed target.
notes: >-
  Air-launched from an Indian Navy Sea King Mk.42B helicopter. The trial was conducted on 25
  February 2025 (per ANI and Janes, which both state 25 Feb as the conduct date); the PIB release
  and some secondary coverage carry a 26 February 2025 date (the announcement/release date), and
  Wikipedia lists 26 Feb. The hit was at 'maximum range' (~55 km) per official wording, confirmed by
  Janes. Date/site/outcome agree across PIB, ANI, Janes and Naval Today.
