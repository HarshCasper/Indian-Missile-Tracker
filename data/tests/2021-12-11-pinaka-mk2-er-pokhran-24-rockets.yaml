id: 2021-12-11-pinaka-mk2-er-pokhran-24-rockets
missile_id: pinaka-mk2
variant: Pinaka-ER (Extended/Enhanced Range)
designation: Pinaka Extended Range, Area Denial Munitions & indigenous fuzes trials
date: "2021-12-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
range_tested_km: 45
description: >-
  DRDO and the Indian Army conducted performance-evaluation trials of industry-produced Pinaka
  Extended Range (Pinaka-ER) rockets at the Pokhran field firing ranges, announced 11 December 2021.
  A total of 24 rockets were fired at different ranges with various warhead capabilities; Area
  Denial Munitions (ADM) and indigenously developed fuzes were also tested. All trial objectives
  were met, completing the initial phase of technology absorption by the industry partner.
notes: >-
  Announced 11 Dec 2021; trials ran over the preceding three days. Verified via PIB (PRID 1780412,
  mirrored by DD News) plus ANI. Range of ~45 km per secondary sources; PIB did not state a fixed
  figure.
