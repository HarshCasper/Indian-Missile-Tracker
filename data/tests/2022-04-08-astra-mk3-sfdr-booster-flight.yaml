id: 2022-04-08-astra-mk3-sfdr-booster-flight
missile_id: astra-mk3
variant: SFDR technology demonstrator
designation: SFDR booster flight test
date: "2022-04-08"
date_precision: day
outcome: success
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO successfully flight-tested the Solid Fuel Ducted Ramjet booster at ITR Chandipur off the
  Odisha coast on 8 April 2022, demonstrating reliable functioning of all critical components of the
  propulsion system and meeting all mission objectives. Performance was confirmed via telemetry,
  radar and electro-optical tracking systems deployed by ITR.
notes: >-
  SFDR technology-demonstrator flight, not an integrated Astra Mk3 launch. Projected end-system
  range cited as ~350 km. Developed by DRDL Hyderabad with RCI and HEMRL Pune.
confidence: confirmed
