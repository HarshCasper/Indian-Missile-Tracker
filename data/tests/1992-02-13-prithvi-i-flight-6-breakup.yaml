id: 1992-02-13-prithvi-i-flight-6-breakup
missile_id: prithvi-i
variant: Prithvi-I (SS-150)
designation: Flight 6
date: "1992-02-13"
date_precision: day
outcome: failure
confidence: reported
site_id: sriharikota-shar
description: >-
  Sixth test-flight of the Prithvi-I. The missile broke up in mid-flight when subjected to
  'torsional stress' from a pre-programmed 15-degree twisting manoeuvre.
notes: >-
  NTI dates this 13 February 1992 (citing Xinhua, 6 May 1992); GCAT concurs (1992 Feb 13, SHAR,
  marked failed). NTI does not state the launch site; assigned to SHAR per GCAT, as the move to ITR
  Chandipur begins with the seventh flight.
