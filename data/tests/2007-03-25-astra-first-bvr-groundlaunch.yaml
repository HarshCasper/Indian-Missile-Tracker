id: 2007-03-25-astra-first-bvr-groundlaunch
missile_id: astra
variant: Mk1
date: 2007-03
date_precision: month
outcome: success
confidence: disputed
site_id: itr-chandipur
designation: Developmental ground-launch trial (control & guidance)
description: >-
  India test-fired the Astra in a developmental (ground-launched) configuration from a launch pad at
  the Interim Test Range, Chandipur. IRNA/GlobalSecurity place the firing on 25 March 2007 and
  report it successful; the missile is 3.8 m, single-stage, solid-fuel.
range_tested_km: 0
notes: >-
  Date disputed: IRNA/GlobalSecurity report 25 March 2007; NTI/The Statesman chronology reports 30
  March 2007 (success after an earlier failure). Likely the same campaign reported on different
  dates. Ground launch; the 2007 control/guidance trials encountered wing-induced oscillations per
  later DRDO accounts.
