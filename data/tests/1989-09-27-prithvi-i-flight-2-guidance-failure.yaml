id: 1989-09-27-prithvi-i-flight-2-guidance-failure
missile_id: prithvi-i
variant: Prithvi-I (SS-150)
designation: Flight 2
date: "1989-09-27"
date_precision: day
outcome: failure
confidence: disputed
site_id: sriharikota-shar
description: >-
  Second flight-test of the Prithvi-I. During the terminal phase the missile rolled uncontrollably
  and missed its target by several kilometres; the failure was traced to a defective inertial
  guidance system.
notes: >-
  Date of the second test is disputed: NTI/CNS places it 27 September 1989 (citing Defense & Foreign
  Affairs Weekly); defence journalist Raj Chengappa (Weapons of Peace) reports it occurred in
  November 1989; GCAT lists 26 September 1989. NTI does not state a launch site for this flight;
  assigned to SHAR Sriharikota per GCAT (move to ITR Chandipur begins with the seventh flight).
  Confidence downgraded to disputed due to the date conflict.
claims:
