id: 2022-12-15-agni-v-night-trial
missile_id: agni-v
variant: canisterised (road-mobile); lighter version with new technologies
designation: Night trial (ninth flight test)
date: "2022-12-15"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 5000
description: >-
  India successfully carried out a night trial of the Agni-V from Dr A.P.J. Abdul Kalam Island off
  the Odisha coast. The trial validated new technologies and equipment that make the missile lighter
  than earlier versions; the missile is capable of striking targets at ranges up to 5,000 km with a
  high degree of accuracy.
notes: >-
  Launch Complex 4, Abdul Kalam Island. Night trial; reported as testing a lighter composite version
  with new technologies. Ranges of 5,000-5,500 km cited by some Indian outlets with a 1.5 t payload.
