description: >-
  The Indian Navy test-fired the extended-range (over 400 km) naval variant of the BrahMos
  supersonic cruise missile from the destroyer INS Visakhapatnam, precisely hitting the designated
  target ship. Validated the destroyer's combat system and the extended-range missile.
notes: >-
  Ship-launched from INS Visakhapatnam (D66). Multiple sources place the firing in the Arabian Sea
  off the western coast; the launch site is therefore not one of the listed facilities, but site_id
  is set to offshore-visakhapatnam per the instruction to use that id for ship-launched tests and
  note the vessel. Verified via Sputnik/GlobalSecurity archive and Overt Defense.
