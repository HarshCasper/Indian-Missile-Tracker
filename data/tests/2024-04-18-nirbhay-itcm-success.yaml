description: >-
  Successful flight test of the Indigenous Technology Cruise Missile (ITCM), the Nirbhay derivative
  powered by the indigenous GTRE 'Manik' turbofan engine, from the ITR, Chandipur. All subsystems
  performed as expected; the missile followed waypoint navigation and demonstrated very low altitude
  sea-skimming flight. The trial was monitored by IAF Su-30MKI aircraft. Design strike range ~1,000
  km.
notes: >-
  Conducted 18 April 2024 from ITR Chandipur, Odisha. Air-monitored by Su-30MKI (the missile itself
  was ground-launched). Developed by DRDO's ADE (Bengaluru) with GTRE Manik propulsion. Note: the
  separate LRLACM maiden test (Nov 2024) is a different missile and is excluded.
