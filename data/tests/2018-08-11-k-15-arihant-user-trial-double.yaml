description: >-
  Two K-15 (B-05) SLBMs were test-fired back-to-back from INS Arihant on 11 August 2018, about 10 km
  off the Visakhapatnam coast, with the submarine submerged roughly 20 m deep. The missiles followed
  their pre-designated trajectories and struck the target area with high accuracy (close to zero
  CEP), as part of the first phase of user trials ahead of operationalisation. Two of the three
  August 2018 launches occurred on 11 Aug; the third on 12 Aug.
notes: >-
  Fired from INS Arihant, submerged ~20 m, ~10 km off Vizag. Secretly conducted; SLBM code-named
  B-05/Sagarika. Range not publicly disclosed. Date (11 Aug), site (offshore Vizag/INS Arihant) and
  outcome (success) agree across multiple independent sources (PTI-relayed reporting, Modern
  Diplomacy, New Indian Express, CSIS), hence confidence 'confirmed'. CSIS independently states
  three B-05 launches occurred between 11 and 12 August 2018.
