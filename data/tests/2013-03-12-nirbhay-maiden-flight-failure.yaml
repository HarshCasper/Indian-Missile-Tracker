site_id: itr-chandipur
range_tested_km: 0
description: >-
  Maiden flight test of the Nirbhay subsonic cruise missile from a road-mobile launcher at Launch
  Complex-3 of the ITR, Chandipur. Lift-off, booster separation and wing deployment succeeded, but
  roughly 15-17 minutes into flight the missile deviated from its planned path; mission controllers
  terminated the trial for coastal safety and the missile crashed near the Odisha coast
  (Jagatsinghpur district).
notes: >-
  Launched from Launch Complex-3, ITR Chandipur, Odisha. DRDO publicly characterised it as meeting
  basic objectives, but independent reporting (Zeenews, Defense Update) treated it as a failed
  maiden flight.
