variant: Guided Pinaka (Pinaka Mark-II Guided, extended range)
designation: Guided Pinaka Pokhran trials (Day 1, two firings)
date: "2019-03-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
range_tested_km: 90
description: >-
  Two Guided Pinaka extended-range rockets were test-fired on 11 March 2019 from the Pokhran Field
  Firing Range, Rajasthan, equipped with a state-of-the-art guidance kit (advanced navigation and
  control). Both weapons impacted intended targets with high precision and achieved desired
  accuracies; telemetry tracked the flights and all mission objectives were met. The guided Mk-II
  can fire a salvo of 12 rockets in 44 seconds across a 20-90 km band.
notes: >-
  Part of a three-trial campaign over two days: two firings on 11 March and one on 12 March 2019.
  Date, site (Pokhran), outcome and 90 km range agree across Army Technology,
  GlobalSecurity/Sputnik, LatestLY and domain-b. Developed by ARDE Pune, RCI Hyderabad and DRDL
  Hyderabad.
