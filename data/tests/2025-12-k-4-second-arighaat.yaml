id: 2025-12-k-4-second-arighaat
missile_id: k-4
variant: K-4
date: 2025-12
date_precision: month
outcome: success
confidence: disputed
site_id: offshore-visakhapatnam
range_tested_km: 3500
description: >-
  Reported second launch of the ~3,500 km K-4 from INS Arighaat in the Bay of Bengal off
  Visakhapatnam in late December 2025, described as part of the final validation cycle toward
  operationalising the sea-based leg of India's nuclear deterrent. No official Ministry of Defence
  statement was issued.
notes: >-
  ADDED test (missing from the original list). Submarine launch from INS Arighaat; recorded under
  offshore-visakhapatnam. Exact date disputed across media: reports give 23, 24 or 25 December 2025.
  No MoD/DRDO confirmation, so outcome reported as success per media but confidence is disputed.
  Some outlets erroneously describe this as the 'first' Arighaat launch, conflating it with the
  November 2024 test; multiple sources treat it as a distinct, subsequent test.
