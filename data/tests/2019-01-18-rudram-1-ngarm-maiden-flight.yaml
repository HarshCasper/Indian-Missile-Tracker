id: 2019-01-18-rudram-1-ngarm-maiden-flight
missile_id: rudram-1
variant: NGARM
designation: New Generation Anti-Radiation Missile (NGARM) maiden flight / first developmental trial
date: "2019-01-18"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 100
description: >-
  Maiden powered flight and first developmental trial of the NGARM (later named Rudram-1), India's
  first indigenous air-to-ground anti-radiation missile. Air-launched from an IAF Su-30MKI over the
  Bay of Bengal off the Odisha coast (ITR/Balasore range). The flight was conducted without an
  active seeker and validated the auto-launch sequence, store separation, dual-pulse solid
  propulsion, inertial navigation, autopilot/control system, thermal batteries, aerodynamics and
  airframe. The missile struck the designated target with high accuracy (reported ~10 m CEP) over a
  demonstrated range of about 100 km.
notes: >-
  Air-launched from Su-30MKI over the ITR/Balasore range, Bay of Bengal (use itr-chandipur for
  air-launched-over-Odisha-range per facility rules). This single event was the sensor-less maiden
  powered flight AND the ~100 km developmental trial; an earlier compiled list erroneously split it
  into a separate '18 January 2018' maiden flight, which is not supported by any reliable source
  (2018 saw only static motor firing in Jun-Jul 2018 and captive/carriage flight trials in Sep 2018,
  per GlobalSecurity). Date: 18 January 2019 is confirmed by CSIS Missile Threat, GlobalSecurity,
  Onmanorama and The Week; Wikipedia/Trishul blog (further-reading only) cite 25 January 2019 as a
  minority alternate. The ~100 km figure is the demonstrated range; designers say the missile can
  strike roughly double the intended range depending on launch altitude. Predates official
  'Rudram-1' naming (9 Oct 2020).
