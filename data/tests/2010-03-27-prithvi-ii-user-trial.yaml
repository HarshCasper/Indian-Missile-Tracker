id: 2010-03-27-prithvi-ii-user-trial
missile_id: prithvi-ii
variant: Prithvi-II
date: "2010-03-27"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 350
description: >-
  India successfully test-fired the nuclear-capable Prithvi-II from the Chandipur firing range at
  about 5:30 a.m., the same morning the naval Dhanush variant was fired from a ship offshore. The
  Prithvi-II met all parameters per the ITR director.
notes: >-
  Fired in quick succession with Dhanush (a separate Prithvi naval variant, not logged here). One
  RIA Novosti report cited a 295 km range for Prithvi-II while other sources cite the standard 350
  km maximum range; see claims.
