designation: Serial-production clearance firing
date: "2021-12-08"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 290
description: >-
  The air-launched BrahMos was successfully fired from a Su-30MKI off the Odisha coast at about
  10:30 hours; the missile followed its pre-planned trajectory and met all mission objectives. The
  'copy book' flight confirmed the missile's structural integrity and functional performance and
  cleared the system for serial production in India.
notes: >-
  Air-launched from a Su-30MKI over ITR Chandipur / Bay of Bengal off Odisha. Operational range ~290
  km (capability). MoD/PIB-attributed release reported by multiple outlets (ANI, Business Standard,
  Airforce Technology, Sputnik).
