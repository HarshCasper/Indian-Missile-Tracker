id: 1999-04-11-agni-ii-maiden-flight
missile_id: agni-ii
variant: Agni-II
designation: Maiden flight test
date: "1999-04-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 2000
description: >-
  First flight test of the Agni-II MRBM, fired at 09:47 IST from a rail-mobile launcher (IC-4 pad)
  on Inner Wheeler Island (later Dr A.P.J. Abdul Kalam Island) off the Odisha coast. Officials
  called it a 'perfect text-book launch'; the missile splashed down roughly 2,000-2,100 km downrange
  in the Bay of Bengal on a trajectory said to simulate a 2,800-3,000 km range. Defence Minister
  George Fernandes and scientific adviser A.P.J. Abdul Kalam were present.
notes: >-
  Launched from converted rail carriage / rail-mobile launcher. India notified Pakistan in advance
  per the Lahore agreement. Simulated full range cited as 2,800-3,000 km. Date+site+outcome agree
  across GlobalSecurity, Arms Control Association and CSIS Missile Threat.
