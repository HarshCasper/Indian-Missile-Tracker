description: >-
  The Prithvi-II was successfully flight-tested from Launch Complex-III, ITR Chandipur, as part of a
  regular Army training exercise. The missile reached its pre-defined target in the Bay of Bengal
  with accuracy better than 10 metres in what DRDO described as a textbook launch.
notes: User/training trial. SP's M.A.I. and The Tribune contemporaneous coverage.
