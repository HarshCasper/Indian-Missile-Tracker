description: >-
  The first flight test of the Nag third-generation anti-tank guided missile, developed by DRDO
  under the Integrated Guided Missile Development Programme (IGMDP). Reported as conducted in
  November 1990 as the maiden developmental launch; specific outcome details are not documented in
  reliable sources.
notes: >-
  Army Technology (foreign-news) states 'The first test of Nag was conducted in November 1990.' No
  precise day or detailed outcome documented. ITR Chandipur/Balasore is the assessed early test
  range for the program; exact site not confirmed in sources. Outcome left unknown.
