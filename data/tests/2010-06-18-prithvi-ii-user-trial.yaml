site_id: itr-chandipur
range_tested_km: 350
description: >-
  India successfully test-fired the Prithvi-II from a mobile launcher at Launch Complex-3, ITR
  Chandipur, at around 6:50 a.m. The user trial was conducted by the Army's Strategic Forces
  Command; the trajectory was tracked by radars and electro-optic telemetry stations. ITR Director S
  P Dash confirmed the trial went well.
notes: Range capability ~350 km, payload 500 kg. Corroborated by IRNA and Deccan Herald.
