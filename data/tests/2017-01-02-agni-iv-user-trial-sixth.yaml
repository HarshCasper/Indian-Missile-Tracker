missile_id: agni-iv
designation: Strategic Forces Command user trial (6th trial)
date: "2017-01-02"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 4000
description: >-
  The nuclear-capable Agni-IV was successfully flight-tested at about 11:55 hrs from Launch
  Complex-4 of the Integrated Test Range at Dr A.P.J. Abdul Kalam Island as part of a user trial,
  the sixth trial of the missile. The surface-to-surface missile met all mission objectives.
notes: >-
  Sixth trial; conducted by Strategic Forces Command with a mobile launcher. Date, site and success
  independently re-verified. Range figure conflicts: most Indian reports cite the missile's 4,000 km
  strike range, while CSIS Missile Threat lists 3,100 km for this specific test; both recorded as
  claims.
