description: >-
  The Indian Navy's Visakhapatnam-class destroyer INS Imphal test-fired the extended-range BrahMos
  supersonic cruise missile during her maiden/pre-commissioning sea trials, scoring a 'bull's eye'
  direct hit. Described as the first-ever test-firing of the extended-range BrahMos by a warship
  before commissioning.
notes: >-
  Ship-launched from INS Imphal during pre-commissioning trials; not one of the listed land
  facilities, site_id set to offshore-visakhapatnam per the ship-launched instruction with the
  vessel noted. Range assessed in excess of 500 km by Janes / over 400-500 km elsewhere. Verified
  via The Week and Janes.
