description: >-
  Successful Army training trial of the Agni-II from Wheeler Island at ~10:20 IST. The ~660-second
  flight achieved full ~2,000 km range, splashing down at the designated Bay of Bengal target.
  Reported to have validated an improved navigation system for better accuracy.
notes: >-
  Army user/training trial; CSIS calls the 7 April 2013 trial a total success. Outcome+approx. range
  corroborated by CSIS Missile Threat and contemporary Indian reporting. New-navigation-system claim
  is reported, not officially confirmed.
