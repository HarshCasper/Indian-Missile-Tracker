id: 2010-03-15-aad-aborted-failure
missile_id: aad
variant: Ashwin
designation: AAD interceptor trial (aborted)
date: "2010-03-15"
date_precision: day
outcome: failure
confidence: confirmed
site_id: abdul-kalam-island
description: >-
  Planned AAD intercept that was not completed: the Prithvi target missile fired from ITR Chandipur
  (Launch Complex III, ~10:02 hrs) deviated from its trajectory after about 11 km (T+20 sec, onboard
  system malfunction) and fell into the sea, so the AAD interceptor at Wheeler Island was not
  launched. DRDO described the interceptor as self-aborting due to the target's failure.
notes: >-
  Target launched from ITR Chandipur; interceptor sited at Wheeler Island. The NTI chronology
  (citing Rediff) dates this 15 March 2011 and some agency copy says 16 March 2010, but the majority
  of contemporaneous reporting (RIA Novosti, IRNA, Livefist) dates the aborted trial to 15 March
  2010.
claims:
  - field: date
    text: >-
      NTI chronology dates the failed AAD launch 15 March 2011 (citing Rediff); contemporaneous
      reporting fixes it at 15 March 2010
    basis: reported
