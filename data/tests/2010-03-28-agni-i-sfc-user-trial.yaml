description: >-
  Strategic Forces Command user trial of the 700 km-range Agni-I from Wheeler Island. The
  surface-to-surface single-stage solid-fuel missile was fired from a mobile launcher; the dummy
  warhead reentered and impacted in the Bay of Bengal with guidance and reentry systems working
  well.
