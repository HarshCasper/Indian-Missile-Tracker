id: 2022-04-11-helina-high-altitude-ladakh-first
missile_id: helina
variant: HELINA (Army version)
designation: First high-altitude user validation flight test
date: "2022-04-11"
date_precision: day
outcome: success
confidence: confirmed
range_tested_km: 7
apogee_km: 6
description: >-
  HELINA was successfully flight-tested on 11 April 2022 from an Advanced Light Helicopter (ALH) at
  a high-altitude range in eastern Ladakh as part of user validation trials jointly conducted by
  DRDO, the Indian Army and the IAF. The missile, using its Imaging Infra-Red seeker in
  Lock-On-Before-Launch mode, accurately engaged a simulated tank target, proving efficacy at high
  altitudes.
notes: >-
  Conducted at a high-altitude range in eastern Ladakh, which is not among the listed known
  facilities; site_id left empty. In continuation of validation trials conducted earlier at Pokhran.
  Janes notes high-altitude ALH tests are carried out at altitudes of 6 km or higher; the exact
  altitude for this specific flight was not disclosed, so the apogee figure is approximate.
