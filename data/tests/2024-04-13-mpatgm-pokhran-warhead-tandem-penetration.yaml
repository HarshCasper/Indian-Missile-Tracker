date: "2024-04-13"
date_precision: day
outcome: success
confidence: confirmed
site_id: pokhran-range
description: >-
  DRDO and the Indian Army conducted successful warhead flight trials of the complete MPATGM weapon
  system (missile, launcher, target acquisition system, fire-control unit) at the Pokhran Field
  Firing Range. Penetration trials of the tandem warhead were completed successfully and the warhead
  was found capable of defeating modern armour-protected main battle tanks, marking conclusion of
  technology development.
notes: >-
  Pokhran Field Firing Range, Rajasthan. Warhead Flight Trials conducted 13 April 2024; PIB release
  dated 14 April 2024 (PRID 2017876). Field-evaluated in different flight configurations; specific
  range not quantified in this release. Re-verified against PIB (via GlobalSecurity mirror) and
  Janes.
