id: 2012-04-19-agni-v-maiden-flight
missile_id: agni-v
variant: open-launch (rail-mobile)
designation: Maiden flight (first developmental test)
date: "2012-04-19"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 5000
apogee_km: 600
description: >-
  India conducted the maiden flight test of the three-stage, solid-fuel Agni-V at about 08:05 IST
  from Launch Complex 4 of the Integrated Test Range on Wheeler Island (now Dr A.P.J. Abdul Kalam
  Island), using a rail-mobile launcher. The re-entry vehicle impacted a pre-designated target point
  more than 5,000 km away in the Indian Ocean after a roughly 20-minute flight.
notes: >-
  Launch Complex 4, Wheeler Island (now Dr A.P.J. Abdul Kalam Island). Apogee figures vary across
  sources (RV re-entry altitude vs. peak); ~600 km is an assessed peak figure and not uniformly
  cited.
