description: >-
  India successfully test-fired the nuclear-capable Prithvi-II (350 km range) from a mobile launcher
  at Chandipur, Odisha, at around 10:40 a.m. The missile followed its expected trajectory and
  impacted near its pre-designated point in the Bay of Bengal.
notes: ADDED test, previously missing. Press TV report archived by GlobalSecurity.
