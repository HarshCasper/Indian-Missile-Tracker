id: 2019-02-08-astra-mk3-sfdr-second-flight
missile_id: astra-mk3
variant: SFDR technology demonstrator
designation: SFDR propulsion-based missile system (second flight test)
date: "2019-02-08"
date_precision: day
outcome: success
site_id: itr-chandipur
range_tested_km: 0
description: >-
  Second flight test of the SFDR propulsion system from ITR Chandipur on 8 February 2019. The
  missile was launched to high altitude to simulate aircraft-release conditions, then the
  nozzle-less booster ignited and accelerated the vehicle to ramjet Mach number; per the Ministry of
  Defence statement, ground-booster performance and ground-booster/nozzle-less-booster separation
  were satisfactory, the trajectory was tracked by telemetry and radar to touchdown, and all mission
  objectives were met.
notes: >-
  SFDR technology-demonstrator flight, not an integrated Astra Mk3 launch. The test date is 8
  February 2019 (MoD statement, reported by Republic World). Army-Technology's article
  carries an 11 February 2019 dateline, but that is its publication date, not the test date, so
  there is no genuine date conflict.
confidence: confirmed
