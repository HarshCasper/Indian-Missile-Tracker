id: 2004-12-brahmos-pokhran-land-attack
missile_id: brahmos
variant: Surface-to-surface (land-attack) Block I
designation: First Army land-attack test
date: 2004-12
date_precision: month
outcome: success
confidence: disputed
site_id: pokhran-range
description: >-
  First test of the land-attack / surface-to-surface BrahMos (Block I) for the Indian Army,
  conducted at the Pokhran range in Rajasthan, where the missile demonstrated an evasive 'S'
  manoeuvre at around Mach 2.8.
notes: >-
  Date is disputed: most secondary sources place this in December 2004, but a precise day is not
  reliably attested and some accounts cite November 2004. Recorded at month precision. CAUTION: the
  URL https://www.brahmos.com/brahmos-in-media/46 cited in the original compilation for a '21
  November 2004' claim actually serves a report about a 7 November 2015 Pokhran test, so it does not
  support a 2004 date and has been dropped as a citation.
claims:
  - field: date
    text: December 2004 (evasive 'S' manoeuvre at Mach 2.8, Pokhran)
    basis: reported
