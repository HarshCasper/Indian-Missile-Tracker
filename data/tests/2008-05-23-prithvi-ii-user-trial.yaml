site_id: itr-chandipur
range_tested_km: 350
description: >-
  Indian Army and DRDO successfully conducted a user trial of the Prithvi-II from the Integrated
  Test Range at Chandipur, Odisha. The missile lifted off vertically at about 10:30 a.m. and
  impacted the pre-designated splash-down point in the Bay of Bengal. Described as the first test
  after the missile's induction into the armed forces.
notes: Daytime launch (~10:30 IST). Corroborated by RIA Novosti and The Tribune contemporaneous coverage.
