description: >-
  ITCM flight test from Launch Complex-3 of the ITR, Chandipur, powered by the indigenous small
  turbofan engine (STFE/Manik). Reported as a successful trial that validated the indigenous engine
  after the 2020-2022 setbacks, clearing the way to integrate the STFE into the Long-Range Land
  Attack Cruise Missile (LRLACM).
notes: >-
  Test conducted 21 February 2023 from LC-3, ITR Chandipur; reported by some outlets on 23 February
  2023. Outcome reported as success. Range/duration not publicly quantified.
