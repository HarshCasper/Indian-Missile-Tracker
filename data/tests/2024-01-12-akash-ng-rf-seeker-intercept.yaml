id: 2024-01-12-akash-ng-rf-seeker-intercept
missile_id: akash-ng
date: "2024-01-12"
date_precision: day
site_id: itr-chandipur
outcome: success
designation: Flight test vs high-speed UAV at very low altitude
description: >-
  DRDO conducted a successful flight test of the Akash-NG from the Integrated Test Range, Chandipur,
  on 12 January 2024 against a high-speed unmanned aerial target flying at very low altitude. The
  target was intercepted and destroyed, validating the complete weapon system with the indigenously
  developed Radio Frequency seeker, launcher, multifunction radar and command/control/communication
  system.
confidence: confirmed
notes: >-
  Primary source is the PIB (Ministry of Defence) release PRID 1995445; corroborated by Business
  Standard and Broadsword (Ajai Shukla).
