id: 2021-06-28-agni-prime-maiden-developmental-flight
missile_id: agni-prime
variant: Agni-P (developmental)
designation: First developmental flight test
date: "2021-06-28"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
range_tested_km: 0
description: >-
  Maiden developmental flight test of the new-generation, canisterised, two-stage solid-propellant
  MRBM Agni-P (Agni-Prime), conducted at about 1055 hrs from a canisterised launcher off the Odisha
  coast (Dr A.P.J. Abdul Kalam Island). The missile followed a textbook trajectory and met all
  mission objectives; telemetry, radar and electro-optical stations along the eastern coast tracked
  the flight. Stated design strike range is 1,000-2,000 km.
notes: >-
  First flight of the system. Source descriptions cite road-mobile canister and maneuverable
  re-entry vehicle (MaRV) features; no range was demonstrated/stated for this specific flight. Date
  (28 June 2021), site and 1055 hrs time independently verified via The Tribune and GlobalSecurity's
  mirror of the DRDO/MoD account.
