id: 2022-04-12-helina-high-altitude-ladakh-second
missile_id: helina
variant: HELINA (Army version)
designation: Second high-altitude user validation flight test
date: "2022-04-12"
date_precision: day
outcome: success
confidence: confirmed
range_tested_km: 7
description: >-
  HELINA was again successfully flight-tested on 12 April 2022 from an Advanced Light Helicopter at
  a high-altitude range in eastern Ladakh, the second successful test on successive days. The trial
  was carried out at a different range and altitude than the first, and the missile accurately
  engaged the simulated tank target, establishing consistent performance of the complete system
  including the Imaging Infra-Red seeker and paving the way for induction into the armed forces.
notes: >-
  Conducted at a high-altitude range in eastern Ladakh (different range/altitude from the 11 April
  test); not among the listed known facilities, so site_id left empty. Second of two successive-day
  high-altitude validation tests. No further confirmed HELINA/Dhruvastra flight tests are documented
  after April 2022; the program subsequently moved toward induction (LCH Prachand integration trials
  planned for later, not yet conducted as of mid-2026).
