id: 2011-07-21-prahaar-maiden-flight
missile_id: prahaar
designation: Prahaar maiden flight test
date: "2011-07-21"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
apogee_km: 35
range_tested_km: 150
description: >-
  DRDO conducted the maiden flight test of the Prahaar surface-to-surface tactical ballistic missile
  at about 08:20 IST on 21 July 2011 from Launch Complex-III, ITR Chandipur, off the Odisha coast
  (Balasore). The single-stage solid-propellant missile reached an apogee of about 35 km, flew ~150
  km in roughly 250 seconds, and struck a pre-designated target in the Bay of Bengal with terminal
  accuracy under 10 m, meeting all mission objectives. Independently corroborated by the PIB
  release, Broadsword (Ajai Shukla), Livefist, and GlobalSecurity.
notes: >-
  Maiden flight. Missile length 7.3 m, diameter 0.42 m (420 mm), launch weight ~1,280 kg, ~200 kg
  payload. Intended to fill the gap between multi-barrel rockets (Pinaka) and Prithvi-class SRBMs;
  described as comparable to the US ATACMS. Date, site, and outcome agree across PIB plus at least
  two independent reliable sources.
