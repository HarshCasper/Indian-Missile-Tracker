date: "2021-03-05"
date_precision: day
outcome: success
site_id: itr-chandipur
range_tested_km: 0
description: >-
  DRDO conducted a successful flight demonstration of SFDR technology from ITR Chandipur off the
  Odisha coast at around 1030 hrs on 5 March 2021. An air-launch scenario was simulated using a
  booster motor, after which the nozzle-less booster accelerated the vehicle to the required Mach
  number for ramjet operation; all subsystems including the ground booster motor performed as
  expected.
notes: >-
  SFDR technology-demonstrator flight, not an integrated Astra Mk3 launch. Developed by DRDL
  Hyderabad with RCI and HEMRL. PIB official release PRID 1702670.
confidence: confirmed
