description: >-
  An unarmed Agni-IV with a 4,000 km strike range was successfully test-fired at about 09:45 local
  time from the Dr A.P.J. Abdul Kalam (Wheeler) Island launch complex as a Strategic Forces Command
  user trial, the fifth trial of the missile. It followed its trajectory and met all mission
  parameters, monitored by telemetry, electro-optical and radar stations along the coast.
notes: >-
  Described as the fifth trial of the Agni-IV; conducted by SFC of the Indian Army. Date, site and
  success independently re-verified.
