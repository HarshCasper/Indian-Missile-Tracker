id: 2017-02-11-pdv-second-test
missile_id: pdv
variant: PDV
designation: PDV interceptor test (second test)
date: "2017-02-11"
date_precision: day
outcome: success
confidence: confirmed
site_id: abdul-kalam-island
apogee_km: 100
description: >-
  Second flight test of the PDV exo-atmospheric interceptor, launched at about 7:45 a.m. from Abdul
  Kalam Island off the Odisha coast. In a fully automated engagement, radar detected and tracked a
  two-stage target missile fired from a ship in the Bay of Bengal mimicking a hostile ballistic
  missile from over 2,000 km, and the PDV intercepted it at roughly 100 km altitude.
notes: >-
  PDV is a two-stage solid-fuelled interceptor fitted with an inertial navigation system and an
  imaging infrared (IIR) seeker to home on the warhead in the exo-atmosphere (above ~50 km). Sources
  describe PDV as capable of intercepting at more than ~120 km. Date, site and success corroborated
  across Deccan Herald (PTI), CSIS Missile Threat and The Diplomat.
claims:
  - field: apogee_km
    value: 100
    text: intercepted the hostile ballistic missile target at 100 km altitude
    basis: reported
    source:
      title: Interceptor missile successfully test-fired
      tier: indian-news
