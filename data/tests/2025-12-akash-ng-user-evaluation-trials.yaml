description: >-
  DRDO completed the User Evaluation trials of the Akash-NG missile system, reported in December
  2025, clearing the way for induction into the Indian armed forces. The missiles intercepted aerial
  targets across multiple scenarios including near-boundary low-altitude and long-range
  high-altitude engagements.
confidence: reported
notes: >-
  Month-level (announced ~24 December 2025; specific firing dates not disclosed). Reported by the
  government broadcaster News on Air (All India Radio); Defence Minister Rajnath Singh congratulated
  the teams.
