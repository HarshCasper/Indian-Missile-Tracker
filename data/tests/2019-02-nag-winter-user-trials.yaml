description: >-
  The Nag ATGM cleared its winter user trials in February 2019 at the Pokhran Field Firing Ranges.
  Together with the subsequent summer trials, all ten missiles fired during the winter and summer
  user trials successfully hit their targets.
notes: >-
  Reported by Army Technology and other Indian press; MoD stated all ten missiles across winter (Feb
  2019) and summer (Jul 2019) trials struck their targets. By difference from the six summer
  firings, four were fired in the winter trials. No precise day reported.
