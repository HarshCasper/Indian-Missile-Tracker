site_id: itr-chandipur
range_tested_km: 350
description: >-
  The Prithvi-II was successfully test-fired from a mobile launcher at Launch Complex-3, ITR
  Chandipur, around 11:00 a.m. The trial, fired in conjunction with a Dhanush launch from a warship,
  was a user trial assessing user-specific requirements.
notes: User trial. Corroborated by IRNA and National Herald.
