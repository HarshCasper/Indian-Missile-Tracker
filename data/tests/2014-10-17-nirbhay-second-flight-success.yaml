id: 2014-10-17-nirbhay-second-flight-success
missile_id: nirbhay
variant: Nirbhay (ground-launched, developmental)
designation: Second developmental flight test
date: "2014-10-17"
date_precision: day
outcome: success
confidence: confirmed
site_id: itr-chandipur
range_tested_km: 1000
description: >-
  Second flight test, fired from a mobile launcher at ITR Chandipur. The missile separated from its
  booster, deployed wings and cruised through 15 pre-designated waypoints guided by an inertial
  navigation system aided by GPS before splashing into the Bay of Bengal. Widely reported as the
  first fully successful Nirbhay flight, to a range of about 1,000 km (some accounts cite ~1,050 km
  over a ~70 minute flight).
notes: >-
  First successful Nirbhay flight. Demonstrated range reported as ~1,000 km (Al Jazeera, CSIS) to
  ~1,050 km (Ajai Shukla/Business Standard).
